apis:
- name: Zinnia Policy Transactions API
  description: Enterprise API for enforcing policy transactions and validations across the in-force annuity and life book
    - financial and non-financial transaction management, policy party management, systematic program management and eligibility/validation
    pre-checks. 102 operations across eligibility check, validation and submit triples for withdrawals, surrenders, loans,
    fund transfers, premiums, RMDs, reinstatement, free-look cancellation, party and address/bank/phone/email changes.
  humanURL: https://developers.zinnia.com/apis/policy-transactions-1-0-2/docs
  baseURL: https://qa.api.zinnia.io
