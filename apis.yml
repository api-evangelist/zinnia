aid: zinnia
name: Zinnia
description: Zinnia is an Eldridge-backed insurance technology and third-party administration company that provides the policy
  administration, new business, order entry, illustration, document and in-force servicing infrastructure behind a large share
  of the US life insurance and annuity market. Formerly SE2, and now the parent of Policygenius, Ebix's life and annuity software
  assets, AnnuityNet, VitalQuote, WinFlex, SmartOffice and Zahara, Zinnia runs an enterprise API gateway at api.zinnia.io
  and publishes ten OpenAPI contracts on a Kong developer portal at developers.zinnia.com covering case management, enterprise
  documents, illustration generation, product configuration, new business for life and annuity, Market Connect headless order
  entry, policy detail, and 102 policy transaction operations. Zinnia contributed its Enterprise API framework to the Insured
  Retirement Institute, whose first four standardized in-force annuity transaction APIs are built on it.
