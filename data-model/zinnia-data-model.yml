  - Policy Service
  - Policy Transactions
- field: documentId
  meaning: Opaque handle assigned at upload by the Enterprise Document Service; store it and pass it back on every later call for that document.
  used_by:
  - Enterprise Documents
- field: caseId
  meaning: Case instance identifier grouping the documents, requirements and transactions belonging to one piece of work.
  used_by:
  - Case Management
  - Policy Transactions
  - Illustration Client Cases
- field: transactionId
  meaning: Order Entry transaction handle; also the correlation anchor in the Market Connect error envelope.
  used_by:
  - Market Connect Order Entry
  - Policy Transactions
- field: partyId
  meaning: Party (owner, insured, beneficiary, payor, agent) on a policy. Party sub-resources hang off /parties/{partyId}/....
  used_by:
  - Policy Transactions
- field: arrangementId
  meaning: Systematic program (SWP) arrangement on a policy - the handle an IRI Systematic Withdrawal Program Update addresses.
  used_by:
  - Policy Transactions
- field: cusip
  meaning: CUSIP used as an alternate policy/product address on getEligibleTransactions.
  used_by:
  - Policy Transactions
- field: DTCC Participant ID
  meaning: DTCC Insurance & Retirement Services participant identifier tying a carrier or distributor to money movement.
  used_by:
  - Policy Service
  - Policy Transactions
  - New Business Annuity
