domain_standards:
- id: acord
  name: ACORD (Association for Cooperative Operations Research and Development) data standards
  conforms: true
  grade: aligned
  evidence: Declared in the contracts themselves, not on a marketing page. Market Connect Order Entry 1.0.3 adds "an optional ACORD-aligned prefill node to the create-transaction request, enabling pre-population
    of party and product fields" (info.description Version History) and the PrefillRequest schema is described as "Optional ACORD-aligned prefill data to pre-populate party and product fields in the new
    transaction". Policy Service defines bankId as "In the context of ACORD standards (the global data standards body for insurance), Bank ID refers to a unique identifier used to specify a financial institution",
    and Policy Transactions carries eight further Acord-qualified field descriptions.
  spec_locations:
  - openapi/zinnia-market-connect-order-entry-openapi.yml#/info/description
  - openapi/zinnia-market-connect-order-entry-openapi.yml#/components/schemas/PrefillRequest
  - openapi/zinnia-policy-service-openapi.yml#/components/schemas (bankId)
  - openapi/zinnia-policy-transactions-openapi.yml
  specs:
  - market-connect-order-entry
  - policy-service
  - policy-transactions
  note: The contracts declare ACORD ALIGNMENT of specific fields and a prefill payload. They do not serve ACORD AL3 or ACORD XML messages, so this is a REST/JSON surface that speaks ACORD semantics rather
    than an ACORD message contract.
- id: dtcc-insurance-processing
  name: DTCC Insurance & Retirement Services (I&RS) participant and money-movement identifiers
  conforms: true
  grade: aligned
  evidence: 'DTCC identifiers are first-class fields across the servicing and origination surface: Policy Service carries DtccParticipantRecord / DtccParticipantReference schemas and 19 DTCC-qualified field
