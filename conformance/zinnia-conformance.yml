  - new-business-annuity
  - policy-service
  - policy-transactions
- id: iri-annuity-in-force-apis
  name: Insured Retirement Institute (IRI) standardized in-force annuity transaction APIs
  conforms: true
  grade: contributor
  evidence: 'IRI approved four in-force transaction APIs - One-Time Withdrawal Quote, One-Time Withdrawal, Systematic Withdrawal Program Setup and Systematic Withdrawal Program Update - built on the Enterprise
    API framework Zinnia contributed, announced 2026-04-09 (https://zinnia.com/news/zinnia-drives-industry-wide-shift-to-open-api-standards-for-annuities). All four transaction shapes are present in the
    published Policy Transactions contract: partialWithdrawalOneTime1 with its eligibility/validation pair, systematicProgramQuote, systematicProgram1 and systematicProgramUpdates.'
  spec_locations:
  - openapi/zinnia-policy-transactions-openapi.yml#partialWithdrawalOneTime1
  - openapi/zinnia-policy-transactions-openapi.yml#systematicProgramQuote
  - openapi/zinnia-policy-transactions-openapi.yml#systematicProgram1
  - openapi/zinnia-policy-transactions-openapi.yml#systematicProgramUpdates
  governance: Zinnia holds a seat on the IRI Messaging Standards Governance Committee. A Policy Inquiry API is named as forthcoming.
  note: The published contract does not itself carry an IRI version marker or conformance declaration, so the mapping between these operations and the IRI-approved shapes is Zinnia's public claim plus a
    name-level match against the contract - it is not machine-assertable from the spec.
