note: 'Zinnia publishes a full non-production environment ladder in its contracts - dev, qa and uat hosts under api.zinnia.io, each with its own Auth0 identity tenant whose OIDC discovery document is live
  and anonymously readable. This is a real, documented test surface, but it is NOT a self-serve sandbox: there is no signup, no test key, no published test policy numbers, plan codes or fixtures, and the
  Enterprise Documents API states "Contact your Zinnia representative to obtain credentials". No Sandbox pointer is wired in apis.yml for that reason. Six of the ten published contracts name ONLY non-production
  servers, which means the specification a reader downloads from the portal frequently points at a test environment rather than production.'
