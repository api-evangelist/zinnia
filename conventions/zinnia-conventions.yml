    gap in this profile.
dry_run_mode:
  supported: true
  style: separate pre-flight operations
  note: 'Policy Transactions implements a three-stage pattern for nearly every financial and non-financial transaction: POST .../{transaction}/eligibilitycheck decides whether the policy may do it at all,
    POST .../{transaction}/validation validates the concrete request payload, and only then POST .../{transaction} submits it. There is also POST /policy/v2/transactions/{planCode}/{policyNumber}/eligibility/transaction
    (evaluateTransactionEligibilityByPolicy) and GET /bpm/v1/policies/{cusip}/{policyNumber}/eligibleTransactions to enumerate what a policy is eligible for before choosing an action. This is a genuine
    rehearsal surface, and it is unusually complete.'
  examples:
