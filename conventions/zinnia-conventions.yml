  evidence: No Idempotency-Key (or equivalent) header appears in any of the 215 operations across the ten published contracts; a header census over every operation parameters[] returns only "Authorization"
    (20) and "x-correlation-id" (7). Neither the Policy Service error/troubleshooting guide nor the Enterprise Documents guide documents replay protection, and the published retry guidance ("you MAY retry
