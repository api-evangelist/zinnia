          example: Outbound
        policySourceDescription:
          type: string
          description: Policy Source Description provides detailed contextual information about the origin of a policy application, supplementing the high-level Policy Source value. It includes specific identifiers or descriptive data such as the underwriter's name, referral source, agency, platform, or originating system that processed or submitted the application
          example: Underwriter name
        product:
          $ref: '#/components/schemas/Product'
        banding:
          type: string
          enum:
          - NOPREMIUMBANDING
          description: Banding refers to the grouping of policy coverage amounts into different tiers or "bands" that impact pricing, underwriting, and premium rates. It is commonly used in life insurance pricing models to offer lower per-unit costs for higher coverage amounts
        matchBonusVersion:
          type: string
          description: The Match Bonus Version refers to the specific version of match bonus rates applied to a policy or annuity, based on the release date of that rate structure. It ensures that the correct bonus percentage, eligibility criteria, and payout structure are applied according to the policy’s issue date and applicable rate updates
          example: 2021.10.15
        packageId:
          type: string
          description: Package Id identifies the investment package applicable to the policy, defining the funds and investment options available. The package is determined at the policy level and may change in response to policy events or configuration changes.
