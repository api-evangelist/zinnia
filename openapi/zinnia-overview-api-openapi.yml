        policyTerm:
          type: number
          format: int32
          description: The Policy Term refers to the number of years a life insurance or annuity contract remains active under its defined premium payment structure. It can represent the fixed duration of a term policy or the maximum period for premium payments in a permanent or flexible premium plan
          example: 20
        policyYear:
          type: number
          format: int32
          description: The Policy Year refers to the number of years that have passed since the policy’s effective date. It is used to track policy duration, benefits, premium schedules, surrender charges, and other contractual provisions
          example: 1
        monthOfYear:
          type: number
          format: int32
          description: The Policy Months refers to the number of months that have passed since the policy’s effective date. It is used to track policy duration, premium schedules, benefits, and contractual provisions on a monthly basis
          example: 2
        policyNumber:
          type: string
          description: The Policy Number is a unique identifier assigned to a life insurance or annuity contract by the insurance carrier. It serves as the official reference number for tracking, managing, and servicing the policy throughout its lifetime
          example: POLICY1234567890
        parentPolicyNumber:
          type: string
          description: The Parent Policy Number is the unique identifier of the original or source insurance policy or contract from which the current policy has been derived, continued, or linked. It serves as a reference point for tracking policy lineage, inheritance, or transformation, and is used to establish relationships between multiple policies
          example: POLICY12345
        priorPolicyNumber:
          type: string
          description: The unique identifier of the original policy number of a policy in the case of a conversion, replacement, exchange or reissue
