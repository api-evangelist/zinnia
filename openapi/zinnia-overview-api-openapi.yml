    RequiredMinimumDistribution:
      type: object
      properties:
        totalRequiredMinimumDistributionAnnualAmount:
          type: number
          format: double
          description: The Total RMD (Required Minimum Distribution) Annual Amount refers to the minimum amount that a policyholder must withdraw from their annuity or retirement account each year to avoid IRS penalties. This applies to tax-deferred retirement accounts once the account owner reaches the Required Beginning Date (RBD).
          example: 12.42342
        remainingRequiredMinimumDistributionAmount:
          type: number
          format: double
          description: The Remaining RMD Amount refers to the amount of Required Minimum Distribution (RMD) that the policyholder still needs to withdraw before the end of the calendar year to avoid IRS penalties. It is calculated as the Total RMD Annual Amount minus any withdrawals already taken during the year
          example: 12.42342
        actuarialPresentValue:
          type: number
          format: double
          description: The Actuarial Present Value (APV) Amount refers to the present value of future expected benefits or cash flows from a life insurance policy, annuity, or pension plan, discounted to the end of the year. It is used in actuarial calculations to estimate the current value of future liabilities or benefits, considering mortality rates, interest rates, and time value of money.
          example: 12.42342
        priorYearEndAccountValue:
          type: number
          format: double
          description: The Prior Year-End Account Value refers to the total account value of a life insurance policy or annuity as of December 31 of the previous year. It represents the ending balance of the policy`s cash value or investment portion at the close of the prior year, before any transactions in the current year
          example: 12.42342
        requiredMinimumDistributionRecalculationDate:
          type: string
          format: date
          description: The RMD Recalculation Date refers to the date when the Required Minimum Distribution (RMD) amount is automatically recalculated for qualified annuities and retirement contracts. This recalculation occurs annually, starting in the year after December 31 of the year the owner turns 69.5, and continues every year thereafter
          example: '2023-01-01'
        requiredMinimumDistributionCalculationOption:
          $ref: '#/components/schemas/RequiredMinimumDistributionCalculationOption'
        priorCalendarYearRequiredMinimumDistributionAmount:
          type: number
          format: double
          description: The Required Minimum Distribution (RMD) amount that was required to be withdrawn from the contract during the previous calendar year, as determined under applicable IRS life expectancy rules.
          example: 12.42342
        lifeExpectancyFactor:
          type: number
          format: double
          description: The life expectancy divisor obtained from the applicable IRS life expectancy table, used to calculate the Required Minimum Distribution (RMD) amount for a given year.
          example: 12.42342
