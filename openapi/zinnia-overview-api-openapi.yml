    MarketValueAdjustment:
      type: object
      properties:
        marketValueAdjustmentIndicator:
          type: boolean
          description: The MVA Indicator is a flag or marker that indicates whether a Market Value Adjustment (MVA) applies to an annuity or investment. This adjustment impacts the contract value when withdrawals or surrenders occur before the end of the contract’s term
        marketValueAdjustmentAmount:
          type: number
          format: double
          description: The MVA Adjustment refers to the Market Value Adjustment applied to an annuity contract when a withdrawal or surrender occurs before the end of the contract period. It adjusts the contract value based on changes in interest rates since the contract was issued.
          example: 12.42342
        marketValueAdjustmentPeriod:
          type: number
          format: int32
          example: 1
          description: MVA Period (Market Value Adjustment Period) refers to the specific timeframe during which a Market Value Adjustment (MVA) may be applied to withdrawals, surrenders, or transfers from a fixed or indexed annuity contract. This period typically aligns with the guaranteed interest rate period and is designed to account for interest rate fluctuations that affect the insurer’s investment value
        marketValueAdjustmentBaseRate:
          type: number
          description: The MVA Indicator is a flag or marker that indicates whether a Market Value Adjustment (MVA) applies to an annuity or investment. This adjustment impacts the contract value when withdrawals or surrenders occur before the end of the contract’s term.
          example: 12.42342
          format: double
        marketValueAdjustmentCapFloorAmount:
          type: number
          format: double
          description: The maximum positive or negative adjustment amount allowed under the contracts Market Value Adjustment (MVA) provision, which limits the total increase or decrease applied to a withdrawal or surrender value due to interest rate changes.
          example: 12.42342
        marketValueAdjustmentCurrentRate:
          type: number
          format: double
          description: The current reference interest rate used by the insurer when calculating the Market Value Adjustment (MVA) at the time of withdrawal, surrender, or transfer.
          example: 12.42342
        marketValueAdjustmentRateAtIssue:
          type: number
          format: double
          description: The reference interest rate at the time the contract or segment was issued, which is used as the baseline for calculating the Market Value Adjustment (MVA) when comparing it to the current rate.
          example: 12.42342
        fractionalYearsRemainingInSurrenderChargePeriod:
          type: number
          format: double
          description: The remaining portion of the surrender charge period, expressed as a fraction of a year, representing the time left before surrender charges no longer apply to the contract.
          example: 12.42342
