    PolicyDates:
      type: object
      properties:
        policyStartDate:
          type: string
          format: date
          description: The Policy Start Date refers to the official date on which the policy becomes effective and coverage begins. This date is critical for determining premium payments, coverage eligibility, policy anniversaries, and contractual obligations
          example: '2023-01-01'
        applicationDate:
          type: string
          format: date
          description: The Application Date, also referred to as the Policy Sign Date, is the date when the policyholder completes and signs the insurance or annuity application. This marks the official request for coverage but does not necessarily mean the policy is active yet
          example: '2023-01-01'
        applicationReceivedDate:
          type: string
          format: date
          description: The Application Received Date refers to the date when Zinnia (or the designated insurance company/administrator) officially receives the completed insurance or annuity application
          example: '2023-01-01'
        issueDate:
          type: string
          format: date
          description: The Policy Issue Date, also known as the Policy Launch Date, is the date when the insurance company officially issues the policy to the client. This occurs after the application is approved, the insured accepts the offer, and payment information is provided. It marks the formal activation of the policy and triggers policy delivery
          example: '2023-01-01'
        parameterLockDate:
          type: string
          format: date
          description: The effective date used as applicable version of rate-locked parameters for this contract.
          example: '2023-01-01'
        applicationInGoodOrderDate:
          type: string
          format: date
          description: The Application IGO Date (In Good Order Date) refers to the date when the submitted application is deemed complete and accurate by Zinnia or the insurer, meaning it is ready for underwriting and processing but does not yet include the initial premium payment
          example: '2023-01-01'
        contestabilityStartDate:
          type: string
          format: date
          description: The Contestability Start Date refers to the beginning of the contestability period, which is the time frame in which an insurance company can investigate and deny a claim if material misrepresentations or fraud are found in the application
          example: '2023-01-01'
        contestabilityEndDate:
          type: string
          format: date
          description: The Contestability End Date is the date when the contestability period expires, meaning the insurer can no longer deny a claim based on misrepresentation or omission in the application, unless fraud is proven
          example: '2023-01-01'
        policyDeliveryDate:
          type: string
          format: date
          description: The Policy Delivery Date refers to the date when the policyholder is officially notified that their policy is available, either through an online portal, email, SMS, or physical mail. This date is critical because it marks the start of the free look period, allowing the policyholder to review the contract and cancel if needed
          example: '2023-01-01'
        previousPolicyAnniversaryDate:
          type: string
          format: date
          description: The Previous Policy Anniversary Date refers to the most recent past annual recurrence of the Policy Start Date. This date is used for tracking past premium payments, benefit updates, policy renewals, and cash value calculations
          example: '2023-01-01'
        previousPolicyMonthiversaryDate:
          type: string
          format: date
          description: The Previous Policy Monthiversary Date refers to the most recent past monthly recurrence of the Policy Start Date. It is used for tracking monthly premium payments, cost of insurance (COI) deductions, cash value updates, and policy charges
          example: '2023-01-01'
        nextAnniversaryDate:
          type: string
          format: date
          description: The Next Policy Anniversary Date refers to the upcoming annual recurrence of the policy’s start date. It is based on the Policy Start Date and marks key policy milestones such as premium due dates, cash value updates, policy renewals, and benefit adjustments
          example: '2023-01-01'
        maturityDate:
          type: string
          format: date
          description: The Policy Maturity Date refers to the date when a life insurance policy reaches its maturity or an annuity contract reaches its maximum annuitization age. It is based on the Policy Start Date and determines when benefits become payable or coverage ends
          example: '2023-01-01'
        policyTerminationDate:
          type: string
          format: date
          description: The Policy Termination Date is the date when a life insurance or annuity policy officially ends, meaning coverage ceases, and no further benefits or obligations exist under the contract. The reason for termination may vary, including policy lapse, surrender, maturity, or claim payout
          example: '2023-01-01'
        initialPaymentExpiryDate:
          type: string
          format: date
          description: The Initial Payment Amount Expiration Date refers to the deadline by which the initial premium payment must be made to keep the policy offer valid and ensure the policy goes into effect., if not received Policy will be Canceled due to no Premium Set at Issuance
          example: '2023-01-01'
        nextMonthiversaryDate:
          type: string
          format: date
          description: The Next Policy Monthiversary Date refers to the same day of each month that corresponds to the Policy Start Date, marking the monthly recurrence of the policy. It is used for monthly premium payments, cost deductions, cash value calculations, and interest crediting
          example: '2023-01-01'
        claimApprovalDate:
          type: string
          format: date
          description: The Claim Approval Date is the date when an insurance company officially approves a claim for payment after verifying the claim details, policy coverage, and required documentation
          example: '2023-01-01'
        certifiedReceivedDate:
          type: string
          description: The Certified Received Date refers to the date when the insurance company officially receives the certified death paperwork (such as a death certificate) required to process a life insurance claim. This date marks the beginning of the formal claims verification process
          format: date
          example: '2023-01-01'
        dateOfDeathReportedNotification:
          type: string
          format: date
          description: The Date of Death Reported / Notification refers to the date on which the insurance company is officially notified of the insured`s passing. This date is critical as it marks the start of the claims process and determines when the insurer begins reviewing the claim
          example: '2023-01-01'
        deferralEndDate:
          type: string
          format: date
          description: The Deferral End Date refers to the contractually set date on a deferred annuity or inherited IRA by which the policyholder must take action—either by starting withdrawals, annuitizing, or surrendering the policy. If no action is taken, the contract may auto-surrender, forcing a lump-sum payout or triggering Required Minimum Distributions (RMDs)
          example: '2023-01-01'
        conversionDate:
          type: string
          format: date
          description: The Conversion Date refers to the date on which an insurance or annuity contract is transferred or migrated from one platform, system, or policy type to another. This is commonly seen in policy administration system updates, carrier mergers, or policy conversions
          example: '2023-01-01'
        paidToDate:
          type: string
          format: date
          description: Paid to Date refers to the specific date through which a policyholder’s premium payments have fully covered the cost of insurance coverage on a life or annuity policy. It represents the end of the current paid coverage period and is critical for determining the policy's status (e.g., in-force, in grace period, or lapsed)
          example: '2023-01-01'
        paidUpDate:
          type: string
          format: date
          description: The date when all required premium payments on a life insurance policy have been made
          example: '2023-01-01'
        endowmentDate:
          type: string
          format: date
          description: The policy anniversary date on which the Level Term Period expires and the policy reaches endowment.
          example: '2023-01-01'
