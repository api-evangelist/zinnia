openapi: 3.2.0
info:
  title: Policy Service Overview API
  description: Enterprise level policy service
  version: 0.0.21
  contact: {}
servers:
- url: https://api.zinnia.io
tags:
- name: Overview
  description: Get policy overview
paths:
  /policy/v1/policies/{planCode}/{policyNumber}/versions:
    get:
      operationId: Policy Versions
      x-scopes: read:policy
      summary: Get policy versions
      parameters:
      - name: planCode
        required: true
        in: path
        schema:
          type: string
      - name: policyNumber
        required: true
        in: path
        schema:
          type: string
      - name: limit
        required: false
        in: query
        schema:
          type: integer
      - name: transactionType
        required: false
        in: query
        description: Specifies the type of transaction being performed, such as Premium Payment, Loan Repayment, Anniversary etc
        schema:
          enum:
          - Activation
          - AddOwner
          - AddressChange
          - AgentChange
          - AnnuitantChange
          - Anniversary
          - AnnualPolicyRefreshAndRecalculation
          - AssigneeChange
          - BankAccountChange
          - BeneficiaryChange
          - CalendarProcessing
          - CancelNoPremium
          - ClaimPayout
          - CommunicationPreferenceChange
          - ConversionActivation
          - CostOfInsurance
          - CoverageCharge
          - CoverageCredit
          - DeathClaim
          - DeliveryDateSetup
          - Disbursement
          - EmailChange
          - ExistingPartyNameChange
          - ExpenseCharge
          - FaceAmountChange
          - FaceAmountDecrease
          - FaceAmountIncrease
          - FeatureChange
          - ForceOut
          - FreeLookExpiration
          - FreeLookCancellation
          - FullSurrender
          - FundAllocationsChange
          - FundTransfer
          - GrantorChange
          - PaymentInitialPremium
          - IdentifierChange
          - InitialPremium
          - InterestCredit
          - InterestCreditLoan
          - InterestCreditMatch
          - InterestLoan
          - Issuance
          - Lapse
          - LapseAssessment
          - LoanAnniversaryTrueUp
          - LoanRepaymentOneTime
          - MatchBonusVesting
          - MultipleBeneficiaryChange
          - MultipleEmailChange
          - MultiplePayeeChange
          - MultipleAgentChange
          - MultipleOwnerChange
          - MultipleAnnuitantChange
          - MultiplePhoneNumberChange
          - NewLoan
          - NotificationOfDeathClaim
          - OneTimePremium
          - OwnerChange
          - PartialWithdrawalOneTime
          - PolicyDetailsChange
          - PayeeChange
          - PaymentExpiration
          - PaymentLoanRepaymentOneTime
          - PaymentOneTimePremium
          - PaymentSystematicLoanRepayment
          - PayorChange
          - PhoneNumberChange
          - RateRenewal
          - RemoveOwner
          - Rescission
          - PowerOfAttorneyChange
          - PreferredMailingAddressChange
          - Reinstatement
          - ReinstatementApproved
          - Reissuance
          - RequiredMinimumDistributionOneTime
          - SubsequentPayment
          - SubsequentPremium
          - Sweep
          - SystematicLoanRepayment
          - SystematicLoanRepaymentSetup
          - SystematicPartialWithdrawal
          - SystematicPartialWithdrawalSetup
          - SystematicRequiredMinimumDistribution
          - SystematicRequiredMinimumDistributionSetup
          - SystematicPaymentSetup
          - SystematicAnnuityPayout
          - SystematicAnnuityPayoutSetup
          - SystematicProgramUpdate
          - TPDChange
          - TrusteeChange
          - UnitExpenseCharge
          - ValueAdjustment
          - YearBeginningRefreshAndRecalculation
          - WithdrawnApplication
          - DollarCostAverage
          - ProcessingDate
          - ServiceCharge
          - TransferCharge
          - RiderAddition
          - Annuitization
          - AnnuityBenefitReduction
          - Reclassification
          - FlatExtraChange
          - Commutation
          - Dividend
          - DividendFeatureCharge
          - MarketTimerFee
          - InterimAnnualProcessing
          - HardshipWithdrawal
          - HardshipEnd
          - ResetBenefitAmounts
          - GuaranteedAccumulationBenefitPeriodEnd
          - GainLossChargeBack
          - SpousalContinuation
          - PeriodicCharge
          - DeathBenefitLockIn
          - RatchetLockIn
          - GrowthDeathBenefitLockIn
          - DateOfDeath
          - BenefitAmountAutoAdjustment
          - NotificationOfRiderClaimStart
          - LongTermCareBenefitStartStop
          - DailyRatchet
          - AnnuitizationAnniversary
          - DeclineFeeChange
          - GuaranteedWithdrawalBenefitPaymentLockIn
          - ExcessInterestCredit
          - LongTermCareWithdrawal
          - GuaranteedWithdrawalBenefitInterestAdjustment
          - InvestmentAdvisorFee
          - PayoutAmountChange
          - AdditionalBenefitStart
          - AdditionalBenefitEnd
          - RiderActivationAnniversary
          - AdditionalBenefitRenew
          - QualifiedPlanChange
          - AdvanceAnnuityPayment
          - PartialCommutation
          - GuaranteedIndexRates
          - BailoutRenewal
          - NonLifeAnnuitization
          - AdditionalBenefitReCertification
          - CostBasisReceived
          - FreeWithdrawalRecalculation
          - YearEndGain
          - LongTermCareCertificationDate
          - QuarterlyProcessing
          - BenefitBaseAdjustment
          - RiderBenefitBaseLockIn
          - GuaranteedDeathBenefitRollUpRenew
          - GuaranteedWithdrawalBenefitRollUpRenew
          - RiderCharge
          - LongTermCareFeeStartStop
          - LongTermCareAssessmentCharge
          - RoleBirthday
          - PendingUnclaimedProperty
          - PendingPartialUnclaimedProperty
          - LiquidatedUnclaimedProperty
          - SystematicRiderClaimWithdrawalSetup
          - SystematicRiderClaimWithdrawal
          - TaxWithholdingChange
          - MultipleTrusteeChange
          - MultiplePowerOfAttorneyChange
          - OtherInterestedPartyChange
          - MultipleAuthorizedSignatoryChange
          - AuthorizedSignatoryChange
          - ExchangeCompanyChange
          - BillingFeatureChange
          - GWBPhaseChange
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PolicyEvent'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected error occured, please check server logs
      security:
      - Auth0: []
      tags:
      - Overview
  /policy/v1/policies/{planCode}/{policyNumber}/versions/{version}:
    get:
      operationId: Policy By Version
      summary: Get Policy By Version
      parameters:
      - name: planCode
        required: true
        in: path
        schema:
          type: string
      - name: policyNumber
        required: true
        in: path
        schema:
          type: string
      - name: version
        required: true
        in: path
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected error occured, please check server logs
      security:
      - Auth0: []
      tags:
      - Overview
  /policy/v1/policies/{planCode}/{policyNumber}:
    get:
      operationId: Policy Overview
      summary: Get Policy Details
      parameters:
      - name: planCode
        required: true
        in: path
        schema:
          type: string
      - name: policyNumber
        required: true
        in: path
        schema:
          type: string
      - name: external-data
        required: false
        in: query
        description: Controls external data enrichment (e.g. DTCC) for AMP SOR requests. When false, external data population is skipped.
        schema:
          type: boolean
      - name: date
        required: false
        in: query
        schema:
          type: string
      - name: viewDetails
        required: false
        in: query
        schema:
          type: boolean
      - name: version
        required: false
        in: query
        schema:
          type: integer
      responses:
        '200':
          description: Returns data for a specific policy
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/Policy'
                - $ref: '#/components/schemas/PolicySummary'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected error occured, please check server logs
      security:
      - Auth0: []
      tags:
      - Overview
components:
  schemas:
    AmountType:
      type: string
      enum:
      - AMOUNT
      - PERCENTAGE
      - MAX
      - FREEWITHDRAWALAMOUNT
      - WITHDRAWALUNTILBASIS
      - EARNINGSONLY
      - PRORATA
      - PERCENT
      - MODIFIEDEARNINGSONLY
      - SUNINCOMEMAXIMIZERONLYLBRMAXIMUM
      - SUNINCOMEMAXIMIZERNETONETIMEACCESS
      - NONSUNINCOMEMAXIMIZERLBRSWDMAXIMUM
      - SUNINCOMEMAXIMIZERGROSSONETIMEACCESS
      - YEARTODATEFIXEDEARNINGS
      - EARNINGSLIQUIDITYFIRST
      - EARNINGSLIQUIDITYLAST
      - GUARANTEEDWITHDRAWALBENEFIT
      - FIXEDMODIFIEDEARNINGS
      - ACCUMULATEDEARNINGS
      - LIFEEXPECTANCY
      - DEFAULT
    RiderParticipant:
      type: object
      properties:
        insuredId:
          type: string
          description: A unique identifier assigned to the insured individual within the system who was covered under this rider
          example: Party_PI_1
        insuredAgeAtIssue:
          type: number
          description: The age of the insured at the time the rider was issued
          example: 50
          format: int32
    Rider:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
          description: TBD
          example: '2023-01-01T12:00:00.000Z'
        type:
          $ref: '#/components/schemas/RiderType'
        riderName:
          type: string
          example: Chronic Illness Accelerated Death Benefit Rider
          description: The specific name of the rider as designated by the insurance company. For example - Terminal Illness Accelerated Death Benefit
        riderElected:
          type: string
          description: Indicates the election status of the rider on the policy, specifying whether the policyholder has formally elected to include the rider
          example: ELECTED
        riderCode:
          type: string
          description: A unique identifier or alphanumeric code assigned to the rider
          example: EVGLHR
        underwritingStatus:
          $ref: '#/components/schemas/UnderwritingStatus'
        unbornChildIndicator:
          type: boolean
          description: This will be set to yes if there is no Child rider insured to support Unborn Child
        qualifiedAdditionalBenefit:
          type: boolean
          description: Indicates whether the rider provides a qualified benefit under IRS or insurance regulations
        effectiveDate:
          type: string
          format: date
          description: Date on which Rider is selected and becomes effective on the policy
          example: '2023-01-01'
        exerciseDate:
          type: string
          format: date
          description: The date the policyholder elects to use or activate the rider benefit
          example: '2023-01-01'
        terminationDate:
          type: string
          format: date
          description: The date on which the rider coverage ends/ is terminated
          example: '2023-01-01'
        status:
          $ref: '#/components/schemas/Status'
        coverageId:
          type: string
          example: Rider_EVGLCHR
          description: An unique identifier assigned to the rider coverage within an insurance coverage or policy layer
        amount:
          type: number
          description: The total benefit amount the rider provides (separate from the base policy’s coverage.)
          example: 0
        annualBenefitAmount:
          type: number
          description: The maximum benefit amount of the benefit base, policyholder can withdraw each year
          example: 0
          format: double
        riderBenefitAmount:
          type: number
          description: The Total Benefit Amount represents the maximum guaranteed amount available under the annuity rider over the life of the contract/rider
          example: 0
          format: double
        riderBenefitPercent:
          type: number
          description: The fixed percentage applied to the Rider Benefit Amount to calculate the annual guaranteed benefit amount
          example: 100
          format: double
        minimumRiderBenefitAmount:
          type: number
          description: Refers to a guaranteed payout to a beneficiary upon the death of the annuitant, regardless of the contract investment performance, as long as the annuity is in the accumulation phase. Used for Variable annuities
          example: 0
          format: double
        growthIncomeBenefitAmount:
          type: number
          description: The Growth Income Benefit value represents the guaranteed income base established under a Guaranteed Minimum Income Benefit (GMIB) rider. It is used to calculate the lifetime income payments the annuitant is entitled to upon annuitization, regardless of the contract actual account value.
          example: 0
          format: double
        riderStoredIncomeBalance:
          type: number
          description: Amount that can be withdrawn without reducing the yearly or Lifetime rider benefit amount
          example: 0
          format: double
        riderParticipant:
          description: Note - Use riderParticipants field instead of riderParticipant
          type: array
          items:
            $ref: '#/components/schemas/RiderParticipant'
        additionalBenefitUsageCount:
          type: number
          format: int32
          description: The number of times the additional benefit has been used.
          example: 0
        riderParticipants:
          type: array
          items:
            $ref: '#/components/schemas/PartyRiderParticipant'
        charge:
          $ref: '#/components/schemas/RiderCharge'
        maximumChronicIllnessBenefitPercentage:
          type: number
          description: The highest percentage of the death benefit or face amount that can be taken for chronic illness coverage
          example: 2.5
        maximumPeriodicPaymentPeriod:
          type: number
          description: The maximum duration over which payments can be made under the rider ( in Months)
        claimStatus:
          type: boolean
          description: The current status of a claim filed under the rider
        nextEvaluationDate:
          type: string
          format: date
          description: The date of the next scheduled review or re-evaluation of an ongoing claim (applicable for riders like chronic illness).
          example: '2023-01-01'
        riderPaymentDate:
          type: string
          format: date
          description: The date the benefit payout under the rider is to be disbursed to the policyholder or beneficiary
          example: '2023-01-01'
        terminalRiderPaymentAmount:
          type: number
          description: The amount paid under the rider benefit.(during a given payout cycle)
          example: 0
        riderMinimumPaymentAmount:
          type: number
          description: Deprecated - kept for backwards compatibility
          example: 0
        maximumCriticalIllnessBenefitPercentage:
          type: number
          description: The highest percentage of the policy’s face amount that can be accessed under the critical illness rider
          example: 0
        tierOneMaximumCriticalIllnessBenefitPercentage:
          type: number
          description: The percentage of the benefit payable under Tier 1 of the critical illness structure (e.g., for mild conditions).
          example: 0
        tierOneMaximumCriticalIllnessBenefitAmount:
          type: number
          description: The maximum dollar amount payable under Tier 1 benefits
          example: 0
        tierTwoMaximumCriticalIllnessBenefitPercentage:
          type: number
          description: The percentage of the benefit payable under Tier 2(usually for more severe conditions.)
          example: 0
        tierTwoMaximumCriticalIllnessBenefitAmount:
          type: number
          description: The maximum dollar amount payable under Tier 2 benefits.
          example: 0
        tierOneCriticalRiderPaymentDate:
          type: string
          format: date
          description: The date on which the Tier 1 critical illness rider benefit payment is scheduled or was made
          example: '2023-01-01'
        tierOneCriticalRiderPaymentAmount:
          type: number
          description: The amount of benefit paid under the Tier 1 critical illness
          example: 0
        tierTwoCriticalRiderPaymentDate:
          type: string
          format: date
          description: The date on which the Tier 2 critical illness rider benefit payment is scheduled or was made
          example: '2023-01-01'
        tierTwoCriticalRiderPaymentAmount:
          type: number
          description: The amount of benefit paid under the Tier 2 critical illness
          example: 0
        coverageLayers:
          type: array
          items:
            $ref: '#/components/schemas/RiderCoverageLayer'
        remainingBenefit:
          type: number
          format: double
          description: The remaining benefit amount for the rider. Incremented by Premiums and adjusted by withdrawals.
          example: 10.51
        additionalBenefitUsedUp:
          type: boolean
          description: Indicates whether the ADL benefit is utilised on the contract.
        totalBenefit:
          type: number
          format: double
          description: The total guaranteed value the contract owner is entitled to at the end of the GMAB holding period — assuming no disqualifying withdrawals or events.
          example: 5.17
        payoutOption:
          type: string
          enum:
          - SINGLE
          - JOINT
          description: Single or Joint Payout (not driven by Owners on the policy, even a jointly owned policy can have single as an option. Used in configuration to set different GMWB benefits for Single and Joint GMWB Amount Types
        benefitPercent:
          type: number
          format: double
          description: Ties to Withdrawal Reset Benefit % Annual Limit on Calender Processing if GMWB Anniversary Base reset is elected. Equals result of GMWB Benefit % equation box in Withdrawal tab (GMWB) Ku - Payout Factor  Percentage of the benefit base that will be available for withdrawal each year
          example: 1.23
        annualBenefitLimit:
          type: number
          format: double
          description: GMWB Annual Limit, The total amount that can be withdrawn as a benefit of this rider in any given policy year, regardless of whether or not there is sufficient account value. It is also the annual limit on amounts that can be withdrawn without adversely affecting future annual and lifetime benefits from the rider.this amount will be impacted during Reset or Withdrawals or Premium events
          example: 3.43
        currentAnnualLimit:
          type: number
          format: double
          description: ' GMWB Annual Limit, The total amount that can be withdrawn as a benefit of this rider in any given policy year, regardless of whether or not there is sufficient account value. It is also the annual limit on amounts that can be withdrawn without adversely affecting future annual and lifetime benefits from the rider.this amount will be impacted during Reset or Withdrawals or Premium events'
          example: 5.45
        remainingAnnualLimit:
          type: number
          format: double
          description: The GMWB amount still available for withdrawal in the current Contract Year without creating an "Excess Withdrawal" situation.
          example: 6.75
        hypotheticalAnnualLimit:
          type: number
          format: double
          description: During the riders accumulation phase (before it is exercised), a hypothetical annual withdrawal limit is calculated and displayed on statements to inform the policyholder and assist in their decision to exercise the rider
          example: 8.95
        phase:
          type: string
          enum:
          - ACCUMULATION
          - INCOME
          description: Indicator for whether the phase is Accumulation (not activated, benefit base is still accruing) or Income (annual limit calculated, benefit bases stop growing). Default value = Accumulation
        lastResetDate:
          type: string
          format: date
          description: User initiates the Reset, Variables product
          example: '2023-01-01'
        base:
          $ref: '#/components/schemas/Base'
    IssueType:
      type: string
      enum:
      - FULLUNDERWRITING
      - SIMPLIFIED
      - GUARANTEEISSUE
      - REDUCEDUNDERWRITING
      - EXPRESSUNDERWRITING
      - MASSUNDERWRITING
      - AVIATION
    TestValues:
      type: object
      properties:
        guidelinePremium:
          $ref: '#/components/schemas/GuidelinePremium'
        modifiedEndowmentContract:
          $ref: '#/components/schemas/ModifiedEndowmentContract'
    PolicyPartyRoles:
      type: object
      properties:
        partyRoleId:
          type: string
          example: '8'
          format: int32
          description: The Party Role ID is a unique identifier assigned to a specific role that a party (individual or entity) plays within an insurance or annuity contract. It serves to distinctly track and manage the relationship between the party and the contract, especially when a party may have multiple roles across different policies or within the same policy
        partyRole:
          $ref: '#/components/schemas/PartyRole'
        partyId:
          type: string
          example: Party_PI_1
          description: Party ID is a unique identifier assigned to a party (individual or entity) involved in an insurance or annuity contract. This identifier helps ensure accurate data exchange and tracking across insurance transactions
        relationshipToInsured:
          type: string
          enum:
          - TRUSTEE
          - TRUSTEEOFMINOR
          - TRUSTEEOFINCOMPETENT
          - POWEROFATTORNEY
          - CONTROLLINGPERSONOFENTITY
          - BROTHER
          - CHILD
          - DAUGHTER
          - DOMESTICPARTNER
          - EXECUTORS
          - FATHER
          - FIANCE
          - GRANDCHILD
          - LIFEPARTNER
          - MOTHER
          - SISTER
          - SON
          - SPOUSE
          - STEPFATHER
          - STEPMOTHER
          - SELF
          - LEGALGUARDIAN
          - BUSINESS
          - BUSINESSASSOCIATE
          - PARTNER
          - EMPLOYER
          - FORMERSPOUSE
          - GRANDPARENT
          - PARENT
          - OWNER
          - SIBLING
          - STEPCHILD
          - STEPARENT
          - OTHER
          - AUNT
          - GRANDFATHER
          - GRANDMOTHER
          - HUSBAND
          - WIFE
          - UNCLE
          - NIECE
          - NEPHEW
          - ESTATE
          - TRUST
          - GRANDSON
          - GRANDDAUGHTER
          - NONSPOUSE
          - CHILDRENEQUALLY
          - CHILDRENPERSTIRPES
          - PERSTIRPES
          - SURVIVINGSPOUS
          - COMORTGAGER
          - DEPENDENT
          description: The type of relationship to the party
        relationshipToParty:
          type: string
          enum:
          - TRUSTEE
          - TRUSTEEOFMINOR
          - TRUSTEEOFINCOMPETENT
          - POWEROFATTORNEY
          - CONTROLLINGPERSONOFENTITY
          - BROTHER
          - CHILD
          - DAUGHTER
          - DOMESTICPARTNER
          - EXECUTORS
          - FATHER
          - FIANCE
          - GRANDCHILD
          - LIFEPARTNER
          - MOTHER
          - SISTER
          - SON
          - SPOUSE
          - STEPFATHER
          - STEPMOTHER
          - SELF
          - LEGALGUARDIAN
          - BUSINESS
          - BUSINESSASSOCIATE
          - PARTNER
          - EMPLOYER
          - FORMERSPOUSE
          - GRANDPARENT
          - PARENT
          - OWNER
          - SIBLING
          - STEPCHILD
          - STEPARENT
          - OTHER
          - AUNT
          - GRANDFATHER
          - GRANDMOTHER
          - HUSBAND
          - WIFE
          - UNCLE
          - NIECE
          - NEPHEW
          - ESTATE
          - TRUST
          - GRANDSON
          - GRANDDAUGHTER
          - NONSPOUSE
          - CHILDRENEQUALLY
          - CHILDRENPERSTIRPES
          - PERSTIRPES
          - SURVIVINGSPOUS
          - COMORTGAGER
          - DEPENDENT
          description: The type of relationship to the party
        startDate:
          type: string
          format: date
          example: '2023-01-01'
          description: Date the Party was added to the Policy
        endDate:
          type: string
          format: date
          example: '2023-01-01'
          description: Date the Party was Terminated from the Policy
        preferredCommunicationType:
          $ref: '#/components/schemas/CommunicationType'
        preferredAddressId:
          type: string
          example: '1'
          description: Deprecated - kept for backward compatibility. Use preferredAddressId under party section. The Preferred Address ID refers to the unique identifier of the address designated as the primary or preferred address for a given party when multiple addresses are associated with that individual or entity. This ensures consistent use of the correct address for communication, correspondence, and recordkeeping
        preferredEmailId:
          type: string
          example: '1'
          description: Deprecated - kept for backward compatibility. Use preferredEmailId under party section. The Preferred Email ID refers to the unique identifier of the email address designated as the primary or preferred email contact for an individual or entity when multiple email addresses are on file
        preferredPhoneId:
          type: string
          example: '1'
          description: Deprecated - kept for backward compatibility. Use preferredPhoneId under party section. The Preferred Phone ID refers to the unique identifier of the phone number designated as the primary contact number for a given individual or entity when multiple phone numbers are associated with the same party
        isAddressSameAsOwner:
          type: boolean
          description: Boolean 0 = No 1 = Yes to denote if the email is the preferred
        lastContactDate:
          type: string
          example: '2023-01-01'
          description: Last Contact Date refers to the most recent date on which there was a direct or system-recorded interaction with a party (individual or entity) associated with a policy or contract. This party may be a policyholder, insured, beneficiary, payor, agent, or any other role relevant to life and annuity products.
          format: date
        beneficiaryShareMethod:
          type: string
          enum:
          - PERSTIRPESDISTRIBUTION
          description: Roles that are essential in structuring life insurance and annuity contracts to meet the financial goals of policyholders and beneficiaries.
        collateralAmount:
          type: number
          format: double
          description: The Collateral Amount of an Assignee refers to the portion of a life insurance policy's value or benefit that is pledged as collateral to a third party (the assignee) under a collateral assignment agreement. This is commonly used when a policyholder uses a life insurance policy as security for a loan or other financial obligation.
          example: 1023.21
        powerOfAttorneyAccessLevelType:
          $ref: '#/components/schemas/PowerOfAttorneyAccessLevelType'
        partyPercentage:
          type: number
          format: double
          description: Party Role Percentage refers to the proportion of ownership, benefits, or responsibility assigned to a party within an insurance or annuity contract. It is used to distribute policy ownership, benefit payouts, commission sharing, or annuity payments among multiple parties.
          example: 1023.21
    CostBasis:
      type: object
      properties:
        costBasis:
          type: number
          description: The Cost Basis refers to the total cumulative amount of after-tax premiums paid into a life insurance policy or annuity contract. It represents the non-taxable portion of withdrawals, policy loans, or surrenders, ensuring that policyholders are only taxed on gains above this amount
          example: 198
        costBasisDate:
          type: string
          format: date
          description: The Cost Basis Date refers to the date on which the cost basis value of a life insurance policy or annuity contract is calculated. The cost basis represents the total amount of after-tax money contributed to the policy or annuity and is used to determine the taxable portion of withdrawals, loans, or payouts
          example: '2023-01-01'
        preTaxEquityAndFiscalResponsibilityActBasis:
          type: number
          format: double
          description: The Pre-TEFRA Basis refers to the cost basis of a life insurance policy or annuity before the Tax Equity and Fiscal Responsibility Act (TEFRA) of 1982 took effect. This distinction is important because TEFRA introduced new tax regulations on insurance products, including how withdrawals, policy loans, and annuities are taxed
          example: 161.81698
        preTechnicalAndMiscellaneousRevenueActAmount:
          type: number
          format: double
          description: Cost basis of a policy prior to Technical and Miscellaneous Revenue Act (TAMRA) of 1988.SB FIA - do not have 403 Qual Type, but if an exchange policy has it this will need to be housed and tracked going forward.
          example: 161.81698
        postTechnicalAndMiscellaneousRevenueActAmount:
          type: number
          format: double
          description: Cost basis of a policy after Technical and Miscellaneous Revenue Act (TAMRA) of 1988. SB FIA - do not have 403 Qual Type, but if an exchange policy has it this will need to be housed and tracked going forward.
          example: 161.81698
        changeAmount:
          type: number
          format: double
          description: The Cost Basis Change Amount refers to the difference between the old and new cost basis of a life insurance policy or annuity. It reflects adjustments due to premium payments, withdrawals, policy loans, 1035 exchanges, or other financial transactions that impact the total cost basis.
          example: 161.81698
    PartyRiderParticipant:
      type: object
      properties:
        partyId:
          type: string
          description: A unique identifier assigned to the party insured within the system who was covered under this rider
          example: Party_PI_1
        partyAgeAtIssue:
          type: number
          format: int32
          description: The age of the insured at the time the rider was issued
          example: 50
        riskClass:
          type: string
          enum:
          - ULTRANONTOBACCO
          - ELITENONTOBACCO
          - PREFERREDNONTOBACCO
          - STANDARDNONTOBACCO
          - STANDARDTOBACCO
          - STANDARDAGGREGATE
          - SUBSTANDARDNONTOBACCO
          - SUBSTANDARDTOBACCO
          - STANDARDPLUSNONTOBACCO
          - PREFERREDTOBACCO
          - STANDARDCONVERSIONTOBACCO
          - STANDARDCONVERSIONNONTOBACCO
          description: The Risk Class refers to the underwriting category assigned to an applicant based on their health, lifestyle, and medical history, which determines their premium rates for a life insurance policy. Insurers use risk classifications to assess mortality risk and price policies accordingly.
        substandardRating:
          type: string
          enum:
          - TABLEA
          - TABLEB
          - TABLEC
          - TABLED
          - TABLEE
          - TABLEF
          - TABLEG
          - TABLEH
          - TABLEI
          - TABLEJ
          - TABLEK
          - TABLEL
          - TABLEM
          - TABLEN
          - TABLEO
          - TABLEP
          - NONETABLE
          description: A Substandard Rating (also called Table Rating) is assigned to applicants who do not qualify for Standard or Preferred risk classes due to health conditions, lifestyle risks, or medical history. This rating results in higher premium costs because the insured presents a greater mortality risk.
        flatExtra:
          type: array
          items:
            $ref: '#/components/schemas/FlatExtra'
