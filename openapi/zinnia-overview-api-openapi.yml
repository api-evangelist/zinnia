    FundSegment:
      type: object
      properties:
        segmentId:
          type: string
          description: A unique identifier assigned to a particular investment segment or bucket
          example: '3'
        fundId:
          type: string
          description: A unique identifier assigned to a specific fund account within the investment structure
          example: FundAccount1
        originalDepositAmount:
          type: number
          description: The initial amount deposited to the fund segment
          format: double
          example: 5.22
        originalDepositDate:
          type: string
          description: The date on which the original deposit was deposited into the fund segment.(date the segment created)
          format: date
          example: '2023-01-01'
        depositDate:
          type: string
          description: The date on which the additional deposit was deposited into the fund segment
          format: date
          example: '2023-01-01'
        depositAmount:
          type: number
          description: The additional amount deposited to the fund segment
          format: double
          example: 5.22
        currentAmount:
          type: number
          description: The value of the specific fund account segment, including all contributions, interest, and market changes
          format: double
          example: 161.81698
        renewalDate:
          type: string
          description: The date on which the segment may be renewed or reinvested
          format: date
          example: '2023-01-01'
        numberOfUnits:
          type: number
          description: The number of units allocated in the fund segment (applicable to variable investments).
          format: int32
          example: 50
        sweepAccountId:
          type: string
          description: The designated account where the segment funds will be transferred upon sweep,maturity
          example: EVGL002
        interestEarningAmount:
          type: number
          format: double
          description: This amount is used for Index interest calculation when Index crediting method is "averaging"
          example: 161.81698
        appliedInterestRate:
          type: number
          format: double
          description: The interest rate used to calculate interest amount for segment as of the last transaction
          example: 161.81698
        startingPrice:
          type: number
          format: double
          description: The initial market/index price or unit value when the segment was created
          example: 1234.21321
        startingPriceDate:
          type: string
          format: date
          description: Date of Starting Price to be used for Index
          example: '2023-01-01'
        endingPrice:
          type: number
          format: double
          description: The market/index price or unit value when the segment was matures/ends
          example: 2000.81698
        endingPriceDate:
          type: string
          format: date
          description: The date on which the ending price was determined
          example: '2023-01-01'
        indexChangeRate:
          type: number
          format: double
          description: The Index Change Rate refers to the rate of change in the value of an external market index (such as the S&P 500, Nasdaq, etc.) that is used to calculate interest credits for an indexed insurance or annuity product. It represents the percentage increase or decrease in the selected index over a defined crediting period, and directly influences the policy's credited interest or return.
          example: 2000.81698
        depositAnniversaryPrice:
          type: number
          format: double
          description: The index value of the High Water Mark indexed fund segment as of the current contract anniversary date. This value represents the recorded index price used for interest crediting purposes on the anniversary.  Calculated and returned by LPS during the Anniversary transaction. Applicable only to High Water Mark indexed fund segments.  Updated on each Anniversary transaction to reflect the most recent anniversary index value.
          example: 100.5
        depositAnniversaryPriceDate:
          type: string
          format: date
          description: The date corresponding to the anniversaryPrice value - representing the date on which the High Water Mark Index was recorded for the current contract anniversary. Always in sync with anniversaryPrice and updated together in the same Anniversary transaction
          example: '2023-01-01'
        startDate:
          type: string
          description: The date when the segment gets created
          format: date
          example: '2023-01-01'
        endDate:
          type: string
          description: The date when the segment matures/ends
          format: date
          example: '2023-01-01'
        maxPrice:
          type: number
          format: double
          description: Deprecated - kept for backward compatibility. Max Price = Max (IQ1, IQ2, IQ3, IQ4, …. IQN). where IQ1 denotes the index value at the 1st Quarterversary of the contract, IQ2 denotes the index value at the 2nd Quarterversary of the contract and so on and IQN denotes the index value at the end of the guarantee period (N=4*Guarantee period of the fund)
          example: 1234.21321
        maxPriceDate:
          type: string
          format: date
          description: Deprecated - kept for backward compatibility. The corresponding date of the determined Quarterversary
          example: '2023-01-01'
        rates:
          description: Array of rates associated with this fund segment
          type: array
          items:
            $ref: '#/components/schemas/Rate'
    ArrangementType:
      type: string
      enum:
      - PAYMENT
      - WITHDRAWAL
      - LOANREPAYMENT
      - REQUIREDMINIMUMDISTRIBUTION
      - PAYOUT
      - RIDERCLAIMWITHDRAWAL
    Base:
      type: object
      properties:
        currentBase:
          type: number
          format: double
          example: 14.32
          description: Tracked againist Account Value and will be updated on every Anniversary Incremented by gross premiums and credit enhancements.  Set to Investment Value if rider is issed post contract issue.  Adjusted for withdrawals. Reset on Anniversaries
        ratchetBase:
          type: number
          format: double
          description: Tracked againist Account Value and will be updated on every Anniversary Incremented by gross premiums and credit enhancements.  Set to Investment Value if rider is issed post contract issue. Adjusted for withdrawals.  Reset on Anniversaries.
          example: 19.35
        growthBase:
          type: number
          format: double
          description: Incremented by gross premiums and credit enhancements. Set to Investment Value if rider is issed post contract issue. Adjusted for withdrawals. Reset on Anniversaries by crediting interest based on the interest rate in the Growth Factor Calculation equation box.
          example: 15.65
        deferralBonus:
          type: number
          format: double
          description: The Deferral Bonus is configured a percent of a Deferred Bonus Base. It is set to the value on Feature Change, Premium, Annual Processing, GMWB Interest Adjustment transactions
          example: 12.65
        deferralBonusBase:
          type: number
          format: double
          description: Captures the basis for calculating the Deferral Bonus.Base used to calculate the annual Deferral Bonus.  Parameters defined in the Deferral tab (GMWB). Incremented by gross premiums.  If GMDB feature added post issue, then set to Investment Value.  Adjusted for withdrawals.  Reset on Contract Anniversaries equal to the Deferral Bonus Base Reset equation box.  Stored in the Transaction Log table.
          example: 13.12
        simpleInterestBase:
          type: number
          format: double
          description: Incremented by gross premiums.  Initialized to the Investment Value if GMDB added post issue.  Adjusted for excess withdrawals.  Set to Investment Value on Spousal Continuation.
          example: 14.21
      required:
      - currentBase
      - ratchetBase
      - growthBase
      - deferralBonus
      - deferralBonusBase
      - simpleInterestBase
    DelegatedExecutionAuthorityType:
      type: string
      enum:
      - INDEPENDENT
      - TOGETHER
      - MAJORITY
    Product:
      type: object
      properties:
        lineOfBusiness:
          type: string
          enum:
          - LIFE
          - ANNUITY
          - MUTUALFUND
          - CERTIFICATEOFDEPOSIT
          - BROKERAGE
          - OTHER
          description: Insurance and annuities are two distinct product lines of business (LOB) in the financial and insurance industry. Each serves different financial protection and income planning purposes
        planName:
          type: string
          description: The Product Name refers to the specific life insurance or annuity product selected by the contract owner at the time of policy issuance. It identifies the type of coverage, policy structure, and key features associated with the contract
          example: Everglades Premium Match
        productType:
          $ref: '#/components/schemas/ProductType'
        marketingName:
          type: string
          description: The Product Marketing Name refers to the branded name assigned by an insurance company to a specific life insurance or annuity product for marketing and sales purposes. It distinguishes products within an insurer`s portfolio and highlights key features and benefits for consumers
          example: Everglades
        shortName:
          type: string
          description: The Product Short Name is a condensed version of the full Product Marketing Name, typically used for internal systems, policy documents, billing, and reporting. It provides a simplified reference while still identifying the product accurately
          example: EVGL UL
        distribution:
          $ref: '#/components/schemas/DistributionType'
        planCode:
          type: string
          description: The Plan Code is a carrier-assigned unique identifier used to distinguish a specific product, rate structure, and version of a life insurance or annuity policy. It ensures accurate policy tracking, pricing, and administration
          example: PLAN001
        generalLedgerPlanCode:
          type: string
          description: The GL Plan Code (General Ledger Plan Code) is a carrier-assigned accounting code used to track insurance products and financial transactions within an insurer’s general ledger system. It is essential for financial reporting, revenue allocation, and regulatory compliance
          example: V2201
        holdingForm:
          $ref: '#/components/schemas/HoldingForm'
        renewable:
          type: string
          description: Renewable refers to a policy feature that allows the insured to extend coverage beyond the original term without requiring medical underwriting or a new application. This is commonly found in Term Life Insurance policies
        productVersion:
          type: string
          description: The Product Version refers to the specific edition or iteration of an insurance or annuity product, defined by its release date or modifications over time. It helps insurers and policyholders distinguish between different updates, pricing structures, regulatory changes, and feature enhancements within the same product line
          example: 2021.10.15
        sourceSystemPlanCode:
          type: string
          description: The Source System Plan Code is the identifier assigned to a coverage from the source carrier.
          example: CARRIER01
    SurplusDistributionOption:
      type: string
      description: This is the Surplus Distribution type it can be PUA, Cash etc.
      enum:
      - PAIDUPADDITION
      - CASH
    CoverageLayer:
      type: object
      properties:
        coverageId:
          type: string
          description: The Coverage ID is a unique identifier assigned to a specific coverage type or benefit within an insurance policy. It helps insurance companies, agents, and policyholders track and differentiate multiple coverage components within a single policy
          example: Base_Coverage
        coverageType:
          $ref: '#/components/schemas/RiderType'
        coverageName:
          type: string
          description: The Coverage Name in a life insurance policy refers to the specific title or label assigned to a coverage type within the policy contract. It helps insurers, agents, and policyholders identify, classify, and manage different coverage components in a policy
          example: Base_Coverage
        productCode:
          type: string
          description: The Plan Code is a carrier-assigned alphanumeric identifier used to uniquely distinguish a specific insurance or annuity product, rate structure, version, and coverage layer within an insurer’s portfolio. It is essential for policy administration, pricing, underwriting, and claims processing
          example: EVGL1
        coverageTerm:
          type: number
          format: int32
          description: Coverage Term refers to the number of years that a life insurance policy or specific coverage component is intended to remain in force, providing protection to the insured. It defines the planned duration of insurance coverage, after which the coverage may expire, renew, or convert, depending on the product type
          example: 1
        approvedCoverageAmount:
          type: number
          description: The Approved Coverage Amount refers to the specific amount of insurance coverage that has been approved by the insurer during the underwriting process. It represents the face amount (death benefit) the insurer has agreed to issue based on the applicant's risk profile, health, and other underwriting criteria
          example: 10000
          format: double
        currentAmount:
          type: number
          format: double
          description: The Current Coverage Amount refers to the active or present death benefit or coverage value available under the policy at a specific point in time. It reflects any adjustments, policy changes, withdrawals, or loans that may have altered the original coverage amount
          example: 300000
        originalCoverageAmount:
          type: number
          format: double
          description: The Original Coverage Amount refers to the initial face value or death benefit of a policy at the time of issuance before any policy modifications, withdrawals, loans, or benefit reductions. It represents the starting coverage amount agreed upon when the policy was first issued
          example: 300000
        minimumCoverageAmount:
          type: number
          format: double
          description: The Minimum Coverage Amount at Each Coverage Level refers to the lowest permissible amount of insurance coverage allowed per policy layer, as set by the insurance carrier. It ensures policies remain financially viable and comply with regulatory and underwriting standards
          example: 10000
        maximumCoverageAmount:
          type: number
          format: double
          description: The Maximum Coverage Amount at Each Coverage Level refers to the highest permissible amount of insurance coverage allowed per policy layer, as set by the insurance carrier
          example: 10000000
        grossDeathBenefitAmount:
          type: number
          format: double
          description: The Gross Death Benefit per Coverage Layer refers to the total pre-deduction death benefit amount assigned to each specific coverage layer within a policy. It represents the sum of all base coverage amounts, riders, and enhancements before applying policy adjustments such as loans, withdrawals, or unpaid premiums
          example: 300000
        coverageTargetPremium:
          type: number
          format: double
          description: Coverage Target Premium refers to the designated premium amount on a life insurance policy that:Qualifies for full target-level commissions in the first policy year, and Forms the basis for renewal commissions in subsequent policy years.Note - This is modal premium value
          example: 300000
        lowDeathBenefitAmount:
          type: number
          format: double
          description: Low Death Benefit refers to the lowest possible death benefit guaranteed within each specific coverage component of a policy. This ensures that beneficiaries receive at least a minimum death benefit regardless of market performance, policy changes, or withdrawals
          example: 300000
        coverageChangeAmount:
          type: number
          format: double
          description: The Coverage Change Amount refers to the specific increase or decrease in coverage that occurs within a life insurance policy due to policyholder requests, automatic adjustments, or insurer-initiated changes. This amount reflects the difference between the original or prior coverage amount and the new coverage amount after the change takes effect
          example: 3000000
        coverageEffectiveDate:
          type: string
          format: date
          description: The Coverage Effective Date refers to the date when an increase in coverage or a new coverage component officially takes effect in a life insurance policy. It marks the beginning of the insured’s eligibility for the new or increased benefits
          example: '2023-01-01'
        coverageChangeEffectiveDate:
          type: string
          format: date
          description: The Coverage Change Effective Date (for a decrease in coverage) refers to the date when the reduced coverage amount officially takes effect in a life insurance policy. It marks the point from which the new lower coverage amount applies
          example: '2023-01-01'
        coverageTerminationDate:
          type: string
          format: date
          description: The Coverage Termination Date refers to the date when a policy’s coverage officially ends, meaning the insured is no longer protected under the contract. After this date, no benefits or claims can be paid unless reinstatement is an option
          example: '2023-01-01'
        unitOfCoverage:
          type: number
          format: double
          description: The Unit of Coverage refers to the measurement standard used to define the amount of coverage provided under a life insurance policy. It helps insurers calculate premiums, determine benefit payouts, and structure policies consistently.In life insurance, the unit of coverage is typically measured per $1,000 of face amount.
          example: 300
        valuePerUnitOfCoverage:
          type: number
          format: double
          description: The Value per Unit of Coverage refers to the monetary worth of each unit of coverage in a life insurance policy, which is used for premium calculations, benefit payouts, and policy adjustments. This value helps insurers standardize pricing and policy structures.In life insurance, the value per unit represents the cost per $1,000 of coverage or payout per unit of death benefit.In annuities, it determines the payout per annuity unit or per $1,000 of account value
          example: 1000
        annualPremium:
          type: number
          format: double
          description: The annual premium is the total amount you would pay for a full year of life insurance or annuity if you made just one payment per year
          example: 1000
        modalPremium:
          type: number
          format: double
          description: Modal Premium refers to the actual premium amount a policyholder pays based on the selected billing frequency (mode)—such as monthly, quarterly, semiannual, or annual. It represents the current periodic payment due for the base coverage and any attached riders under a life or annuity insurance policy
          example: 1000
        cumulativeModalPremium:
          type: number
          format: double
          description: Cumulative Modal Premium refers to the sum of actual premium amount a policyholder pays based on the selected billing frequency (mode)—such as monthly, quarterly, semiannual, or annual. It represents the sum of current periodic payment due for the base coverage and any attached riders under a life or annuity insurance policy.
          example: 1000
        guidelineSinglePremium:
          type: number
          format: double
          description: The Guideline Single Premium (GSP) is the maximum single premium payment that can be made into a life insurance policy without causing it to lose its tax-advantaged status as life insurance under IRS guidelines. It is determined based on IRS regulations and ensures that the policy remains compliant with Section 7702 of the Internal Revenue Code
          example: 65068.27
        guidelineLevelPremium:
          type: number
          format: double
          description: The Guideline Level Premium (GLP) is the maximum total premium that can be paid over time into a life insurance policy without violating IRS regulations under Section 7702. It ensures that a policy retains its tax-advantaged status as life insurance and does not become classified as a Modified Endowment Contract (MEC)
          example: 4695.39
        sevenPayPremium:
          type: number
          format: double
          description: The 7-Pay Premium refers to the maximum cumulative premium that can be paid into a life insurance policy during the first seven years without causing the policy to become a Modified Endowment Contract (MEC). It is part of the 7-Pay Test, which ensures that life insurance policies do not become overfunded and lose their tax advantages
          example: 19807.51
        coverageParticipants:
          type: array
          items:
            $ref: '#/components/schemas/CoverageParticipants'
        overdueModalPremium:
          type: number
          format: double
          description: refers to a scheduled premium payment that was not received or applied by its due date, based on the policy’s modal frequency (e.g., monthly, quarterly, semi-annual, or annual). It represents a missed payment obligation that remains outstanding and may trigger administrative or policy-level actions
          example: 1000
