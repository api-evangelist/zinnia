    Rate:
      type: object
      properties:
        rateType:
          type: string
          enum:
          - PARTICIPATION
          - CAP
          - SPREAD
          - TRIGGER
          - FLOOR
          - BONUS
          - GMIR
          - ILLUSTRATION
          - THRESHOLD
          - FUNDFEE
          - BAILOUT
          - BUFFER
          - COUPON
          - FIXED
          description: Rate Type identifies the classification of the rate that is being applied to a specific fund or account value within a life insurance or annuity policy. It defines how the interest, return, or crediting rate is determined for that fund.It helps dictate whether the rate is fixed, variable, index-linked, declared, or derived from another methodology, and plays a key role in calculating earnings or charges associated with the fund.
        currentRate:
          type: number
          format: double
          description: Current Rate refers to the actual interest rate or crediting rate being applied to a specific fund or account at the present time, as declared or calculated by the insurance carrier. It is used to determine how much interest or investment return will be credited to the contract or sub-account during the current crediting period.
          example: 33.28
        initialGuaranteedRate:
          type: number
          format: double
          description: The Initial Guaranteed Rate is the fixed interest rate promised by the insurance carrier at the start of the contract or fund allocation, which is guaranteed not to change for a specified initial period (e.g., 1, 3, 5, or 10 years), depending on the product terms.
          example: 33.28
        guaranteedMinimumRate:
          type: number
          format: double
          description: The Guaranteed Minimum Rate is the lowest interest rate that an insurance company is legally or contractually obligated to credit to the account value or specific fund of a life insurance or annuity policy—regardless of market performance or declared rates. This rate acts as a floor, providing downside protection for the policyholder by ensuring a minimum return is always credited to the contract.
          example: 33.28
        guaranteedMaximumRate:
          type: number
          format: double
          description: The Guaranteed Maximum Rate is the highest cap or participation rate that the insurer can declare, as specified in the contract. It does not represent an actual credited rate, but rather a ceiling to limit the insurer’s obligations. It works alongside guaranteed minimums and declared rates to balance customer upside potential with carrier risk management.
          example: 33.28
        rateEffectiveDate:
          type: string
          format: date
          description: The date on which the rate becomes effective for the specific fund segment.
          example: '2023-01-01'
    PolicyCoverage:
      type: object
      properties:
        totalCoverageAmount:
          type: number
          description: The Total Coverage Amount refers to the maximum benefit or sum insured that a policyholder or beneficiary is entitled to receive under a life insurance contract. It represents the total financial protection provided by the policy
          example: 300000
          format: double
        cumulativeGrossDeathBenefitAmount:
          type: number
          description: The Cumulative Gross Death Benefit refers to the total amount payable to a beneficiary upon the insured or annuitant death, before any deductions such as loans, outstanding premiums, or surrender charges. It represents the gross value of the death benefit provided under a life insurance or annuity contract. It is cumulative gross death benefit of all the layers of base coverage (not including riders ).
          example: 300000
          format: double
        netDeathBenefit:
          type: number
          description: The Net Death Benefit refers to the actual amount paid to the beneficiary upon the insured or annuitant death, after deductions such as policy loans, unpaid premiums, withdrawals, or other charges
          example: 300000
          format: double
        remainingDeathBenefitAmount:
          type: number
          description: The Remaining Death Benefit Amount refers to the portion of the death benefit that is still available as of date for benefit payment to beneficiaries after a partial claim has been taken
          example: 300000
          format: double
        minimumCoverageAmount:
          type: number
          description: The Minimum Coverage Amount refers to the lowest amount of death benefit or policy coverage that an insurance company allows for a life insurance contract. It is the smallest sum insured that can be purchased under a specific product type
          example: 10000
          format: double
        maximumCoverageAmount:
          type: number
          description: The Maximum Coverage Amount refers to the highest amount of death benefit or policy coverage that an insurance company will issue under a life insurance contract. It represents the largest sum insured that an applicant can qualify for based on underwriting and financial eligibility
          example: 10000000
          format: double
        coverageChangeEffectiveDate:
          type: string
          description: The Earliest Coverage Change Date refers to the first possible date when a modification to an insurance policy can take effect. It defines the earliest point at which a policyholder can adjust coverage levels, add or remove riders, or make other contractual changes based on policy terms and conditions
          example: '2023-01-01'
        coverageBand:
          type: string
          enum:
          - BAND1
          - BAND2
          - BAND3
          - BAND4
          - BAND5
          - BAND6
          - BAND7
          description: In life insurance, a band refers to a coverage range or tier that affects premium rates, underwriting guidelines, or policy benefits. Insurance companies use coverage bands to determine pricing structures, offering lower per-unit costs for higher coverage amounts
        maximumAnnualCoverageChangeAllowedPerPolicy:
          type: integer
          description: The Maximum Annual Coverage Change Allowed per Policy refers to the largest increase or decrease in coverage amount permitted within a single policy year, as defined by the insurance carrier. This limit is set to maintain policy stability, prevent excessive risk exposure, and ensure compliance with underwriting and policy guidelines
          example: 1
          format: int32
        minimumCoverageDecreaseAmount:
          type: number
          description: The Minimum Coverage Amount Decrease refers to the smallest reduction in coverage that a policyholder is allowed to make per policy year, as defined by the insurance carrier. This ensures that policies remain viable and do not fall below the required minimum coverage limits
          example: 10000
          format: double
        maximumCoverageDecreaseAmount:
          type: number
          description: The Maximum Coverage Amount Decrease refers to the largest reduction in coverage that a policyholder is allowed to make per policy year, as defined by the insurance carrier. This ensures that policyholders can lower coverage if needed while maintaining a minimum required coverage amount
          example: 290000
          format: double
        maximumAgeNumberCoverageAmountDecrease:
          type: integer
          description: The Maximum Age of No Coverage Amount Decrease refers to the age at which a policyholder can no longer reduce their coverage amount. This limit is set by the insurance carrier to maintain policy integrity and ensure sufficient death benefit protection, particularly for older policyholders
          example: 80
          format: int32
        coverageAmountDecreaseAllowed:
          type: integer
          description: The Number of Coverage Amount Decrease Allowed Per Policy Year refers to the maximum number of times a policyholder is permitted to reduce their coverage amount within a single policy year. This limit is set by the insurance carrier to maintain policy stability and prevent excessive policy modifications
          example: 120
          format: int32
        minimumCoverageIncreaseAmount:
          type: number
          description: The Minimum Coverage Amount Increase refers to the smallest increment by which a policyholder can raise their coverage amount within a policy year. This minimum threshold is set by the insurance carrier to ensure that coverage increases are financially viable and align with underwriting guidelines
          example: 10000
          format: double
        maximumCoverageIncreaseAmount:
          type: number
          description: The Maximum Coverage Amount Increase refers to the highest amount by which a policyholder can raise their coverage within a single policy year, as defined by the insurance carrier. This limit ensures that coverage increases remain manageable and are aligned with underwriting and financial justification
          example: 9700000
          format: double
        maximumAgeNumberCoverageAmountIncrease:
          type: integer
          description: The Maximum Age of No Coverage Amount Increase refers to the oldest age at which a policyholder can request an increase in coverage. After reaching this age, the policyholder is no longer eligible to increase their coverage amount, as determined by the insurance carrier
          example: 80
          format: int32
        coverageAmountIncreaseAllowed:
          type: integer
          description: The Number of Coverage Amount Increases Allowed Per Policy Year refers to the maximum number of times a policyholder can request an increase in coverage within a single policy year, as defined by the insurance carrier. This limit helps insurers manage risk exposure and maintain policy stability
          example: 10
          format: int32
        coverageLayers:
          type: array
          items:
            $ref: '#/components/schemas/CoverageLayer'
        deathBenefitAmountDistributed:
          type: number
          description: The amount of the death benefit that has been paid out. This should be the difference between of Cumulative Gross Death Benefit and Remaining Death Benefit Amount
          example: 250000
          format: double
