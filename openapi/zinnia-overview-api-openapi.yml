    ModifiedEndowmentContract:
      type: object
      properties:
        modifiedEndowmentContractTestDate:
          type: string
          format: date
          description: The MEC Test Date refers to the last date on which the life insurance policy was tested to determine whether it qualifies as a Modified Endowment Contract (MEC) under IRS regulations. This date is updated whenever a new MEC test is performed, ensuring the policy remains compliant with federal tax rules
          example: '2023-01-01'
        amountExcessToModifiedEndowmentContract:
          type: number
          format: double
          description: The Amount Excess to MEC refers to the excess premium amount paid into a life insurance policy beyond the IRS-imposed Modified Endowment Contract (MEC) limit. This excess must be reimbursed, adjusted, or restructured to prevent the policy from becoming a MEC, which would alter its tax treatment
          example: 0
        modifiedEndowmentContractStatusDate:
          type: string
          format: date
          description: The MEC Status Date refers to the exact date when a life insurance policy is classified as a Modified Endowment Contract (MEC) or confirmed as non-MEC. This date is critical for determining how future withdrawals and policy loans will be taxed
          example: '2023-01-01'
        modifiedEndowmentContractStatus:
          type: boolean
          description: The MEC Status indicates whether a life insurance policy has been classified as a Modified Endowment Contract (MEC) under IRS regulations. This status determines the tax treatment of withdrawals, loans, and distributions from the policy
        sevenPayTestBasis:
          type: number
          format: double
          description: The 7-Pay Test Basis refers to the total cumulative premium paid into a life insurance policy during the first seven years (the 7-pay period), as measured against the IRS 7-Pay Test limit. This amount is used to determine whether the policy qualifies as a life insurance contract or is classified as a Modified Endowment Contract (MEC).
          example: 198
        sevenPayPremium:
          type: number
          format: double
          description: The 7-Pay Premium refers to the maximum allowable premium that can be paid into a life insurance policy during the first seven years without triggering Modified Endowment Contract (MEC) status. It ensures that the policy remains a tax-advantaged life insurance contract rather than an investment vehicle
          example: 19807.51079
        sevenPayStartDate:
          type: string
          format: date
          description: The 7-Pay Start Date / Material Change Date refers to the date when the 7-Pay Test period begins. This is initially set at policy issuance (matching the Policy Start Date) and resets whenever a material change occurs that affects the policy’s funding limits
          example: '2023-01-01'
        sevenPayPeriod:
          type: string
          format: date
          description: 'The 7-Pay Period refers to the time frame during which the policy must comply with the 7-Pay Test to avoid Modified Endowment Contract (MEC) status. It starts on the 7-Pay Start Date (initially set at policy issuance) and lasts for seven years. The 7-Pay Period Expiration Date is calculated as: 7-Pay Expiration Date=7-Pay Start Date+7 Years'
          example: '2030-01-01'
        sevenPayLimit:
          type: number
          format: double
          description: The 7-Pay Limit refers to the maximum total premium that can be paid into a life insurance policy within the first seven years without triggering Modified Endowment Contract (MEC) status. It is the benchmark used in the 7-Pay Test to determine whether a policy remains a tax-advantaged life insurance contract
          example: 0
        yearInPeriod:
          type: integer
          format: int32
          description: The Year in Period refers to the current year within the seven-year time frame of the 7-Pay Test. It is crucial because the 7-Pay Limit increases each year, and the test is updated annually to ensure the policy remains within IRS limits
          example: 0
        unnecessaryPremium:
          type: number
          format: double
          description: The Unnecessary Premium refers to the amount of premium that exceeds the limit set by the Nonforfeiture Premium Test (NPT Test). If premium payments are higher than the NPT limit, this amount is flagged as unnecessary premium, which may need to be refunded, adjusted, or redirected
          example: 232.12
    PolicyCharges:
      type: object
      properties:
        chargeType:
          $ref: '#/components/schemas/PolicyChargeType'
        coverageId:
          type: string
          description: The Coverage ID is a unique identifier assigned to a specific coverage component within a life insurance or annuity policy, used to track the specific coverage for which charges are being applied. It ensures that the correct charges (e.g., cost of insurance, rider fees, administrative fees) are linked to the appropriate coverage layer.This is optional field which will be populated by LPS
          example: Base_Coverage
        currentMonthCharge:
          type: number
          description: The Current Month Charge refers to the total amount deducted from a life insurance or annuity policy for the current billing period, covering various costs such as insurance charges, administrative fees, rider costs, and investment-related expenses
          format: double
          example: 123.12
        uncollectedPerCharge:
          type: number
          description: The Uncollected Per Charge refers to the portion of a scheduled charge that has not been paid or deducted from the policy due to insufficient funds, unpaid premiums, or cash value shortfall. This can apply to Cost of Insurance (COI), rider fees, administrative charges, or investment-related expenses
          format: double
          example: 10.42
        cumulativePerCharge:
          type: number
          description: The Cumulative Per Charge refers to the total sum of a specific charge type from the policy`s issue date until the current processing date. It provides a historical record of charges deducted over the life of the policy.. Calculated by LPS.
          format: double
          example: 721.42
        yearToDatePerCharge:
          type: number
          description: It is the sum of charges in the current policy year
          format: double
          example: 721.42
        chargePercentage:
          type: number
          format: double
          example: 12.42342
          description: The percentage rate applied as a fee or charge under the contract for a specific transaction or benefit, such as a surrender charge, withdrawal charge, rider charge, or other applicable contract fee.
    ClaimStatus:
      type: string
      enum:
      - APPROVED
      - NOTAPPROVED
      - PROCESSED
    LoanSegment:
      type: object
      properties:
        segmentId:
          type: string
          description: A unique identifier assigned to each loan segment within the policy, representing a distinct loan transaction
          example: Loan1
        loanType:
          $ref: '#/components/schemas/LoanType'
        loanInterestType:
          $ref: '#/components/schemas/LoanInterestType'
        loanInterestDue:
          type: number
          format: double
          description: Calculated loan interest amount for a policy Owner to Pay before Anniversary
          example: 1000
        loanPrincipal:
          type: number
          format: double
          description: The original amount borrowed against the policy, excluding interest
          example: 1500
        loanBalance:
          type: number
          format: double
          description: The outstanding amount of the loan, including accrued interest if applicable
          example: 1500.72
        percentageOfAccountValue:
          type: number
          format: double
          description: Percentage of Account Value refers to a value that is calculated as a percentage of the total account value of an insurance or annuity contract. It is often used to determine allocations, fees, benefits, or charges that are based on how much money is currently held in the policy's account value.
          example: 1500.72
        loanCollateralAmount:
          type: number
          format: double
          description: This amount represents the total portion of the policy’s account value that is used as collateral when a loan is taken against the policy. It is calculated as follows:Loan Collateral Amount = Loan Principal + Loan Collateral Accrued Interest When a policyholder takes a loan, this amount reflects the loaned portion of the account value that is set aside as collateral. Interest is applied to this collateralized amount at a specific rate as per the policy terms
          example: 1500.72
        preInvestmentSegmentAmount:
          type: number
          format: double
          description: TBD
          example: 0
        loanInterestRate:
          type: number
          format: double
          description: The interest rate charged on the loan balance, which may be fixed or variable based on policy terms
          example: 4.5
        loanCreditRate:
          type: number
          format: double
          description: The interest rate charged to any collateralized portion of the policy’s cash value
          example: 4
        loanAccruedInterest:
          type: number
          format: double
          description: The interest accumulated on the outstanding loan balance that has not yet been paid
          example: 0.72
        loanCollateralAccruedInterest:
          type: number
          format: double
          description: The interest accumulated on the collateral portion of account value.
          example: 0.16
        yearToDateLoanTaken:
          type: number
          format: double
          description: The amount of loans taken against the policy in the current policy year
          example: 1500
        generalLedgerFundCode:
          type: string
          description: The accounting code used in the insurer’s general ledger system to track loan fund
          example: V2201
        startDate:
          type: string
          format: date
          description: The date when the loan segment becomes active and enforceable within the policy
          example: '2023-01-01'
        endDate:
          type: string
          format: date
          description: The date when the loan segment is fully repaid, closed, or no longer applicable
          example: '2023-01-01'
