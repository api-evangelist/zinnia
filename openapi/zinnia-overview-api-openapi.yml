      - PENDING
      - SUSPENDED
    LoanInterestType:
      type: string
      enum:
      - FIXED
      - INDEXED
      - VARIABLE
      - ADJUSTABLE
    AccountValues:
      type: object
      properties:
        beginningAccountValue:
          type: number
          description: The Account Value refers to the total cash value of a life insurance policy or annuity at the beginning of each transaction, including both loaned and unloaned amounts. It represents the policy’s accumulated value before deductions, withdrawals, or new transactions
          example: 161.81698
        endingAccountValue:
          type: number
          description: The Current Account Value refers to the total cash value of a life insurance policy or annuity (including loaned and unloaned amounts) as of the last processed transaction. This value is used to determine the available account value (AV) for policyholders and is also the amount on which Fixed Interest is credited
          example: 161.81698
        minimumRequiredAccountValue:
          type: number
          description: The Minimum Required Account Value refers to the lowest amount of account value that must be maintained in a life insurance policy or annuity to keep the contract active and prevent policy lapse. If the account value falls below this threshold, the policy may enter a grace period, require additional premium payments, or terminate. For some products this may be "0"
          example: 0
        accountValueByPolicyYear:
          type: number
          description: The Account Value by Policy Year refers to the total account value at the beginning of each policy year, before any new transactions such as premium payments, withdrawals, loans, or interest credits are applied. This value helps track policy growth, cash value accumulation, and available funds over time
          example: 0
        unloanedPortionOfAccountValue:
          type: number
          description: The Unloaned Portion of Account Value refers to the part of the total account value that is not affected by policy loans. Once a policy loan is taken, the total account value is split into loaned and unloaned portions, with the unloaned portion continuing to accrue interest and potential investment returns
          example: 161.81698
        loanedPortionOfAccountValue:
          type: number
          description: The Loaned Portion of Account Value refers to the amount of a policy’s account value that is used as collateral for a policy loan. This amount is set aside from the Ending Account Value and is used to calculate loan interest accruals. The loaned portion is updated each time a new loan is processed
          example: 0
        surrenderValue:
          type: number
          description: The Account Surrender Value refers to the amount an insurance company pays to the policyholder when they voluntarily cancel (surrender) their life insurance policy or annuity before its maturity or death benefit payout. This value is determined after deducting surrender charges, outstanding loans, and applicable fees from the policy’s total account value
          example: 161.81698
        surrenderValueWithoutMarketValueAdjustment:
          type: number
          format: double
          description: Sum of money an insurance company pays to the policyholder or account owner upon the surrender of a policy/account without MVA value included
          example: 161.81698
        surrenderValueWithZeroMarketValueAdjustment:
          type: number
          format: double
          description: For Valuation (Reserving purposes). The account surrender value where the surrender charge has been recalculated assuming $0 MVA
          example: 161.81698
        guaranteedCashSurrenderValueFixed:
          type: number
          description: The Guaranteed Cash Surrender Value (Fixed) refers to the minimum cash value that a policyholder is assured to receive if they surrender their life insurance policy, regardless of market conditions. This amount is contractually defined and does not fluctuate with policy performance
          format: double
          example: 161.81698
        guaranteedCashSurrenderValueIndexed:
          type: number
          description: The indexed amount of cash that the policyholder is guaranteed to receive upon surrendering the policy before its maturity.Only required for Annuity FIA Products
          format: double
          example: 161.81698
        netAmountAtRisk:
          type: number
          description: The Net Amount at Risk (NAR) is the difference between the policy’s total death benefit and the policy’s account value (cash value). It represents the portion of the death benefit that the insurance company is at risk of paying out beyond the policyholder’s accumulated account value
          example: 16.81698
        deemedAccountValue:
          type: number
          description: The Deemed Account Value refers to an adjusted account value used for specific policy calculations, regulatory compliance, or benefit determinations. It may differ from the actual account value due to adjustments for policy loans, fees, surrender charges, or regulatory requirements
          example: 16.81698
        initialPremiumRequestAmount:
          type: number
          description: The Initial Premium Request Amount refers to the first premium payment made by the policyholder (party) to initiate coverage on a life insurance or annuity contract. This amount is required to activate the policy and begin accumulating benefits
          example: 99
        initialPremiumAppliedAmount:
          type: number
          description: The Initial Premium Applied Amount refers to the portion of the initial premium payment that is officially applied to the policy after processing. This amount determines when the policy becomes active and how funds are allocated within the contract
          example: 99
        initialPaymentAmountReceivedDate:
          type: string
          format: date
          description: The Initial Premium Amount Received Date refers to the date when the insurance company's home office officially receives the first premium payment for a life insurance policy or annuity contract. This date is crucial as it determines when the policy processing begins and may impact policy activation timelines
          example: '2023-01-01'
        cumulativePremiumSinceIssue:
          type: number
          description: The Cumulative Premium Since Issue refers to the total amount of premiums paid into a life insurance policy or annuity contract from the policy’s start date (issue date) to the present. This figure represents all premium contributions made by the policyholder over time
          example: 198
        totalYearToDatePremiumAmount:
          type: number
          description: The Total (YTD) Premium Amount refers to the total premium applied to a life insurance policy or annuity contract within the current calendar or policy year, up to the present date. This value is used to track year-to-date contributions and ensure policy funding requirements are met
          example: 198
        modifiedEndowmentContractAuthorization:
          type: string
          enum:
          - 'true'
          - 'false'
          description: MEC Authorization refers to the approval process required when a life insurance policy is classified as a Modified Endowment Contract (MEC). A MEC is a permanent life insurance policy that fails the IRS "7-Pay Test," resulting in different tax treatment of policy loans and withdrawals. MEC Authorization is typically required from the policyholder before processing transactions that could convert the policy into a MEC, ensuring they understand the tax consequences.
        projectedLapseIndicator:
          type: boolean
          description: The Projected Lapse Indicator is a forecast that indicates whether a life insurance policy is expected to lapse within the next policy year based on its current account value, premium payments, cost of insurance (COI), and other policy charges
        policyGainAmount:
          type: number
          description: The Policy Gain Amount is the difference between the policy’s total account value and the cost basis. It represents the amount of gain that may be subject to taxation if withdrawn or surrendered
          example: 0
        uncollectedCharges:
          type: number
          description: Uncollected Charges refer to negative charges assessed when a policy is in a lapse condition due to insufficient funds in the policy’s account value. These charges represent policy fees, cost of insurance (COI), and other deductions that could not be collected because the policy had inadequate cash value
          example: 0
        annualTargetPremium:
          type: number
          description: 'The Annual Target Premium is the calculated premium amount used to determine commissions for agents and brokers. It represents the portion of the policy premium that qualifies for commission payments and is calculated based on specific monthly charges within the policy. The Annual Target Premium for the calculation of commissions will be calculated using the following formula: [(Monthly Expense Charge + Monthly Unit Charge + Monthly Coverage Charge + Children’s Term Insurance Rider Charge) ÷ (1 – Payment Charge)] × 12]'
          example: 99.9
          format: double
        modalTargetPremium:
          type: number
          description: 'The Modal Target Premium is the periodic premium amount used for commission calculations based on the chosen payment mode (e.g., monthly, quarterly, semi-annually, or annually). It is derived from the Annual Target Premium and represents how much of the target premium is allocated to each payment cycle. Modal Target Premium for the calculation of commissions will be calculated using the following formula: [(Monthly Expense Charge + Monthly Unit Charge + Monthly Coverage Charge + Children’s Term Insurance Rider Charge) ÷ (1 – Payment Charge)] × 12]'
          example: 99.9
          format: double
        annualizedPremium:
          type: number
          description: Annualized Premium refers to the total amount of premium a policyholder is expected to pay over the course of a full year, assuming the policy remains active and all scheduled premium payments are made on time and in full. It is a standardized representation of premium income, regardless of payment mode (monthly, quarterly, semiannual, or annual)
          example: 99.99
          format: double
        unearnedPremium:
          type: number
          description: Unearned Premium is the portion of a policyholder’s premium that has been paid in advance but corresponds to future coverage—i.e., insurance protection that has not yet been provided. It represents a liability on the insurer’s books because it reflects coverage that still needs to be delivered
          example: 99.99
          format: double
        excessPremium:
          type: number
          format: double
          description: Excess Premium refers to the amount of premium paid into a life insurance or annuity policy that exceeds the allowable or intended limits set by the contract, regulatory testing (e.g., MEC or Guideline Premium Tests), or policy design (e.g., target or planned premiums).
          example: 99.99
        outstandingLifetimePremium:
          type: number
          format: double
          description: Outstanding Lifetime Premium refers to the total amount of premium that remains unpaid over the lifetime of the policy, based on the expected premium schedule set at issue or during the most recent plan update. It represents the future premium obligation assuming the policyholder continues to pay until the end of the coverage period or maturity
          example: 99.99
        suppressionIndicator:
          type: boolean
          description: The Suppression Indicator is a flag or marker used in policy administration systems to prevent certain actions, notifications, or transactions from being processed or displayed. It is commonly applied to billing, statements, reports, or policy updates based on specific business rules
        interestEarned:
          type: number
          format: double
          description: The Interest Earned refers to the amount of interest credited to a life insurance policy or annuity contract based on the accumulated account value. This interest may be guaranteed (fixed) or variable (market-based), depending on the policy type
          example: 99.12
        totalNetWithdrawalSinceIssue:
          type: number
          description: Running total of all Net Withdrawals since policy issuance
          format: double
        totalGainWithdrawnSinceIssue:
          type: number
          description: Total of all earnings withdrawn since policy issue
          format: double
        employeeRetirementIncomeSecurityActIndicator:
          type: boolean
          description: ERISA Indicator is a field that specifies whether a policy or contract is subject to the Employee Retirement Income Security Act of 1974 (ERISA) — a federal law that governs certain employer-sponsored retirement and benefit plans in the U.S.
        cumulativePremiumReceived:
          type: number
          format: double
          description: Cumulative Premium Received refers to the total sum of premium payments that have been successfully received and applied to a policy from the date of issuance up to a given point in time.
          example: 99.99
        previousModePremiumReceived:
          type: number
          format: double
          description: Previous Mode Premium Received refers to the actual premium amount collected during the prior billing mode period for a specific policy or coverage. This value reflects what was received for the most recently completed premium cycle (monthly, quarterly, semi-annual, or annual), immediately preceding the current period.
          example: 99.99
        offageAmount:
          type: number
          format: double
          description: Offage Amount refers to the difference between the expected or scheduled value and the actual value applied or received on a policy transaction, typically related to premium payments, disbursements, or reserve adjustments. It acts as a variance indicator, flagging whether there is an overage or shortage that needs reconciliation.
          example: 99.99
        totalGuaranteedCashSurrenderValue:
          type: number
          format: double
          description: The minimum guaranteed amount that the policyholder would receive upon surrendering the contract, as defined by the contracts guaranteed values.
          example: 161.81698
    HoldingForm:
      type: string
      enum:
      - INDIVIDUAL
      - GROUP
      - JOINTINDIVIDUAL
    DisbursementType:
      type: string
      enum:
      - GROSS
      - NET
      - NETNET
    RiderCoverageLayer:
      type: object
      properties:
        coverageId:
          type: string
          description: The Coverage ID is a unique identifier assigned to a specific coverage type or benefit within an insurance policy. It helps insurance companies, agents, and policyholders track and differentiate multiple coverage components within a single policy.
          example: Base_Coverage
        coverageType:
          type: string
          enum:
          - BASE
          - RIDER
          - BASEINCREASE
          - INTEGRATEDRIDER
          - RIDERINCREASE
          - BENEFIT
          - DISCOUNT
          - OTHER
          - UNKNOWN
          description: The type of rider denoting if benefit is applicable to base coverage or a distinct  coverage or addition to base coverage or a benefit without any coverage
        coverageName:
          type: string
          description: The Coverage Name in a life insurance policy refers to the specific title or label assigned to a coverage type within the policy contract. It helps insurers, agents, and policyholders identify, classify, and manage different coverage components in a policy.
          example: Base_Coverage
        productCode:
          type: string
          description: The Plan Code is a carrier-assigned alphanumeric identifier used to uniquely distinguish a specific insurance or annuity product, rate structure, version, and coverage layer within an insurer's portfolio. It is essential for policy administration, pricing, underwriting, and claims processing.
          example: EVGL1
        coverageTerm:
          type: number
          format: int32
          description: Coverage Term refers to the number of years that a life insurance policy or specific coverage component is intended to remain in force, providing protection to the insured. It defines the planned duration of insurance coverage, after which the coverage may expire, renew, or convert, depending on the product type.
          example: 1
        approvedCoverageAmount:
          type: number
          format: double
          description: The Approved Coverage Amount refers to the specific amount of insurance coverage that has been approved by the insurer during the underwriting process. It represents the face amount (death benefit) the insurer has agreed to issue based on the applicant's risk profile, health, and other underwriting criteria.
          example: 10000
        currentAmount:
          type: number
          format: double
          description: The Current Coverage Amount refers to the active or present death benefit or coverage value available under the policy at a specific point in time. It reflects any adjustments, policy changes, withdrawals, or loans that may have altered the original coverage amount.
          example: 300000
        originalCoverageAmount:
          type: number
          format: double
          description: The Original Coverage Amount refers to the initial face value or death benefit of a policy at the time of issuance before any policy modifications, withdrawals, loans, or benefit reductions. It represents the starting coverage amount agreed upon when the policy was first issued.
          example: 300000
        minimumCoverageAmount:
          type: number
          format: double
          description: The Minimum Coverage Amount at Each Coverage Level refers to the lowest permissible amount of insurance coverage allowed per policy layer, as set by the insurance carrier. It ensures policies remain financially viable and comply with regulatory and underwriting standards.
          example: 10000
        maximumCoverageAmount:
          type: number
          format: double
          description: 'The Maximum Coverage Amount at Each Coverage Level refers to the highest permissible amount of insurance coverage allowed per policy layer, as set by the insurance carrier. '
          example: 10000000
        grossDeathBenefitAmount:
          type: number
          format: double
          description: The Gross Death Benefit per Coverage Layer refers to the total pre-deduction death benefit amount assigned to each specific coverage layer within a policy. It represents the sum of all base coverage amounts, riders, and enhancements before applying policy adjustments such as loans, withdrawals, or unpaid premiums.
          example: 300000
        lowDeathBenefitAmount:
          type: number
          format: double
          description: Low Death Benefit refers to the lowest possible death benefit guaranteed within each specific coverage component of a policy. This ensures that beneficiaries receive at least a minimum death benefit regardless of market performance, policy changes, or withdrawals.
          example: 300000
        coverageChangeAmount:
          type: number
          format: double
          description: The Coverage Change Amount refers to the specific increase or decrease in coverage that occurs within a life insurance policy due to policyholder requests, automatic adjustments, or insurer-initiated changes. This amount reflects the difference between the original or prior coverage amount and the new coverage amount after the change takes effect.
          example: 3000000
        coverageEffectiveDate:
          type: string
          format: date
          description: The Coverage Effective Date refers to the date when an increase in coverage or a new coverage component officially takes effect in a life insurance policy. It marks the beginning of the insured’s eligibility for the new or increased benefits.
          example: '2023-01-01'
        coverageChangeEffectiveDate:
          type: string
          format: date
          description: The Coverage Change Effective Date (for a decrease in coverage) refers to the date when the reduced coverage amount officially takes effect in a life insurance policy. It marks the point from which the new lower coverage amount applies.
          example: '2023-01-01'
        coverageTerminationDate:
          type: string
          format: date
          description: The Coverage Termination Date refers to the date when a policy's coverage officially ends, meaning the insured is no longer protected under the contract. After this date, no benefits or claims can be paid unless reinstatement is an option.
          example: '2023-01-01'
        unitOfCoverage:
          type: number
          format: double
          description: 'The Unit of Coverage refers to the measurement standard used to define the amount of coverage provided under a life insurance policy. It helps insurers calculate premiums, determine benefit payouts, and structure policies consistently.In life insurance, the unit of coverage is typically measured per $1,000 of face amount. '
          example: 300
        valuePerUnitOfCoverage:
          type: number
          format: double
          description: The Value per Unit of Coverage refers to the monetary worth of each unit of coverage in a life insurance policy, which is used for premium calculations, benefit payouts, and policy adjustments. This value helps insurers standardize pricing and policy structures.In life insurance, the value per unit represents the cost per $1,000 of coverage or payout per unit of death benefit.In annuities, it determines the payout per annuity unit or per $1,000 of account value.
          example: 1000
        guidelineSinglePremium:
          type: number
          format: double
          description: The Guideline Single Premium (GSP) is the maximum single premium payment that can be made into a life insurance policy without causing it to lose its tax-advantaged status as life insurance under IRS guidelines. It is determined based on IRS regulations and ensures that the policy remains compliant with Section 7702 of the Internal Revenue Code.
          example: 65068.27
        guidelineLevelPremium:
          type: number
          format: double
          description: The Guideline Level Premium (GLP) is the maximum total premium that can be paid over time into a life insurance policy without violating IRS regulations under Section 7702. It ensures that a policy retains its tax-advantaged status as life insurance and does not become classified as a Modified Endowment Contract (MEC).
          example: 4695.39
        sevenPayPremium:
          type: number
          format: double
          description: The 7-Pay Premium refers to the maximum cumulative premium that can be paid into a life insurance policy during the first seven years without causing the policy to become a Modified Endowment Contract (MEC). It is part of the 7-Pay Test, which ensures that life insurance policies do not become overfunded and lose their tax advantages.
          example: 19807.51
        modalPremium:
          type: number
          format: double
          description: Modal Premium refers to the actual premium amount a policyholder pays based on the selected billing frequency (mode)—such as monthly, quarterly, semiannual, or annual. It represents the current periodic payment due for the base coverage and any attached riders under a life or annuity insurance policy.
          example: 1000
        cumulativeModalPremium:
          type: number
          format: double
          description: Cumulative Modal Premium refers to the sum of actual premium amount a policyholder pays based on the selected billing frequency (mode)—such as monthly, quarterly, semiannual, or annual. It represents the sum of current periodic payment due for the base coverage and any attached riders under a life or annuity insurance policy.
          example: 1000
        coverageTargetPremium:
          type: number
          format: double
          description: Coverage Target Premium refers to the designated premium amount on a life insurance policy that:Qualifies for full target-level commissions in the first policy year, and Forms the basis for renewal commissions in subsequent policy years.Note - This is modal premium value
          example: 300000
        annualPremium:
          type: number
          format: double
          description: The annual premium is the total amount you would pay for a full year of life insurance or annuity if you made just one payment per year.
          example: 1000
        overdueModalPremium:
          type: number
          format: double
          description: refers to a scheduled premium payment that was not received or applied by its due date, based on the policy’s modal frequency (e.g., monthly, quarterly, semi-annual, or annual). It represents a missed payment obligation that remains outstanding and may trigger administrative or policy-level actions
          example: 1000
    WithdrawalValues:
      type: object
      properties:
        totalWithdrawalAmount:
          type: number
          format: double
          description: The Total Withdrawal Amount refers to the cumulative amount of funds withdrawn from a life insurance policy or annuity by the policyholder. This includes all withdrawals made since the policy’s inception, whether taken as partial surrenders, cash value withdrawals, or systematic distributions
          example: 0
        freeWithdrawalAmount:
          type: number
          format: double
          description: The Free Withdrawal Amount refers to the maximum amount a policyholder can withdraw from their life insurance policy or annuity in a contract year without incurring a surrender charge. This limit is set by the insurer and is typically expressed as a percentage of the account value or premiums paid
          example: 0
        yearToDateFreeWithdrawalAmount:
          type: number
          format: double
          example: 0
          description: The YTD Free Amount (Year-To-Date Free Withdrawal Amount) refers to the total amount withdrawn so far in the current contract year that was within the free withdrawal limit, meaning it did not incur surrender charges. This tracks how much of the allowable free withdrawal limit has been used
        minimumWithdrawalAmount:
          type: number
          format: double
          description: The Minimum Withdrawal Amount refers to the smallest amount a policyholder can withdraw from their life insurance policy or annuity in a single transaction, as defined by the insurer. This ensures that withdrawals remain administratively efficient and align with policy rules
          example: 1
        maximumWithdrawalAmount:
          type: number
          format: double
          description: The Maximum Withdrawal Amount refers to the highest amount a policyholder can withdraw from their life insurance policy or annuity in a single transaction or within a policy year, as set by the insurer. This ensures that withdrawals do not deplete the policy’s cash value too quickly or violate contract terms
          example: 161.81698
        annualWithdrawalLimitNoCoverageDecrease:
          type: number
          format: double
          description: The Annual Withdrawal Limit for No Coverage Decrease refers to the maximum amount a policyholder can withdraw from their life insurance policy within a policy year without reducing the death benefit or coverage amount. This ensures that policyholders can access cash value while maintaining full coverage
          example: 322.678939
        maximumWithdrawalRequestDuringVestingPeriod:
          type: number
          format: int32
          description: The Max Withdrawal Request Allowed During Vesting Period refers to the highest number of withdrawal transactions permitted within the vesting period of a life insurance policy or annuity. This ensures policyholders follow contract rules while maintaining eligibility for vested benefits
          example: 1
        yearToDateNumberOfWithdrawal:
          type: number
          description: The YTD (Year-To-Date) Number of Withdrawals refers to the total count of withdrawal transactions made by the policyholder from the beginning of the policy year to the present date. This tracks how frequently funds have been withdrawn within the current policy year
          example: 1
          format: int32
        maximumWithdrawalRequestAfterVestingPeriod:
          type: number
          description: The Max Withdrawal Request Allowed After Vesting Period refers to the highest number of withdrawals a policyholder can make per year or over the life of the policy after the vesting period has ended. This ensures that policyholders can access their funds while still maintaining policy sustainability and compliance with contract terms
          example: 12
          format: int32
        totalYearToDateWithdrawalTaken:
          type: number
          description: The Total YTD (Year-To-Date) Withdrawal Taken refers to the total amount withdrawn by the policyholder from their life insurance policy or annuity within the current contract year. This tracks all withdrawals made so far from the beginning of the policy year up to the present date.
          example: 0
          format: double
        numberOfWithdrawal:
          type: number
          description: The Number of Withdrawals refers to the total count of withdrawal transactions made by the policyholder within a specified period, typically within the current policy year or calendar year. This tracks how frequently funds have been withdrawn from the policy
          example: 0
          format: int32
        withdrawalAllowedStartDate:
          type: string
          description: The Withdrawal Allowed Start Date refers to the calculated date from which the policyholder is permitted to make withdrawals from the policy’s cash value or annuity funds. This date is determined based on policy terms, surrender charge periods, and regulatory restrictions
          example: '2023-01-01'
          format: date
        remainingFreeWithdrawalAmount:
          type: number
          format: double
          description: The remaining portion of the annual free withdrawal allowance that the policyholder can withdraw during the current contract year without incurring surrender charges or withdrawal penalties.
          example: 0
      required:
      - yearToDateFreeWithdrawalAmount
