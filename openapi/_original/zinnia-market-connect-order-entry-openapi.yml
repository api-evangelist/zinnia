        sectionGroupKey:
          type: string
          description: A key used to group related sections within the blueprint
          nullable: true
        partName:
          minLength: 1
          type: string
          description: An identifier (partName) for the section
        title:
          allOf:
          - $ref: '#/components/schemas/LocalizedText'
          description: The section title in multiple languages. Supports localization through language codes (e.g., en, fr)
        modules:
          type: array
          items:
            type: string
          description: An array of module names associated with this section
          nullable: true
        isCustom:
          type: boolean
          description: Indicates whether this section is custom
        subsections:
          type: array
          items:
            $ref: '#/components/schemas/SubsectionBlueprint'
          description: Array of subsections within this section
          nullable: true
        copyable:
          type: string
          description: Role identifier controlling copy behavior. Use 'none' to disable copying, or a role name (e.g., 'owner',
            'annuitant', 'insured', 'payor'). Multiple roles may be comma-separated.
          nullable: true
        renderOn:
          type: array
          items:
            type: string
          description: An array of conditions that determine when a section is rendered
          nullable: true
        pdfDocuments:
          type: array
          items:
            type: string
          description: An array of PDF document identifiers where this section appears
          nullable: true
        platforms:
          type: array
          items:
            type: string
