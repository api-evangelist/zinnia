    SubmitTransactionResponse:
      required:
      - message
      - transactionId
      type: object
      properties:
        transactionId:
          minLength: 1
          type: string
          description: The unique identifier for the submitted transaction. Echoed back from the request.
        message:
          minLength: 1
          type: string
          description: Human-readable confirmation that the submit request was accepted.
      additionalProperties: false
      example:
        transactionId: '12345'
        message: Transaction submitted successfully
    Subscriber:
      type: object
      properties:
        triggers:
          type: array
          items:
            type: string
          description: NamedItem identifiers of the form fields whose value change fires this subscriber.
          nullable: true
        conditions:
          type: array
          items: {}
          description: Optional conditions that must hold for the subscriber to execute. Omitted when not used.
          nullable: true
        actions:
          type: array
          items:
            $ref: '#/components/schemas/SubscriberAction'
          description: Actions executed when any of the triggers fire. Each action declares an HTTP call plus one or more
            response handlers.
          nullable: true
      additionalProperties: false
      example:
        triggers:
        - FirstName
        actions:
        - type: http
          verb: get
          url: /market-connect/order-entry/v1/transaction/1125715/MCDPS
          token: OEToken
          payload:
            type: none
          responseHandlers:
          - type: blueprint-modification
            action: replace-whole
            value:
              type: response-query
              kind: json-path
              value: $.data
    SubscriberAction:
      type: object
      properties:
        type:
          type: string
          description: The action transport. Currently always "http".
          nullable: true
        verb:
          type: string
          description: HTTP verb to use (e.g., "get", "post").
          nullable: true
        url:
          type: string
          description: 'Relative URL of the OE endpoint to call when the trigger fires. Three shapes are emitted: ''/market-connect/order-entry/v1/dataset''
            (dataset refresh); ''/market-connect/order-entry/v1/transaction/{transactionId}/{stepName}'' (multi-step blueprint
            refresh); ''/market-connect/order-entry/v1/transaction/{transactionId}'' (single/enhanced blueprint refresh).'
          nullable: true
        token:
          type: string
          description: Bearer-token alias forwarded by the UI on the call. Always "OEToken" today.
          nullable: true
        payload:
          allOf:
          - $ref: '#/components/schemas/SubscriberActionPayload'
          description: Request payload envelope. Use type "none" when no body is required.
          example:
            type: basic
            payload:
              transactionId: '1125715'
              stepName: MCDPS
              fieldId: '531783'
        responseHandlers:
          type: array
          items:
            $ref: '#/components/schemas/SubscriberResponseHandler'
          description: One or more handlers that apply the upstream response back to the form.
          nullable: true
      additionalProperties: false
      example:
        type: http
        verb: get
        url: /market-connect/order-entry/v1/transaction/1064727
        token: OEToken
        payload:
          type: none
        responseHandlers:
        - type: blueprint-modification
          action: replace-whole
          value:
            type: response-query
            kind: json-path
            value: $.data
    SubscriberActionPayload:
      type: object
      properties:
        type:
          type: string
          description: Payload kind. "basic" includes a key/value map in the "payload" field; "none" omits the body.
          nullable: true
        payload:
          type: object
          additionalProperties:
            type: string
          description: Inner payload key/value map. Omitted from the JSON envelope when type is "none".
          nullable: true
      additionalProperties: false
      example:
        type: basic
        payload:
          transactionId: '1125715'
          stepName: MCDPS
          fieldId: '531783'
    SubscriberResponseHandler:
      type: object
      properties:
        type:
          type: string
          description: Handler kind. "context-modification" updates a context namespace; "blueprint-modification" applies
            the response to the rendered blueprint.
          nullable: true
        action:
          type: string
          description: 'Action to perform within the chosen handler kind. Examples: "update-namespace", "replace-whole".'
          nullable: true
        namespace:
          type: string
          description: Namespace to update for context-modification handlers. Omitted for handler types that do not use a
            namespace.
          nullable: true
        value:
          allOf:
          - $ref: '#/components/schemas/SubscriberResponseValue'
          description: How to extract the value to apply from the upstream response.
          example:
            type: response-query
            kind: json-path
            value: $.data
      additionalProperties: false
      example:
        type: blueprint-modification
        action: replace-whole
        value:
          type: response-query
          kind: json-path
          value: $.data
    SubscriberResponseValue:
      type: object
      properties:
        type:
          type: string
          description: Value source kind. "response-query" extracts via a query expression on the response body.
          nullable: true
        kind:
          type: string
          description: Query language used to evaluate the value expression. Currently always "json-path".
          nullable: true
        value:
          type: string
          description: The query expression itself (e.g., "$.data" to grab the response's data branch).
          nullable: true
      additionalProperties: false
      example:
        type: response-query
        kind: json-path
        value: $.data
    SubsectionBlueprint:
      required:
      - id
      - partName
      - title
      type: object
      properties:
        id:
          minLength: 1
          type: string
          description: The unique identifier for the subsection
        partName:
          minLength: 1
          type: string
          description: The part name for the subsection
        text:
          allOf:
          - $ref: '#/components/schemas/LocalizedText'
          description: Text content for the subsection
        title:
          allOf:
          - $ref: '#/components/schemas/LocalizedText'
          description: The title of the subsection
        isCustom:
          type: boolean
          description: Indicates if this is a custom subsection
        fieldGroups:
          type: array
          items:
            $ref: '#/components/schemas/FieldGroupBlueprint'
          description: Array of field groups within this subsection
          nullable: true
        subsections:
          type: array
          items:
            $ref: '#/components/schemas/SubsectionBlueprint'
          description: Array of nested subsections within this subsection
          nullable: true
        showInNavigation:
          type: boolean
          description: Indicates if this subsection should be shown in navigation
        copyable:
          type: string
          description: Role identifier controlling copy behavior. Use 'none' to disable copying, or a role name (e.g., 'owner',
            'annuitant', 'insured', 'payor'). Multiple roles may be comma-separated.
          nullable: true
        visible:
          allOf:
          - $ref: '#/components/schemas/VisibilitySettings'
          description: 'Visibility conditions for the subsection. When present, the subsection is only visible when all conditions
            are met. Example: { "booleanOperator": "AND", "conditions": [ { "type": "equality", "isEqual": true, "value":
            "NY", "targetNodeId": "SolicitationStateCode" } ] }'
          example:
            booleanOperator: AND
            conditions:
            - type: equality
              isEqual: true
              value: 'Yes'
              targetNodeId: Transaction.SolicitationState
        repeatable:
          allOf:
          - $ref: '#/components/schemas/RepeatableBlueprint'
          description: Repeat-instance metadata when the wizard subsection or custom control declares IsRepeated.
      additionalProperties: false
    TransactionDataQuestionRowsMap:
      title: TransactionDataQuestionRowsMap
      type: object
      properties:
        '259726':
          $ref: '#/components/schemas/QuestionDataRows'
      additionalProperties:
        $ref: '#/components/schemas/QuestionDataRows'
      description: Answers keyed by blueprint question id or composite collection field id. Named properties below are representative
        examples (same keys as the default example); any other field id is valid and uses the same value shape (see additionalProperties
        → QuestionDataRows → QuestionData). Each array entry is one row; use index for repeatable collection instances.
      example:
        '259726':
        - id: '259726'
          type: dropdown
          questionText: Account designation
          questionSubText: Account designation
          displayValue: Owner
          value: Owner
          index: 0
    TransactionResponse:
      required:
      - blueprint
      - data
      - transactionId
      type: object
      properties:
        transactionId:
          minLength: 1
          type: string
          description: The unique identifier for the created transaction
        caseId:
          type: string
          description: The case identifier returned by the product service
          nullable: true
        data:
          $ref: '#/components/schemas/TransactionDataQuestionRowsMap'
        blueprint:
          $ref: '#/components/schemas/Blueprint'
        subscribers:
          type: array
          items:
            $ref: '#/components/schemas/Subscriber'
          description: 'Reactive subscriber definitions consumed by the UI. Each subscriber declares trigger fields, an HTTP
            action to run on change, and a response handler. Two flavors are emitted: dataset-dependency (context-modification)
            and blueprint-modification (replace-whole).'
          nullable: true
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorInfo'
