    FieldBlueprint:
      required:
      - fieldType
      - id
      - partName
      - text
      - title
      type: object
      properties:
        fieldType:
          enum:
          - money
          - date
          - information
          - radio
          - input
          - email
          - dropdown
          - phone
          - checkboxgroup
          - number
          - checkbox
          type: string
          description: 'The type of field displayed for collecting response values:

            money - Currency input field

            date - Date selection input field

            information - Read-only informational text display field

            radio - Single-selection radio button field

            input - Free-form text input field

            email - Email address input field

            dropdown - Selection field with predefined options

            phone - Phone number input field

            checkboxgroup - Checkbox group field for multiple selections

            number - Number input field for numeric values

            checkbox - Checkbox field for single selection (value is string)'
        text:
          allOf:
          - $ref: '#/components/schemas/LocalizedText'
          description: The text associated with a field title, such as descriptions or related notes. Supports localization
            through language codes (e.g., en, fr)
        title:
          allOf:
          - $ref: '#/components/schemas/LocalizedText'
          description: The field title in multiple languages. Supports localization through language codes (e.g., en, fr)
        answerNodeId:
          type: string
          description: A unique identifier used to store and infer a field's answer, and to build validation and visibility
            conditions across the order entry blueprint
          nullable: true
        renderOn:
          type: array
          items:
            $ref: '#/components/schemas/RenderCondition'
          description: An array of conditions that determine when a field is rendered
          nullable: true
        platforms:
          type: array
          items:
            type: string
          description: An array of platforms where this field is available (e.g., D2C-only versus advisor-driven experiences)
          nullable: true
        copyable:
          type: string
          description: A comma-separated list of roles (e.g., annuitant, insured, owner, payor) that are allowed to copy this
            field.
          nullable: true
        triggerStepNavigation:
          type: boolean
          description: Indicates whether the field triggers step navigation
        layout:
          allOf:
          - $ref: '#/components/schemas/LayoutSettings'
          description: Layout options for the field. Used to define the field's rendered width in the 12-column grid.
        displayInCardPreview:
          type: boolean
          description: Indicates whether this field should be displayed in card preview mode
        applicationModes:
          type: array
          items:
            type: string
          description: Array of application modes where this field is available. Helper for filtering what is shown in different
            modes or channels
          nullable: true
        placeholder:
          allOf:
          - $ref: '#/components/schemas/LocalizedText'
          description: List of localized default text values for the field. When rendered, the appropriate localized text
            is displayed as the field's initial answer until modified.
        id:
          minLength: 1
          type: string
          description: The unique identifier for the field
        partName:
          minLength: 1
          type: string
          description: An identifier (partName) for the field.
        validateAs:
          type: string
          description: Validation type applied to fields such as phone numbers, where the value must contain digits only.
            These validations exist and are managed through Zinnia UI
          nullable: true
        selectOptions:
          type: array
          items:
            $ref: '#/components/schemas/SelectOption'
          description: Array of options (answers) that can be selected for dropdown, radio, checkbox, or checkboxgroup fields
          nullable: true
        selectOptionsApplicationContext:
          allOf:
          - $ref: '#/components/schemas/SelectOptionsApplicationContext'
          description: Application context for select options sourced from subscriber dataset
          example:
            tag: '507602'
            labelKey:
              en: Name
            valuePath: Value
        visible:
          allOf:
          - $ref: '#/components/schemas/VisibilitySettings'
          description: Visibility settings containing a boolean operator and an array of conditions that determine when the
            field is visible.
          example:
            booleanOperator: AND
            conditions:
            - type: equality
              isEqual: true
              value: 'Yes'
              targetNodeId: Transaction.SolicitationState
        valid:
          type: array
          items:
            $ref: '#/components/schemas/FieldValidationRule'
          description: An array of validation rules applied to the field (e.g., regex, number range, character count)
          nullable: true
          example:
          - message:
              en: Please enter valid email address
            conditions:
              conditions:
              - type: matchesRegexCondition
                targetNodeId: Transaction.Beneficiaries[0].EmailAddresses["Home"].Address
                regex: ^\w+([-+.']\w+)*@\w+([-.]\w+)*\.\w+([-.]\w+)*$
          - message:
              en: Please enter value greater than or equal to 1 and less than or equal to 9999999999
            conditions:
              booleanOperator: and
              conditions:
              - type: numberComparisonCondition
                targetNodeId: Transaction.Payments[0].MonetaryAmounts["PaymentAmount"].CurrencyAmount
                value: 9999999999
                operator: lessThanOrEqual
              - type: numberComparisonCondition
                targetNodeId: Transaction.Payments[0].MonetaryAmounts["PaymentAmount"].CurrencyAmount
                value: 1
                operator: greaterThanOrEqual
          - message:
              en: Please enter no more than 128 characters
            conditions:
              conditions:
              - type: characterCountInBetween
                targetNodeId: PhysicalAddress.Line1
                value:
                  minLength: 0
                  maxLength: 128
        optional:
          type: boolean
          description: Indicates if this field is optional (not required)
        disabled:
          type: boolean
          description: 'Indicates whether the field is rendered as disabled (read-only) in the form. Emitted when the upstream
            control carries ReadOnly: 1 / ReadOnly: true. Omitted when the field is not disabled.'
          nullable: true
          example: true
        hidden:
          type: boolean
          description: Indicates the field is not displayed in the UI but is still present in the blueprint and data. Emitted
            as true when upstream BaseControlType is 15 (Hidden). Omitted for all other field types.
          nullable: true
      additionalProperties: false
    FieldGroupBlueprint:
      required:
      - id
      - partName
      type: object
      properties:
        id:
          minLength: 1
          type: string
          description: The unique identifier for the field group
        partName:
          minLength: 1
          type: string
          description: An identifier (partName) for the field group
        text:
          allOf:
          - $ref: '#/components/schemas/LocalizedText'
          description: The text associated with a field group, such as descriptions or related notes. Supports localization
            through language codes (e.g., en, fr).
        title:
          allOf:
          - $ref: '#/components/schemas/LocalizedText'
          description: The title of the field group in multiple languages. Supports localization through language codes (e.g.,
            en, fr).
        isCustom:
          type: boolean
          description: Indicates whether this is a custom field group
        fields:
          type: array
          items:
            $ref: '#/components/schemas/FieldBlueprint'
          description: Array of fields (questions) within this field group
          nullable: true
        displayAsCard:
          type: boolean
          description: Indicates if this field group should be displayed as a card
        copyable:
          type: string
          description: Role identifier controlling copy behavior. Use 'none' to disable copying, or a role name (e.g., 'owner',
            'annuitant', 'insured', 'payor'). Multiple roles may be comma-separated.
          nullable: true
        repeatable:
          allOf:
          - $ref: '#/components/schemas/RepeatableBlueprint'
          description: Repeat-instance metadata when the wizard field element or custom control declares IsRepeated.
      additionalProperties: false
    FieldValidationRule:
      required:
      - conditions
      - message
      type: object
      properties:
        message:
          allOf:
          - $ref: '#/components/schemas/LocalizedText'
          description: Localized message displayed to the user when validation fails
        conditions:
          allOf:
          - $ref: '#/components/schemas/ValidationConditionGroup'
          description: The validation conditions wrapper containing an optional booleanOperator and an array of individual
            conditions
          example:
            booleanOperator: and
            conditions:
            - type: numberComparisonCondition
              targetNodeId: Transaction.Payments[0].MonetaryAmounts["PaymentAmount"].CurrencyAmount
              value: 9999999999
              operator: lessThanOrEqual
            - type: numberComparisonCondition
              targetNodeId: Transaction.Payments[0].MonetaryAmounts["PaymentAmount"].CurrencyAmount
              value: 1
              operator: greaterThanOrEqual
      additionalProperties: false
      example:
        message:
          en: Please enter valid email address
        conditions:
          conditions:
          - type: matchesRegexCondition
            targetNodeId: Transaction.Beneficiaries[0].EmailAddresses["Home"].Address
            regex: ^\w+([-+.']\w+)*@\w+([-.]\w+)*\.\w+([-.]\w+)*$
    GetCommentsResponse:
      type: object
      properties:
        caseId:
          type: string
          description: Case identifier associated with the transaction
          nullable: true
        data:
