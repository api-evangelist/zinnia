    QuestionData:
      required:
      - id
      - type
      - value
      type: object
      properties:
        id:
          minLength: 1
          type: string
          description: Must match the field key under `data` for this row (case-insensitive); inside collection rows, must
            match the leaf key in the item's `data` map.
        type:
          minLength: 1
          enum:
          - input
          - dropdown
          - radio
          - checkbox
          - checkboxgroup
          - date
          - phone
          - email
          - money
          - number
          - label
          - information
          - collection
          - Person
          - Address
          - Hidden
          type: string
          description: 'Data-storage type for the question row. Must match the corresponding blueprint field type and be one
            of: input, dropdown, radio, checkbox, checkboxgroup, date, phone, email, money, number, label, information, collection,
            Person, Address, Hidden. Values are case-sensitive.'
          example: input
        questionText:
          type: string
          description: The title of the question shown to the user. This value should be kept in sync with the title property
            of the associated field
          nullable: true
        questionSubText:
          type: string
          description: The subtext shown to the user below the question title. This value should be kept in sync with the
            text property of the associated field
          nullable: true
        displayValue:
          type: string
          description: The display text representing the user's selected answer. For example, a country dropdown may display
            'United States of America' to the user, while the blueprint stores the value as 'USA'
          nullable: true
        value:
          anyOf:
          - type: string
            description: String value for simple fields
            example: PrimaryBeneficiary
          - type: integer
            description: Integer value for numeric fields
            example: 123
          - type: number
            description: Float value for decimal fields
            format: float
            example: 123.45
          - type: string
            description: Date value for date fields (YYYY-MM-DD format)
            format: date
            example: '2024-01-15'
          - type: string
            description: DateTime value for date-time fields (ISO 8601 format)
            format: date-time
            example: '2024-01-15T10:30:00Z'
          - type: boolean
            description: Boolean value for true/false fields
            example: true
          - type: array
            items:
              type: string
              example: Income_Replacement
            description: Array of selected option codes for checkboxgroup fields
          - type: array
            items:
              required:
              - surrogateId
              - type
              - data
              type: object
              properties:
                surrogateId:
                  type: string
                  description: 'The surrogate identifier for each set of answers in a collection. Example: a repeatable beneficiary
                    collection with two beneficiaries will have two surrogate IDs.'
                  example: 504490-1
                type:
                  enum:
                  - collectionItem
                  type: string
                  description: Must be `collectionItem` for each element of a collection value array.
                  example: collectionItem
                data:
                  type: object
                  additionalProperties:
                    required:
                    - id
                    - type
                    - value
                    type: object
                    properties:
                      id:
                        type: string
                        description: Must match the leaf property name under this collection item's `data` object (case-insensitive).
                        example: 504490_FirstName
                      type:
                        enum:
                        - input
                        - dropdown
                        - radio
                        - checkbox
                        - checkboxgroup
                        - date
                        - phone
                        - email
                        - money
                        - number
                        - label
                        - information
                        - collection
                        - Person
                        - Address
                        - Hidden
                        type: string
                        description: 'Data-storage type for the question row. Must match the corresponding blueprint field
                          type and be one of: input, dropdown, radio, checkbox, checkboxgroup, date, phone, email, money,
                          number, label, information, collection, Person, Address, Hidden. Values are case-sensitive.'
                        example: input
                      questionText:
                        type: string
                        description: The title of the question shown to the user. This value should be kept in sync with the
                          title property of the associated field
                        example: First Name
                      questionSubText:
                        type: string
                        description: The subtext shown to the user below the question title. This value should be kept in
                          sync with the text property of the associated field
                        example: ''
                      displayValue:
                        type: string
                        description: The display text representing the user's selected answer. For example, a country dropdown
                          may display 'United States of America' to the user, while the blueprint stores the value as 'USA'
                        example: ''
                      value:
                        anyOf:
                        - type: string
                          description: String value for simple fields
                          example: ''
                        - type: integer
                          description: Integer value for numeric fields
                          example: 123
                        - type: number
                          description: Float value for decimal fields
                          example: 123.45
                        - type: string
                          description: Date value for date fields (YYYY-MM-DD format)
                          format: date
                          example: '2024-01-15'
                        - type: string
                          description: DateTime value for date-time fields (ISO 8601 format)
                          format: date-time
                          example: '2024-01-15T10:30:00.000Z'
                        - type: boolean
                          description: Boolean value for true/false fields
                          example: true
                        description: The actual value of the question (required on each nested question row; JSON null allowed
                          when applicable).
                  description: Dictionary containing question data for this collection item
            description: Array of CollectionItem for collection type fields
          description: The actual value of the question (required on each QuestionData row in `data`; JSON null is allowed
            for an empty optional answer). Can be a string, integer, number, float, date, date-time, boolean, or array of
            CollectionItem objects depending on the field type.
        index:
          type: integer
          description: Zero-based row index for repeatable collection rows in transaction data lists; 0 for single-value fields.
          format: int32
        prefilled:
          type: boolean
          description: True when value is a prefill; omitted in JSON when false.
      additionalProperties: false
      description: One row of captured or echoed answer data. Must include id, type, and value (the JSON property `value`
        must be present on each row; use JSON null for an empty optional answer when applicable). On PUT, `id` must match
        the enclosing `data` field key (or the leaf key inside a collection item's `data`). `type` must be a QuestionData
        storage type (see QuestionDataStorageTypes); collection value rows use `collectionItem` on each CollectionItem.
    QuestionDataRows:
      title: QuestionDataRows
      type: array
      items:
        $ref: '#/components/schemas/QuestionData'
      description: All answer rows for one question or composite collection field id. Use `index` on each row for repeatable
        collection instances. Each row must include `id`, `type`, and `value` (see QuestionData schema).
    RenderCondition:
      required:
      - type
      - targetNodeId
      type: object
      properties:
        type:
          enum:
          - equality
          - range
          - presence
          type: string
          description: Kind of comparison performed by the condition.
          example: equality
        isEqual:
          type: boolean
          description: When true the condition passes if the target value equals 'value'; when false the condition passes
            if it differs.
          example: true
        value:
          type: string
          description: The value to compare against the resolved target answer.
          example: NY
        targetNodeId:
          type: string
          description: The answer node identifier whose value is evaluated by this condition.
          example: SolicitationStateCode
      description: Single condition controlling whether a field/section is rendered.
    RepeatableBlueprint:
      type: object
      properties:
        repeatableAnswerNodeId:
          type: string
          description: Blueprint id this repeat block is bound to (matches SubsectionBlueprint.id or FieldGroupBlueprint.id).
          nullable: true
        addButtonText:
          allOf:
          - $ref: '#/components/schemas/LocalizedText'
          description: Localized label for the control that adds another row.
        removeButtonText:
          allOf:
          - $ref: '#/components/schemas/LocalizedText'
          description: Localized label for removing a row.
        minRepeatable:
          type: integer
          description: Minimum number of instances.
          format: int32
        maxRepeatable:
          type: integer
          description: Maximum number of instances.
          format: int32
        outputPath:
          type: string
          description: Optional binding path for persisted repeat instances.
          nullable: true
      additionalProperties: false
    RequiredDocument:
      type: object
      properties:
        attachmentType:
          type: string
          description: Attachment type code
          nullable: true
        displayName:
          type: string
          description: Display name shown to the user
          nullable: true
        documentType:
          type: string
          description: Document type code
          nullable: true
        formType:
          type: string
          description: Form type code
          nullable: true
        message:
          type: string
          description: Instructional message for the required document
          nullable: true
      additionalProperties: false
    RetriggerEsignatureEmailNotificationRequest:
      required:
      - transactionId
      type: object
      properties:
        transactionId:
          minLength: 1
          type: string
          description: String form of the transaction (case) id; must be a positive integer.
      additionalProperties: false
      example:
        transactionId: '1131068'
    RetriggerEsignatureEmailNotificationResponse:
      type: object
      properties:
        success:
          type: boolean
          description: True when the signing notification was retriggered (e-sign in progress upstream).
        message:
          type: string
          description: User-safe message; e.g. notification successfully triggered when success is true.
          nullable: true
      additionalProperties: false
      example:
        success: true
        message: Notification successfully triggered.
    ReviewerActionRequest:
      required:
      - action
      - transactionId
      type: object
      properties:
        action:
          minLength: 1
          type: string
          description: 'Review outcome: Approved, Declined, or Terminate.'
        transactionId:
          maximum: 2147483647
          minimum: 1
          type: integer
          description: Order-entry transaction (instance) identifier.
          format: int32
      additionalProperties: false
    ReviewerActionResponse:
      type: object
      properties:
        caseId:
          type: integer
          description: Case identifier returned by the upstream service when available.
          format: int64
          nullable: true
        isSuccess:
          type: boolean
          description: True when the reviewer action completed successfully.
        message:
          type: string
          description: Human-readable outcome message.
          nullable: true
        status:
          type: string
          description: High-level status string returned to the client.
          nullable: true
      additionalProperties: false
    SaveCommentRequest:
      required:
      - commentText
      - transactionId
      type: object
      properties:
        appSubIndicator:
          type: string
          description: Indicator identifying whether the comment applies to the application or sub-application
          nullable: true
        commentSource:
          type: string
          description: Source system or user group that authored the comment
          nullable: true
        commentText:
          minLength: 1
          type: string
          description: Free-form comment text
        statusAtStep:
          type: string
          description: Status code of the transaction at the step the comment was added
          nullable: true
        statusDisplayName:
          type: string
          description: Display name for the status at the step the comment was added
          nullable: true
        stepTitle:
          type: string
          description: Title of the wizard step the comment was added on
          nullable: true
        transactionId:
          minLength: 1
          pattern: ^[1-9][0-9]*$
          type: string
          description: Unique identifier of the transaction the comment belongs to (positive integer encoded as a string)
      additionalProperties: false
      example:
        appSubIndicator: App
        commentSource: OrderEntryUI
        commentText: Customer requested a follow-up call before submission.
        statusAtStep: InProgress
        statusDisplayName: In Progress
        stepTitle: Owner Information
        transactionId: '1125715'
    SaveCommentResponse:
      type: object
      properties:
        caseId:
          type: string
          description: Case identifier associated with the transaction. Populated on successful saves.
          nullable: true
        isSuccess:
          type: boolean
          description: Indicates whether the operation was successful
        message:
          type: string
          description: Human-readable message describing the result
          nullable: true
        status:
          type: string
          description: Status code of the operation (e.g., "Success", "ValidationError", "Failure")
          nullable: true
      additionalProperties: false
      example:
        caseId: CA0000188538
        isSuccess: true
        message: Comment saved successfully.
        status: Success
    SaveEsignatureRequest:
      required:
      - signers
      type: object
      properties:
        transactionId:
          minimum: 1
          type: integer
          description: Transaction (case) identifier to submit for e-signature.
          format: int64
        signers:
          minItems: 1
          type: array
          items:
            $ref: '#/components/schemas/SaveEsignatureSignerRequest'
          description: Final signer roster with selected auth method and contact details.
      additionalProperties: false
      example:
        transactionId: 1131068
        signers:
        - recipientId: '11306862'
          signerAccessCode: ''
          signerAuthMethod: Phone
          signerCountryCode: '1'
          signerEmail: anannya.gupta@everglades.com
          signerEntityRole: PrimaryOwner
          signerName: EE EE1
          signerPhoneNo: '8650827071'
          signerSequence: '1'
        - recipientId: '11306935'
          signerAccessCode: ''
          signerAuthMethod: Phone
          signerCountryCode: '1'
          signerEmail: ''
          signerEntityRole: AgentOfRecord
          signerName: RR RR
          signerPhoneNo: '8650827071'
          signerSequence: '2'
    SaveEsignatureResponse:
      type: object
      properties:
        success:
          type: boolean
          description: True when the case was submitted to DocuSign for e-signature.
        message:
          type: string
          description: User-safe confirmation or failure text from the submission result.
          nullable: true
      additionalProperties: false
      example:
        success: true
        message: Case submitted for e-signature successfully.
    SaveEsignatureSignerRequest:
      type: object
      properties:
        recipientId:
          type: string
          description: DocuSign recipient ID from GET signers (required for submission).
          nullable: true
        signerAccessCode:
          type: string
          description: Access code when required; empty string when none.
          nullable: true
        signerAuthMethod:
          type: string
          description: Selected auth method for submission (for example Phone).
          nullable: true
        signerCountryCode:
          type: string
          description: Country calling code (default 1 for US).
          nullable: true
        signerEmail:
          type: string
          description: Signer email; may be empty for some roles.
          nullable: true
        signerEntityRole:
          type: string
          description: Entity role (for example PrimaryOwner, AgentOfRecord).
          nullable: true
        signerName:
          type: string
          description: Display name sent to DocuSign for this recipient.
          nullable: true
        signerPhoneNo:
          type: string
          description: Phone digits only; stored without dashes.
          nullable: true
        signerSequence:
          type: string
          description: Signing order when routing is sequential.
          nullable: true
      additionalProperties: false
    SectionBlueprint:
      required:
