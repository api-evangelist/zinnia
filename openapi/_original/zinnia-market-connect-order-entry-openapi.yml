  /market-connect/order-entry/v1/transaction:
    post:
      tags:
      - Transaction
      summary: Create the Order Entry transaction. Routes to appropriate service based on CUSIP.
      description: "#### Error Responses\n\n- **400 Bad Request**\n    \n- ```VALIDATION_ERROR``` - Input validation failed\
        \ (ModelState errors).\n- ```INVALID``` - Invalid input parameters.\n\n- **401 Unauthorized**\n    \n- ```UNAUTHORIZED```\
        \ - Authentication failed or token is invalid.\n\n- **403 Forbidden**\n    \n- ```FORBIDDEN``` - User does not have\
        \ permission to create transactions.\n\n- **429 Too Many Requests**\n    \n- ```RATE_LIMIT_EXCEEDED``` - The client\
        \ has exceeded the permitted request rate or quota.\n\n- **500 Internal Server Error**\n    \n- ```TRANSACTION_CREATION_FAILED```\
        \ - Transaction creation failed at service level.\n- ```TRANSACTION_ID_NOT_FOUND``` - Service did not return a transaction\
        \ ID.\n- ```FIRST_STEP_SETUP_FAILED``` - First step initialization failed (breadcrumb, payload creation, or save).\n\
        - ```JSON_PARSE_ERROR``` - Failed to parse service response.\n- ```BUILD_BLUEPRINT_ERROR``` - Error building blueprint\
        \ after creation.\n- ```UNEXPECTED_ERROR``` - Unexpected system error.\n\n- **502 Bad Gateway**\n    \n- ```UPSTREAM_SERVICE_ERROR```\
        \ - An upstream dependency returned an invalid or unsuccessful response.\n\n- **503 Service Unavailable**\n    \n\
        - ```SERVICE_UNAVAILABLE``` - The service or a required dependency is temporarily unavailable.\n\n- **504 Gateway\
        \ Timeout**\n    \n- ```UPSTREAM_TIMEOUT``` - A required downstream service did not respond within the configured\
        \ timeout.\n\n#### Standard Error Response\n\nAll error responses conform to the standard ```ErrorResponse``` schema\
        \ and include:\n\n- A stable error code from ```ErrorInfo.code```.\n- A human-readable error message.\n- Optional\
        \ diagnostic details, when applicable.\n- A timestamp indicating when the error occurred.\nThis consistent format\
        \ enables clients to implement standardized error processing, logging, and troubleshooting across all Order Entry\
        \ API endpoints.\n\n#### Success Response\n\nOn success, returns a TransactionResponse with:\n\n- **TransactionId**:\
        \ The newly created transaction ID\n- **CaseId**: The case identifier returned by the upstream product service (may\
        \ be null until the case is fully created)\n- **Data**: Initial transaction field data keyed by question ID\n- **Blueprint**:\
        \ Complete section and field definitions for the new transaction\n- **Subscribers**: Reactive subscriber definitions\
        \ consumed by the UI to drive dependent dataset lookups\n- **Errors**: Empty array on success (or absent)\n#### Input\
        \ Validation\n\nThe following fields are validated:\n\n- **State**: Required two-letter uppercase code from the documented\
        \ US state, territory, and military mail code enum\n- **CUSIP**: Required configured product identifier containing\
        \ exactly nine uppercase alphanumeric characters; pattern ```^[0-9A-Z]{9}$```\n- **OpportunityId**: Optional UUID\
        \ used to associate the transaction with a sales opportunity\n#### Service Routing\n\nThe API automatically routes\
        \ to the appropriate service based on CUSIP:\n\n- **Annuity Service**: Configured Annuity CUSIPs\n- **Life Service**:\
        \ Configured Life CUSIPs\n#### Transaction Creation Flow\n\nThe transaction creation process includes:\n\n- Validate\
        \ input parameters\n- Determine service routing based on CUSIP\n- Create transaction via appropriate service (Life\
        \ or Annuity)\n- Get breadcrumb to determine first step\n- Retrieve order entry values for first step\n- Create and\
        \ save first step payload\n- Build complete blueprint for the transaction\n#### First Step Setup Failures\n\nThe ```FIRST_STEP_SETUP_FAILED```\
        \ error can occur when:\n\n- No breadcrumb steps are found\n- First step name is null or empty\n- Order entry values\
        \ are null or empty\n- First step payload creation fails\n- First step data save operation fails\n- First step save\
        \ response indicates failure"
      operationId: createTransaction
      requestBody:
        description: The input data for creating a new transaction
        content:
          application/json:
            schema:
              required:
              - state
              - cusip
              allOf:
              - $ref: '#/components/schemas/CreateTransactionRequest'
            examples:
              minimal:
                summary: Minimal — state and cusip only
                value:
                  state: NC
