        - recipientId: '11306862'
          signerEmail: corrected.email@everglades.com
          signerSequence: '1'
          signerAuthMethod: Phone
          signerCountryCode: '1'
          signerPhoneNo: '8650827071'
    UpdateEsignSignerDetailsResponse:
      type: object
      properties:
        success:
          type: boolean
          description: True when signer contact details were updated (e-sign must be pending upstream).
        message:
          type: string
          description: User-safe message confirming the update or describing a failure.
          nullable: true
      additionalProperties: false
      example:
        success: true
        message: Signer contact details updated successfully.
    UpdateEsignSignerRequest:
      type: object
      properties:
        recipientId:
          type: string
          description: DocuSign recipient ID from GET signers or signer status.
          nullable: true
        signerEmail:
          type: string
          description: Corrected signer email address.
          nullable: true
        signerSequence:
          type: string
          description: Signing order when routing is sequential.
          nullable: true
        signerAuthMethod:
          type: string
          description: Auth method for the signer (for example Phone or SMS).
          nullable: true
        signerCountryCode:
          type: string
          description: Country calling code (default 1 for US).
          nullable: true
        signerPhoneNo:
          type: string
          description: Corrected phone digits only; stored without dashes.
          nullable: true
      additionalProperties: false
    UpdateTransactionRequest:
      $ref: '#/components/schemas/TransactionDataQuestionRowsMap'
    ValidationCondition:
      required:
      - type
      - targetNodeId
      type: object
      properties:
        type:
          enum:
          - matchesRegexCondition
          - numberComparisonCondition
          - characterCountInBetween
          type: string
          description: The kind of validation this condition performs.
          example: matchesRegexCondition
        targetNodeId:
          type: string
          description: The answer node identifier this condition evaluates.
          example: Transaction.Beneficiaries[0].EmailAddresses["Home"].Address
        regex:
          type: string
          description: Regex pattern. Only used when `type` is `matchesRegexCondition`.
          nullable: true
          example: ^\w+([-+.']\w+)*@\w+([-.]\w+)*\.\w+([-.]\w+)*$
        operator:
          enum:
          - lessThan
          - lessThanOrEqual
          - greaterThan
          - greaterThanOrEqual
          - equal
          - notEqual
          type: string
          description: Comparison operator. Only used when `type` is `numberComparisonCondition`.
          nullable: true
          example: lessThanOrEqual
        value:
          anyOf:
          - type: number
            example: 9999999999
          - type: integer
            example: 1
          - type: object
            properties:
              minLength:
                type: integer
                example: 0
              maxLength:
                type: integer
                example: 128
          description: Condition-specific value. Number for `numberComparisonCondition`; object `{ minLength, maxLength }`
            for `characterCountInBetween`. Absent for `matchesRegexCondition`.
      description: 'Single validation condition inside a FieldValidationRule. The shape varies by `type`: `matchesRegexCondition`
        uses `regex`; `numberComparisonCondition` uses `value` + `operator`; `characterCountInBetween` uses `value: { minLength,
        maxLength }`.'
    ValidationConditionGroup:
      type: object
      properties:
        booleanOperator:
          type: string
          description: The boolean operator used to combine multiple conditions (e.g., "and"). Omitted when there is only
            one condition.
          nullable: true
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/ValidationCondition'
          description: Array of validation conditions with varying structures per condition type
          nullable: true
      additionalProperties: false
      example:
        booleanOperator: and
        conditions:
        - type: numberComparisonCondition
          targetNodeId: Transaction.Payments[0].MonetaryAmounts["PaymentAmount"].CurrencyAmount
          value: 9999999999
          operator: lessThanOrEqual
        - type: numberComparisonCondition
          targetNodeId: Transaction.Payments[0].MonetaryAmounts["PaymentAmount"].CurrencyAmount
          value: 1
          operator: greaterThanOrEqual
    ValidationErrors:
      type: object
      properties:
        fieldId:
          type: string
          description: ControlID as a string (numeric ids appear quoted). Omitted when fieldId is 0.
          nullable: true
        answerNodeId:
          type: string
          description: Answer node path from annuity NamedItem; matches FieldBlueprint.AnswerNodeId.
          nullable: true
        message:
          type: string
          description: The validation error message
          nullable: true
        sectionName:
          type: string
          description: The section/step name where the error occurred
          nullable: true
      additionalProperties: false
      description: One validation message in API shape. Optional properties are omitted in JSON when null (e.g. fieldId is
        missing or 0).
      example:
        fieldId: BeneficiaryAddress
        answerNodeId: Transaction.PrimaryOwner.PersonName.Prefix
        message: First name is required
        sectionName: EntityOwners
    VisibilityCondition:
      required:
      - type
      - targetNodeId
      type: object
      properties:
        type:
          enum:
          - equality
          - range
          - presence
          type: string
          description: Kind of comparison performed by the condition.
          example: equality
        isEqual:
          type: boolean
          description: When true the condition passes if the target value equals 'value'; when false the condition passes
            if it differs.
          example: true
        value:
          type: string
          description: The value to compare against the resolved target answer.
          example: NY
        targetNodeId:
          type: string
          description: The answer node identifier whose value is evaluated by this condition.
          example: SolicitationStateCode
      description: Single condition controlling whether a field/section is visible at runtime.
    VisibilitySettings:
      type: object
      properties:
        booleanOperator:
          type: string
          description: The boolean operator for combining conditions
          nullable: true
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/VisibilityCondition'
          description: Array of visibility conditions with varying structures per condition type
          nullable: true
      additionalProperties: false
      example:
        booleanOperator: AND
        conditions:
        - type: equality
          isEqual: true
          value: 'Yes'
          targetNodeId: Transaction.SolicitationState
