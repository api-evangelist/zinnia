    DatasetRequest:
      required:
      - fieldId
      - stepName
      - transactionId
      type: object
      properties:
        transactionId:
          minLength: 1
          type: string
          description: Unique identifier of the transaction (positive integer as a string).
        stepName:
          minLength: 1
          type: string
          description: Name of the wizard step containing the dependent control.
        fieldId:
          minLength: 1
          type: string
          description: Identifier of the field (control) whose dataset is being requested.
      additionalProperties: {}
    DatasetResponse:
      required:
      - Message
      - Status
      type: object
      properties:
        Status:
          minLength: 1
          type: string
          description: Outcome of the dataset lookup. "Success" on success; otherwise the backend exception type name (e.g.
            "NullReferenceException", "ItemNotFoundException`2").
        Message:
          minLength: 1
          type: string
          description: Human-readable message describing the outcome. On success a confirmation string; on failure the backend
            error message.
        Data:
          type: string
          description: Dataset payload serialized as a JSON string. On success, a JSON array of {Name, Value} option objects.
            On failure, may be "[]" or omitted.
          nullable: true
        InstanceId:
          type: integer
          description: Identifier of the dataset instance returned by the upstream service. Present for success and most failures;
            absent for low-level exceptions.
          format: int64
          nullable: true
      additionalProperties: false
    DeleteCommentRequest:
