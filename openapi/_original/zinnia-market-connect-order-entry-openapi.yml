        message:
          type: string
          description: Human-readable message describing the result
          nullable: true
        status:
          type: string
          description: Status code of the operation (e.g., "Success", "ValidationError", "Failure")
          nullable: true
      additionalProperties: false
      example:
        caseId: CA0000188538
        isSuccess: true
        message: Comment deleted successfully
        status: Success
    DocumentRule:
      type: object
      properties:
        conditions:
          type: string
          description: Conditions under which the rule applies
