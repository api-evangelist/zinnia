        - A human-readable error message.

        - Optional diagnostic details, when applicable.

        - A timestamp indicating when the error occurred.

        This consistent format enables clients to implement standardized error processing, logging, and troubleshooting across all Order Entry API endpoints.'
      operationId: deleteComment
      requestBody:
        description: The comment and transaction identifiers for the comment to delete.
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/DeleteCommentRequest'
              example:
                commentId: '54321'
                transactionId: '1125715'
        required: true
      responses:
        '200':
          description: Returns the delete comment envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteCommentResponse'
        '400':
          description: '`VALIDATION_ERROR` - The request failed input validation.


