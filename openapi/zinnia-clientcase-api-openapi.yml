openapi: 3.2.0
info:
  title: Zinnia Illustration Client Cases Client Case API
  description: Zinnia Illustration Client Cases Api - OpenAPI 3.0 spec
  version: v1
servers:
- url: https://uat.api.zinnia.io
  description: Main server address for this environment
tags:
- name: ClientCase
paths:
  /client-case-manager/v1/client-case/{caseId}:
    get:
      tags:
      - ClientCase
      summary: Get a single client case with the specified id
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Client case found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientCaseDto'
        '404':
          description: Client case does not exist
      security:
      - Auth0: []
      operationId: getClientCaseManagerV1ClientCaseByCaseId
      x-operation-id-source: derived
    patch:
      tags:
      - ClientCase
      summary: Update an existing client case
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientCaseUpdateInputDto'
          text/json:
            schema:
              $ref: '#/components/schemas/ClientCaseUpdateInputDto'
          application/*+json:
            schema:
              $ref: '#/components/schemas/ClientCaseUpdateInputDto'
      responses:
        '200':
          description: Client case updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientCaseDto'
        '400':
          description: Client case has already been submitted and can't be modified or invalid client case data in request body
        '404':
          description: Client case does not exist
      security:
      - Auth0: []
      operationId: patchClientCaseManagerV1ClientCaseByCaseId
      x-operation-id-source: derived
  /client-case-manager/v1/client-case:
    post:
      tags:
      - ClientCase
      summary: Create a new client case
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientCaseCreationInputDto'
          text/json:
            schema:
              $ref: '#/components/schemas/ClientCaseCreationInputDto'
          application/*+json:
            schema:
              $ref: '#/components/schemas/ClientCaseCreationInputDto'
      responses:
        '201':
          description: Client case created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientCaseDto'
        '400':
          description: Invalid client case data in request body
      security:
      - Auth0: []
      operationId: postClientCaseManagerV1ClientCase
      x-operation-id-source: derived
  /client-case-manager/v1/client-case/search:
    get:
      tags:
      - ClientCase
      summary: Search for client cases
      description: Search for client cases using query parameters as filters. Returns all client cases accessible by the logged user that match all filters specified. If no filters are specified returns all client cases accessible by the logged user
      parameters:
      - name: title
        in: query
        schema:
          type: string
      - name: agentFirstName
        in: query
        schema:
          type: string
      - name: agentLastName
        in: query
        schema:
          type: string
      - name: insuredFirstName
        in: query
        schema:
          type: string
      - name: insuredLastName
        in: query
        schema:
          type: string
      - name: eAppId
        in: query
        schema:
          type: string
      - name: caseManagementCaseId
        in: query
        schema:
          type: string
      - name: creatorName
        in: query
        schema:
          type: string
      - name: offset
        in: query
        schema:
          maximum: 2147483647
          minimum: 0
          type: integer
          format: int32
          default: 0
      - name: limit
        in: query
        schema:
          maximum: 100
          minimum: 1
          type: integer
          format: int32
          default: 50
      - name: sortBy
        in: query
        schema:
          $ref: '#/components/schemas/ClientCaseSortField'
      - name: sortDir
        in: query
        schema:
          $ref: '#/components/schemas/SortDirection'
      responses:
        '200':
          description: Search executed successfully. List of client case summaries is returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientCaseSummaryDtoResultsPage'
      security:
      - Auth0: []
      operationId: getClientCaseManagerV1ClientCaseSearch
      x-operation-id-source: derived
  /client-case-manager/v1/client-case/{caseId}/illustrations:
    post:
      tags:
      - ClientCase
      summary: Add an illustration to an existing client case
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IllustrationCreationInputDto'
          text/json:
            schema:
              $ref: '#/components/schemas/IllustrationCreationInputDto'
          application/*+json:
            schema:
              $ref: '#/components/schemas/IllustrationCreationInputDto'
      responses:
        '200':
          description: Illustration added successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientCaseDto'
        '400':
          description: Illustration already exists in the client case or the client case already has the maximum number of illustrations
        '404':
          description: Client case does not exist
      security:
      - Auth0: []
      operationId: postClientCaseManagerV1ClientCaseByCaseIdIllustrations
      x-operation-id-source: derived
  /client-case-manager/v1/client-case/{caseId}/illustrations/{illustrationId}:
    delete:
      tags:
      - ClientCase
      summary: Remove an illustration from an existing client case
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: illustrationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Illustration removed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientCaseDto'
        '400':
          description: Client case has already been submitted and can't be modified.
        '404':
          description: Client case does not exist or illustration doesn't exist in the client case
      security:
      - Auth0: []
      operationId: deleteClientCaseManagerV1ClientCaseByCaseIdIllustrationsByIllustrationId
      x-operation-id-source: derived
    patch:
      tags:
      - ClientCase
      summary: Update an existing illustration from an existing client case
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: illustrationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IllustrationCreationInputDto'
          text/json:
            schema:
              $ref: '#/components/schemas/IllustrationCreationInputDto'
          application/*+json:
            schema:
              $ref: '#/components/schemas/IllustrationCreationInputDto'
      responses:
        '200':
          description: Illustration removed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientCaseDto'
        '400':
          description: Client case has already been submitted and can't be modified or illustration already exists in the client case.
        '404':
          description: Client case does not exist or illustration doesn't exist in the client case
      security:
      - Auth0: []
      operationId: patchClientCaseManagerV1ClientCaseByCaseIdIllustrationsByIllustrationId
      x-operation-id-source: derived
  /client-case-manager/v1/client-case/{caseId}/illustrations/{illustrationId}/archive:
    patch:
      tags:
      - ClientCase
      summary: Archive an existing illustration
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: illustrationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Illustration archived successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientCaseDto'
        '400':
          description: Client case has already been submitted and can't be modified or illustration isn't active.
        '404':
          description: Client case does not exist or illustration doesn't exist in the client case
      security:
      - Auth0: []
      operationId: patchClientCaseManagerV1ClientCaseByCaseIdIllustrationsByIllustrationIdArchive
      x-operation-id-source: derived
  /client-case-manager/v1/client-case/{caseId}/illustrations/{illustrationId}/reactivate:
    patch:
      tags:
      - ClientCase
      summary: Reactivates a previously archived illustration
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: illustrationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Illustration reactivated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientCaseDto'
        '400':
          description: Client case has already been submitted and can't be modified or illustration isn't archived.
        '404':
          description: Client case does not exist or illustration doesn't exist in the client case
      security:
      - Auth0: []
      operationId: patchClientCaseManagerV1ClientCaseByCaseIdIllustrationsByIllustrationIdReactivate
      x-operation-id-source: derived
  /client-case-manager/v1/client-case/{caseId}/illustrations/{illustrationId}/submit:
    patch:
      tags:
      - ClientCase
      summary: Selects an illustration from an existing client case
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: illustrationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Illustration selected successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientCaseDto'
        '400':
          description: Client case has already been submitted and can't be modified or illustration isn't active.
        '404':
          description: Client case does not exist or illustration doesn't exist in the client case
      deprecated: true
      security:
      - Auth0: []
      operationId: patchClientCaseManagerV1ClientCaseByCaseIdIllustrationsByIllustrationIdSubmit
      x-operation-id-source: derived
  /client-case-manager/v1/client-case/{caseId}/illustrations/{illustrationId}/select:
    patch:
      tags:
      - ClientCase
      summary: Selects an illustration from an existing client case
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: illustrationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Illustration selected successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientCaseDto'
        '400':
          description: Client case has already been submitted and can't be modified or illustration isn't active.
        '404':
          description: Client case does not exist or illustration doesn't exist in the client case
      security:
      - Auth0: []
      operationId: patchClientCaseManagerV1ClientCaseByCaseIdIllustrationsByIllustrationIdSelect
      x-operation-id-source: derived
components:
