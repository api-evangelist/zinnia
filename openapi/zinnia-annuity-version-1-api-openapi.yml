          description: Distributor assigned Id for an agent, used as Agent Identifier.
        carrierAgentAssignedId:
          type: string
          example: when party is an agent and one of the agent specific identifier in MCS is mandatory
          description: Internal identifier assigned to the agent by carrier, used as Agent Identifier.
        externalId:
          type: string
          example: when party is an agent and one of the agent specific identifier in MCS is mandatory
