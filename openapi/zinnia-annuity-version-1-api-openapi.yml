    InitialPurchases:
      type: object
      required:
      - grossAmount
      - netAmount
      - payments
      properties:
        grossAmount:
          format: double
          type: number
          description: Total Gross Amount
          example: 238500
        netAmount:
          format: double
          type: number
          description: Total Net Amount
          example: 0
        payments:
          type: array
          items:
            $ref: '#/components/schemas/Payments'
    DocumentInformation:
      type: object
      required:
      - appId
      - version
      - effectiveDate
      - totalDocumentCount
      - documentDetails
      properties:
        appId:
          type: string
          description: Unique Identifier against an e-App application. First 4 letters represent the receiving company, next 3 letters represent the firm, next 8 positions represent the date eApp is submitted, next 10 positions represents the sequential number of the eApps from the eApp instance. For Orion - Accept integers upto 15 digits
          example: XXXXEDJ041120240000000001
        version:
          type: string
          description: Version for that case - 3 digits, incremental if same case if submitted more than once in case of errors. For Orion - Accept integers upto 15 digits
          example: '000'
        effectiveDate:
          type: string
          format: date
          pattern: ([0-9]{4})-([0-9]{2})-([0-9]{2})
          description: e-App submitted date to Zinnia (with pattern "yyyy-mm-dd").
          example: '2023-12-19'
        totalDocumentCount:
          type: number
          example: 1
        documentDetails:
          type: array
          items:
            $ref: '#/components/schemas/DocumentDetail'
    BankInfo:
      type: object
      required:
