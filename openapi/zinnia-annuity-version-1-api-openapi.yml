    Withholdings:
      type: object
      required:
      - withholdingAmount
      - withholdingAmountQualifer
      - withholdingAuthority
      properties:
        withholdingAmount:
          type: string
          description: The amount to be withheld if withholding is selected
          example: '0'
        withholdingAmountQualifer:
          type: string
          description: Qualifies the withholding amount. Either as dollars or a percentage
          enum:
          - D
          - P
        withholdingAmountType:
          type: string
          description: This will be used to indicate the type of withholding information for this instance of the Withholding Amount.  This is in reference to the IRS W-4P and W-4R tax withholding forms
          enum:
          - A
          - B
          - C
          - D
          - E
          - F
          - G
          - H
        withholdingAuthority:
          type: string
          description: Defines the withholding authority for which is being withheld
          enum:
          - State
          - Federal
