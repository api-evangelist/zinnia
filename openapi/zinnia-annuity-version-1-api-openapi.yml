          - '-90'
          - '-91'
          - '-999'
          description: Role type
          example: '0'
        roleOption:
          type: string
          description: Role Option associated with the respective Role Type
          enum:
          - '-6'
          - '-5'
          - '-1'
          - '0'
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'
          - '6'
          - '7'
        naturalNameIndicator:
          type: string
          enum:
          - Y
          - N
        nameType:
          type: string
          enum:
          - CO
          - IN
          - OT
          - TR
          - UG
        firstName:
          type: string
          description: First name of the party role
          example: firstName when name type is Natural/Individual
        middleName:
          type: string
          description: Moddle name of the party role
          example: B
        lastName:
          type: string
          description: Last name of the party role
          example: Doe
        prefix:
          type: string
          description: Prefix
          example: Dr
        suffix:
          type: string
          description: Suffix
          example: Sr
        dob:
          type: string
          format: date
          description: Date of birth of party role. Applicable in case of Individual. (with pattern "yyyy-mm-dd"). Regex Expression ^\d{4}-((0\d)|(1[012]))-(([012]\d)|3[01])$.
          example: '2023-12-19'
        sex:
          type: string
          enum:
          - M
          - F
          - O
          description: Any one of the possible value for the gender.
        taxId:
          type: string
          pattern: \d{9}
          description: 9 digit Social Security number
          example: '123456789'
          minLength: 9
          maxLength: 9
        crdNumber:
          type: string
          example: when party is an agent and one of the agent specific identifier in MCS is mandatory
          description: CRD number for the party role, used as Agent Identifier.
        nationalProducerNumber:
          type: string
          example: when party is an agent and one of the agent specific identifier in MCS is mandatory
          description: NPN number for the agent, used as Agent Identifier.
        distributorAgentAssignedId:
          type: string
