openapi: 3.2.0
info:
  title: Zinnia Policy Transactions API.
  description: 'Enterprise API for enforcing policy transactions and validations. This API provides a comprehensive interface for - Policy transaction validation and processing

    - Financial and non-financial transaction management

    - Policy party management and updates

    - Systematic program management

    **Version History** * Draft version 1.0.6

    - Added Two Endpoints- Reinstatement eligibility check api, Reinstatement actual transaction api

    * Draft Specifications (Subject to Change Upon Review)'
  version: 1.0.8
  x-changelog:
  - date: '2026-08-13'
    change: 'ZCLA-649 Initial death claim — aligned InitialDeathClaimRequest with the revised FNOL payload: added policy.isContestable/isFuneralHomeAssigned, deathDetails.causeOfDeath, COVEREDINSURED party role, deathNotification.partyRole enum; renamed documents[].edsDocumentId to documents[].documentId; removed parties[].isFuneralHomeAssigned (now policy-level only)'
  - date: '2026-08-13'
    change: 'ZCLA-649 Initial death claim — added deathNotification.partyId (now required, enforced via bean validation on submit) and deathNotification.partyRole to identify the deceased party, and a riderClaim[] array (DeathClaimRiderClaim: riderCode, riderName, riderElected, partyId)'
  - date: '2026-08-03'
    change: Initial death claim — added POST initialdeathclaim/eligibilitycheck (no request body; returns TransactionResponse)
  - date: '2026-08-03'
    change: Initial death claim submit — aligned InitialDeathClaimRequest with IdnClaimRequest (added documents/DeathClaimDocument, party isNotifier, expanded partyRole and relationshipToInsured enums); responses now use shared TransactionAcceptedResponse (202) and TransactionResponse (errors)
  - date: '2026-07-29'
    change: Billing feature change — eligibility and validation endpoints with BillingFeatureChangeRequest payload (policyFeatures, transactionReason, signatures, documents, selfServeFlow)
  - date: '2026-07-24'
    change: Partial withdrawal one-time — updated PartialWithdrawalOneTime payload (selfServeFlow; tax withholding top-level fields and w4r; removed authorization from request body)
  - date: '2026-05-26'
    change: Added POST initialdeathclaim endpoint with standalone Initial Death Claim schemas
  - date: '2026-05-11'
    change: Systematic program — extended SystematicProgramUpdate request (MFA, agent, policyHolder, tax, funds, feature product, submittedDate, currency, disbursementType); PaymentForm EFT; Frequency BIANNUAL/DEFAULT; optional pdfId on TransactionAcceptedResponse for systematic program submit 202
  - date: '2026-03-18'
    change: Active restrict — POST/GET /bpm/v1/policies/{planCode}/{policyNumber}/Restrict and policy API alias
  - date: '2025-07-17'
    change: CMW-29105 - Updated SystematicProgramUpdate Post to PUT
  - date: '2025-07-22'
    change: CMW-30437 - New End point for Systematic Programs Quote API
  - date: '2025-09-01'
    change: CMW-31343 - New End point for Reinstatement Quote API and Reinstatement Actual Transaction API
  - date: '2025-09-03'
    change: ZDR-3002 - Added One time premium 400 error example
servers:
- url: https://dev.api.zinnia.io
  description: DEV Environment
- url: https://qa.api.zinnia.io
  description: QA Environment
tags:
- name: Non Financial Transactions
  description: Non Financial Transactions
paths:
  /policy/v1/transactions/{planCode}/{policyNumber}/multi-agent/validation:
    post:
      x-kong-plugin-pre-function:
        config:
          access:
          - 'local path = kong.request.get_path()

            local new_path = path:gsub("^/policy/v1/transactions", "/bpm/v1/policies")

            kong.service.request.set_path(new_path)

            '
      tags:
      - Non Financial Transactions
      summary: Validation multi agent Transaction
      operationId: validationMultiAgentTransaction1
      parameters:
      - name: planCode
        in: path
        required: true
        schema:
          type: string
      - in: path
        name: policyNumber
        schema:
          type: string
        required: true
        description: Policy Number
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentChangeDto'
        required: true
      responses:
        '200':
          description: Multi Agent Change Success Response.yaml
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
              examples:
                success:
                  $ref: '#/components/examples/successTransactionResponse'
        '400':
          description: Multi Agent Change Failure Response.yaml
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
              examples:
                failure:
                  $ref: '#/components/examples/failureTransactionResponse'
        '500':
          description: Internal server error. Please check server logs for more details.
      security:
      - Auth0: []
  /policy/v1/transactions/{planCode}/{policyNumber}/Restrict:
    x-kong-plugin-pre-function:
      config:
        access:
        - 'local path = kong.request.get_path()

          local new_path = path:gsub("^/policy/v1/transactions", "/bpm/v1/policies")

          kong.service.request.set_path(new_path)

          '
    parameters:
    - name: planCode
      in: path
      required: true
      schema:
        type: string
      description: Plan code
      example: EVGFIA909
    - name: policyNumber
      in: path
      required: true
      schema:
        type: string
      description: Policy number
      example: EVFIA09222243202
    post:
      tags:
      - Non Financial Transactions
      summary: Submit active restrict transaction
      description: 'Submits restriction add/delete requests for a policy. Kong rewrites this path to the BPM service

        `/bpm/v1/policies/{planCode}/{policyNumber}/Restrict`.'
      operationId: submitActiveRestrictPolicyApi
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActiveRestrictTransactionRequest'
      responses:
        '202':
          description: Request accepted; transaction is being processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionAcceptedResponse'
        '400':
          description: Bad request or rules validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
        '500':
          description: Internal server error
      security:
      - Auth0: []
    get:
      tags:
      - Non Financial Transactions
      summary: Get restriction alerts for a policy
      description: 'Returns the restriction alert aggregate from TDS. When none exists, response body is `{}`.

        Kong rewrites this path to `/bpm/v1/policies/{planCode}/{policyNumber}/Restrict`.'
      operationId: getActiveRestrictAlertsPolicyApi
      responses:
        '200':
          description: Alert aggregate or empty object when no TDS record exists
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ActiveRestrictPolicyAlertDocument'
                - type: object
                  maxProperties: 0
                  description: No alert aggregate stored for this policy yet
        '500':
          description: Internal server error
      security:
      - Auth0: []
  /policy/v1/transactions/{planCode}/{policyNumber}/Restrict/alerts:
    x-kong-plugin-pre-function:
      config:
        access:
        - 'local path = kong.request.get_path()

          local new_path = path:gsub("^/policy/v1/transactions", "/bpm/v1/policies")

          kong.service.request.set_path(new_path)

          '
    parameters:
    - name: planCode
      in: path
      required: true
      schema:
        type: string
      description: Plan code
      example: EVGFIA909
    - name: policyNumber
      in: path
      required: true
      schema:
        type: string
      description: Policy number
      example: EVFIA09222243202
    get:
      tags:
      - Non Financial Transactions
      summary: Get restriction alerts for a policy
      description: 'Returns the restriction alert aggregate from TDS. When none exists, response body is `{}`.

        Kong rewrites this path to `/bpm/v1/policies/{planCode}/{policyNumber}/Restrict/alerts`.'
      operationId: getActiveRestrictAlertsV2PolicyApi
      responses:
        '200':
          description: Alert aggregate or empty object when no TDS record exists
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ActiveRestrictPolicyAlertDocument'
                - type: object
                  maxProperties: 0
                  description: No alert aggregate stored for this policy yet
        '500':
          description: Internal server error
      security:
      - Auth0: []
