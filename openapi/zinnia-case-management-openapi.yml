          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
components:
  schemas:
    ActivityFeedSearchRequest:
      type: object
      properties:
        filters:
          $ref: '#/components/schemas/ActivityFeedFilters'
        pagination:
          $ref: '#/components/schemas/ActivityFeedPagination'
        sort:
          $ref: '#/components/schemas/ActivityFeedSort'
    ActivityFeedFilters:
      type: object
      properties:
        entityType:
          type: string
          description: 'Type of entity to filter by (e.g. STAGE, STEP). When combined with includeHierarchicalEntities, feeds
            whose

            entity matches this type act as seeds; descendant feeds under those entities may be included.

            '
          example: STAGE
        entityIds:
          type: array
          description: 'Entity ids to match (e.g. stage or step id). When includeHierarchicalEntities is true, feeds under
            these

            entities in the case hierarchy may also be returned.

            '
          items:
            type: string
          example:
          - policyValidation
          - policyValidation.childStep
        instanceInfoIds:
          type: array
          description: 'Instance-info identifiers (e.g. from entityInstanceInfo on a step) used to narrow feeds; hierarchical
            rules

            apply when includeHierarchicalEntities is true.

            '
          items:
            type: string
          example:
          - inst-search-cuke-60
        includeHierarchicalEntities:
          type: boolean
          default: false
          description: 'When true, expands results to include descendant feeds in the activity hierarchy for the selected
            entity ids,

            entity type, or instance-info scope. When false, only directly matching feeds are considered before other filters.

            '
          example: true
        action:
          $ref: '#/components/schemas/ActivityFeedAction'
        startDate:
          type: string
          format: date-time
          description: Start date for filtering activity feed records
          example: '2025-12-29T00:00:00Z'
        endDate:
          type: string
          format: date-time
          description: End date for filtering activity feed records
          example: '2025-12-29T23:59:59Z'
    ActivityFeedPagination:
      type: object
      properties:
        pageSize:
          type: integer
          minimum: 1
          description: Number of records per page
          example: 10
        pageNumber:
          type: integer
          minimum: 1
          description: Page number to retrieve
          example: 1
    ActivityFeedSort:
      type: object
      properties:
        order:
          type: string
          enum:
          - asc
          - desc
          default: desc
          description: Sort order for activity feed records
          example: desc
    ActivityFeedSearchResponse:
      type: object
      properties:
        caseId:
          type: string
          description: Case ID for which activity feed was searched
          example: CA0000061736
        feeds:
          type: array
          items:
            $ref: '#/components/schemas/ActivityFeedRecord'
          default: []
        page:
          $ref: '#/components/schemas/ActivityFeedPageMetadata'
    ActivityFeedPageMetadata:
      type: object
      properties:
        pageSize:
          type: integer
          description: Number of records per page
          example: 10
        pageNumber:
          type: integer
          description: Current page number
          example: 1
        totalPages:
          type: integer
          description: Total number of pages
          example: 1
        totalRecords:
          type: integer
          format: int64
          description: Total number of records
          example: 3
    ActivityFeedRecord:
      type: object
      description: Activity feed row returned by search (entity, action, changes, time, source).
      properties:
        id:
          type: string
          description: Unique identifier for the activity feed record
          example: 9c0638a9-1bab-4553-8135-75a3cfd471b3
        entity:
          $ref: '#/components/schemas/ActivityFeedEntityRef'
        action:
          $ref: '#/components/schemas/ActivityFeedAction'
        changes:
          type: array
          items:
            $ref: '#/components/schemas/ActivityFeedChange'
        time:
          type: string
          format: date-time
          description: Timestamp when the activity occurred
          example: '2025-12-29T12:00:42Z'
        source:
          $ref: '#/components/schemas/ActivityFeedSource'
    ActivityFeedEntityRef:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/ActivityFeedEntityType'
        id:
          type: string
          description: ID of the entity
          example: policyValidation.childStep
        label:
          type: string
          description: Label of the entity
          example: Child Step
    ActivityFeedEntityType:
      type: string
      enum:
      - TASK
      - STAGE
      - STEP
      - CASE
      - EXCEPTION
      - DOCUMENT
      description: Type of entity in the activity feed
    ActivityFeedAction:
      type: string
      enum:
      - CREATED
      - STATUS_CHANGE
      - ASSIGNMENT
      - UNASSIGNMENT
      description: Type of action performed on the entity
    ActivityFeedChange:
      type: object
      properties:
        field:
          type: string
          description: Field that was changed
          example: status
        from:
          type: string
          description: Previous value of the field
          example: ''
        to:
          type: string
          description: New value of the field
          example: NEW
    ActivityFeedSource:
      type: object
      properties:
        type:
          type: string
          description: Type of source that performed the action
          example: API
        id:
          type: string
          description: ID of the source
          example: 7dfd65b3-4609-4fd9-a3f2-b6cbf9f4415f
        performedBy:
          type: string
          description: ID of the user who performed the action
          example: c6a7ab9f7dd84015a6552bfc5b366b77
    TaskSearchCriteria:
      type: object
      properties:
        policyNumber:
          type: string
          description: The policy number associated with the case.
          example: AU7654098
        applicationType:
          type: string
          description: The application type of the policy.
          example: Digital
        process:
          type: array
          description: A list of processes to filter the search results.
          items:
            type: string
          example:
          - New Business
    DashboardStatsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
                example: brokerDealerName
              name:
                type: string
                example: Example Broker
              count:
                type: integer
                example: 3990
              values:
                type: array
                items:
                  type: object
                  properties:
                    key:
                      type: string
                      example: process
                    name:
                      type: string
                      example: Process 1
                    count:
                      type: integer
                      example: 3990
                    values:
                      type: array
                      items:
                        type: object
                        properties:
                          key:
                            type: string
                            example: caseStatus
                          name:
                            type: string
                            example: EXCEPTION
                          count:
                            type: integer
                            example: 2396
        totalElements:
          type: integer
          example: 4856
    DashboardStatsRequest:
      type: object
      properties:
        filter:
          $ref: '#/components/schemas/DashboardSearchRequest'
        groupBy:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items:
            type: string
            enum:
            - brokerDealerName
            - carrier
            - caseStatus
            - processSubType
            - policyNumber
            - process
            - productName
            - expectionCategory
            - openStages
            - updatedAt
            - createdAt
    DashboardSearchRequest:
      type: object
      properties:
        policyNumber:
          type: string
          description: The policy number associated with the case.
          example: AU7654098
        applicationType:
          type: string
          description: The application type of the policy.
          example: Digital
        process:
          type: array
          description: A list of processes to filter the search results.
          items:
            type: string
          example:
          - New Business
        carrier:
          type: array
          description: A list of carrier to filter the search results.
          items:
            type: string
          example:
          - Carrier 1
          - Carrier 2
        requestSubType:
          type: array
          description: A list of request subtypes to filter the search results.
          items:
            type: string
          example:
          - INTERNAL CONVERSION
        productName:
          type: array
          description: A list of product names to filter the search results.
          items:
            type: string
          example:
          - TOTAL INTEREST ANUITY APPLICATION
        caseStatus:
          type: array
          description: A list of case statuses to filter the search results.
          items:
            type: string
          example:
          - Exception
        createdDateStart:
          type: string
          description: The start date for the creation date range filter.
          format: date-time
        createdDateEnd:
          type: string
          format: date-time
          description: The end date for the creation date range filter.
        updatedDateStart:
          type: string
          format: date-time
          description: The start date for the updated date range filter.
        updatedDateEnd:
          type: string
          format: date-time
          description: The end date for the updated date range filter.
        brokerDealerName:
          type: array
          description: A list of broker dealer names to filter the search results.
          items:
            type: string
          example:
          - Broker 1
          - Broker 2
    CaseInstance:
      type: object
      properties:
        _id:
          type: string
          description: Unique identifier for the case instance.
        templateId:
          type: string
          description: Identifier for the template associated with the case instance.
        carrier:
          type: string
          description: Name of the carrier associated with transaction/case.
        process:
          type: string
          description: Name of the process/transaction type for case.
        caseGroup:
          type: string
          description: Name of the caseGroup type for case.
        parentInstanceId:
          type: string
          description: Identifier for the parent case instance, if applicable.
        correlationId:
          type: string
          description: Identifier used for correlating events as they received.
        caseStatus:
          description: Current status of the case instance.
          type: string
          enum:
          - IN_PROGRESS
          - EXCEPTION
          - COMPLETED
          - CANCELED
        caseResult:
          description: Contextual information regarding the caseStatus especially when case is marked as canceled
          type: string
        caseResultDetail:
          description: Detailed contextual information regarding the caseStatus
          type: string
        primary:
          type: boolean
          description: Indicates if this is the primary case instance.
        escalated:
          type: boolean
          description: Indicates if the case instance has been escalated.
        caseProcessingDetails:
          type: array
          description: List of detail sections for case processing.
          items:
            type: object
            properties:
              detailType:
                type: string
                description: Type of the detail section (e.g., "submissionDetails", "executionDetails").
                example: submissionDetails
              properties:
                type: array
                description: List of properties for the detail section.
                items:
                  type: object
                  properties:
                    _id:
                      type: string
                      description: Identifier for the property (e.g., "submittedBy", "submissionSource").
                      example: submittedBy
                    value:
                      type: string
                      description: Value of the property.
                      example: MANUAL
        linkDetails:
          type: object
          description: Details about linked case instances.
          properties:
            linkedCaseInstanceId:
              type: string
              description: Identifier of the linked case instance.
            linkedReason:
              type: string
              description: Reason for linking the case instances. It could be identified by case management system or by some
                external system
        processSubType:
          type: string
          description: Subtype of the process/transaction associated with the case.
        policyNumber:
          type: string
          description: Policy number/Contract No associated to the case instance.
        planCode:
          type: string
          description: PlanCode associated to the case instance.
        productName:
          description: Name of the product associated with Contract/Policy.
          type: string
        documents:
          type: array
          description: List of document associated to the case. (DEPRECATED)
          deprecated: true
          items:
            $ref: '#/components/schemas/DocumentInstance'
        exceptions:
          description: List of all exceptions/NIGOs associated related to the case.
          type: array
          items:
            $ref: '#/components/schemas/ExceptionInstance'
        notes:
          type: array
          description: List of all note associated to the case.
          items:
            $ref: '#/components/schemas/NoteInstance'
        tasks:
          type: array
          description: List of all tasks associated to the case irrespective of different stage/steps.
          items:
            $ref: '#/components/schemas/TaskLinkInstance'
        mappedTasks:
          type: array
          description: List of Task Identifiers which directly linked to Case (RESERVED FOR FUTURE SCOPE)
          items:
            type: string
        mappedExceptions:
          type: array
          description: List of Exception/NIGO Identifiers which directly linked to Case (RESERVED FOR FUTURE SCOPE)
          items:
            type: string
        mappedNotes:
          type: array
          description: List of Notes Identifiers which directly linked to Case (RESERVED FOR FUTURE SCOPE)
          items:
            type: string
        mappedDocuments:
          type: array
          description: List of Exception/NIGO Identifiers which directly linked to Case (RESERVED FOR FUTURE SCOPE)
          items:
            type: string
        parties:
          type: array
          description: List of individuals/parties associated with the contract/policy related to the case
          items:
            type: object
            properties:
              partyRole:
                type: string
                description: Role of the party in the case. (LIST TO BE SHARED BY SOR)
                enum:
                - Annuitant / Insured, Primary
                - Owner, Primary
                - Beneficiary, Primary
                - Servicing Agent
                - Agent
              partyType:
                type: string
                description: Type of party involved in the case.
                enum:
                - Company
                - Individual
                - Other
                - Trust
                - UGMA
              firstName:
                type: string
                description: First name of the party.
              middleName:
                type: string
                description: Middle name of the party.
              lastName:
                type: string
                description: Last name of the party.
              fullName:
                type: string
                description: Full name of the party.
              prefix:
                type: string
                description: Prefix of the party's name.
              suffix:
                type: string
                description: Suffix of the party's name.
              gender:
                type: string
                description: Gender of the party.
              ssn:
                type: string
                description: ssn of the party.
              percent:
                type: string
                description: Percentage share or involvement of the party in the policy.
        identifiers:
          type: array
          description: List of identifiers received from different systems.
          items:
            $ref: '#/components/schemas/IdentifierInstance'
        additionalData:
          description: Additional data related to the case. (DEPRECATED)
          deprecated: true
          oneOf:
          - $ref: '#/components/schemas/CaseAdditionalDataNB'
          - $ref: '#/components/schemas/CaseAdditionalDataWD'
        stages:
          type: array
          description: List of stages representing milestone in the journey of a case/transaction.
          items:
            $ref: '#/components/schemas/StageInstance'
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the case instance was created, derived from the time of the initial event.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the case instance was last updated, derived from the time of the latest event.
        systemUpdatedDt:
          type: string
          format: date
          description: The date when the system was last updated.
        deleted:
          type: boolean
          description: Indicates if the case instance has been deleted.
        techExceptionStatus:
          type: string
          description: Overall status of technical exceptions on the case
        techExceptionCount:
          type: integer
          format: int32
          description: Total count of technical exceptions on the case
    TaskDetailById:
      allOf:
      - $ref: '#/components/schemas/TaskListSummary'
      type: object
      properties:
        exceptions:
          type: array
          items:
            type: string
          example: []
        schema:
          type: object
          example:
            schema: http://json-schema.org/draft-04/schema#
            type: object
            properties:
              suitabilityStatus:
                type: string
              notes:
                type: array
                items:
                  type: object
                  properties:
                    submissionDate:
                      type: string
                    commentCategory:
                      type: string
                    commentSubCategory:
                      type: string
                    commentDetail:
                      type: string
                    comment:
                      type: string
                    description:
                      type: string
                    createdDate:
                      type: string
                    createBy:
                      type: string
                    noteId:
                      type: integer
                  required:
                  - submissionDate
                  - commentCategory
                  - commentSubCategory
                  - commentDetail
                  - comment
                  - description
                  - createdDate
                  - createBy
                  - noteId
            required:
            - suitabilityStatus
        data:
          oneOf:
          - $ref: '#/components/schemas/SuitabilityDetails'
          - $ref: '#/components/schemas/AgentInformationDetails'
    DocumentInstance:
      type: object
      properties:
        id:
          type: string
          example: '12345'
        name:
          type: string
          example: Identity_Document.pdf
        documentNumber:
          type: string
          example: '119299808'
        source:
          type: string
          example: onbase
        url:
          type: string
          example: http://dev.onbase.com/document/12345
        updatedAt:
          type: string
          example: 09-April-2023
        fileType:
          type: string
          example: NB Fix
        documentUploadDate:
          type: string
          example: '2024-10-04T13:16:45-05:00'
        additionalData:
          $ref: '#/components/schemas/AdditionalDataInstance'
        eventRef:
          type: array
          items:
            type: string
            example: 15ea7582-262f-4dfe-8a60-1e8b8e763fd4
    ExceptionInstanceForTask:
      type: object
      properties:
        id:
          type: string
          example: '12324'
        status:
          type: string
          example: New
        category:
          type: string
          example: Agent
        reason:
          type: string
          example: Suitability requested
        detailedReason:
          type: string
          example: Suitability requested from External client
        updatedAt:
          type: string
          example: 09-April-2023
    ExceptionInstance:
      type: object
      properties:
        id:
          type: string
          description: Unique Identifier for Exception Instance
        status:
          type: string
          enum:
          - NEW
          - RESOLVED
          description: Status of Exception Instance
        exceptionRefId:
          type: string
          description: The exceptionRefId of the exception.
          example: NB.EM.068
        exceptionType:
          type: string
          description: The exceptionType of the exception.
          example: Business Exception
        category:
          type: string
          description: Category of Exception
        reason:
          type: string
          description: Short description of Exception
        detailedReason:
          type: string
          description: Detailed description of Exception
        updatedAt:
          type: string
          description: Last updated timestamp of Exception
        taskIdList:
          type: array
          items:
            type: string
          uniqueItems: true
          description: List of Task Identifier associated with Exception Instance
        additionalData:
          $ref: '#/components/schemas/AdditionalDataInstance'
        exceptionAdditionalData:
          type: array
          description: Exception Additional Data
          items:
            $ref: '#/components/schemas/ExceptionAdditionalData'
        eventRef:
          type: array
          items:
            type: string
          description: List of Events associated with Exception Instance
    NoteInstance:
      type: object
      properties:
        id:
          type: string
          description: A unique identifier of Note
        note:
          type: string
          description: The Text content of Note
        author:
          type: string
          description: Author of note
        internal:
          type: boolean
          description: Indicates whether the item is internal or not.
        createdAt:
          type: string
          description: The timestamp of Note been created
        updatedAt:
          type: string
          example: 09-April-2023
          description: The timestamp of Note been updated
        desc:
          type: string
          description: Description of note
        additionalData:
          $ref: '#/components/schemas/AdditionalDataInstance'
        eventRef:
          type: array
          items:
            type: string
          description: List of Events associated with Note Instance
    TaskLinkInstance:
      type: object
      properties:
        id:
          type: string
          description: A Unique identifier of Task in Task Management
        taskType:
          type: string
          description: Business friendly type for Task
        label:
          type: string
          description: Business friendly Label for Task
        assignee:
          type: string
          description: User currently assigned to the task
        status:
          type: string
          description: Status of Task (STATUS DISCUSSION IN PROGRESS)
          enum:
          - OPEN
          - CLOSED
          - NEW
          - COMPLETED
          - COMPLETE
        taskName:
          type: string
          description: task name of the task
        queue:
          type: string
          description: Queue to which the task is assigned
        createdAt:
          type: string
          description: Timestamp when the Task was created
        updatedAt:
          type: string
          description: Timestamp when the Task was last updated
        eventRef:
          type: array
          items:
            type: string
            description: List of Events associated with Note Instance
        externalTaskId:
          type: string
          description: The identifier how an external system understand it for example used to map onbase taskId
        notesIdList:
          type: array
          items:
            type: string
          description: List of Note identifiers associated to Task
    AdditionalDataInstance:
      type: object
      additionalProperties:
        type: string
    StageInstance:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the stage instance.
        label:
          type: string
          description: Business Friendly label for the stage instance.
        stageStatus:
          type: string
          description: Current status of the stage instance.
          enum:
          - IN_PROGRESS
          - EXCEPTION
          - COMPLETED
          - NOT_STARTED
        mappedTasks:
          type: array
          description: List of identifiers for tasks mapped to this stage (RESERVED FOR FUTURE SCOPE).
          items:
            type: string
        mappedNotes:
          type: array
          description: List of identifiers for notes mapped to this stage (RESERVED FOR FUTURE SCOPE).
          items:
            type: string
        steps:
          type: array
          description: List of step instances that make up this stage.
          items:
            $ref: '#/components/schemas/StepInstance'
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the stage instance was created.
    StepInstance:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the step instance.
        label:
          type: string
          description: Business Friendly label for the step instance.
        stepStatus:
          type: string
          description: Current status of the step instance.
          enum:
          - IN_PROGRESS
          - EXCEPTION
          - COMPLETED
          - NOT_STARTED
        stepResult:
          type: string
          description: Step level decision outcome
        eventRef:
          type: array
          description: List of event references associated with this step.
          items:
            type: string
        mappedTasks:
          type: array
          description: List of identifiers for tasks mapped to this step.
          items:
            type: string
        mappedExceptions:
          type: array
          description: List of exception mapped to this step.
          items:
            type: string
        mappedDocuments:
          type: array
          description: List of document id mapped to this step.
          items:
            type: string
        mappedCases:
          type: array
          description: List of Case id mapped to this step.
          items:
            type: string
        mappedNotes:
          type: array
          description: List of identifiers for notes mapped to this step (RESERVED FOR FUTURE SCOPE).
          items:
            type: string
        multiInstance:
          type: boolean
          description: Indicates whether step is multiple instance or not.
          default: false
        instanceInfo:
          type: object
          description: Contains information about the multi instance step
          properties:
            identifier:
              type: string
              description: A unique identifier for the multi instance step.
            label:
              type: string
              description: The label of the multi instance step.
            object:
              type: string
              description: The object of the multi instance step.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the step instance was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the step instance was last updated.
    ValidationResponse:
      type: object
      properties:
        statusCode:
          type: integer
          format: int32
          example: 400
        timestamp:
          type: string
          format: date-time
        errorId:
          type: string
          example: a4a57ed0-2c1b-4922-9959-3b85dd8a96d3
        message:
          type: string
          example: Template validation fails with errors
        error:
          type: array
          items:
            type: string
            example: Stage [0] Step [1] mandatory attribute label missing
    ResourceNotFoundResponse:
      type: object
      properties:
        timestamp:
          type: string
        status:
          type: integer
          format: int32
        error:
          type: string
        message:
          type: string
        path:
          type: string
      example:
        timestamp: '1681395423438'
        status: 404
        error: Not Found
        message: resource not found for provided input
        path: /case/v1/path/schema/Test
    AccessDeniedResponse:
      type: object
      properties:
        timestamp:
          type: integer
          format: int64
        status:
          type: integer
          format: int32
        error:
          type: string
        message:
          type: string
        path:
          type: string
      example:
        timestamp: 1681395423438
        status: 403
        error: Access Denied
        message: 'User is not authorized for the carrier : CarrierName_2'
        path: API Path
    UnauthorizedResponse:
      type: object
      properties:
        timestamp:
          type: integer
        status:
          type: integer
        error:
          type: string
        message:
          type: string
        path:
          type: string
      example:
        timestamp: 1721395364487
        status: 401
        error: Unauthorized
        message: Unauthorized
        path: API Path
    CaseInstanceSummary:
      type: object
      properties:
        id:
          type: string
          description: A unique identifier for the case instance.
          example: 15ea7582-262f-4dfe-8a60-1e8b8e763fd4
        templateId:
          type: string
          description: The identifier of the template associated with the case.
          example: cde717c9-5f7e-4c63-953c-ef50e44c021a
        carrier:
          type: string
          description: The carrier associated with the case.
          example: CarrierName_1
        process:
          type: string
          description: The process associated with the case.
          example: Correspondence
        parentInstanceId:
          type: string
          description: The identifier of the parent case instance, if any.
          example: 15ea7582-262f-4dfe-8a60-1e8b8e763fb1
        caseGroup:
          type: string
          description: Name of the caseGroup type for case.
          example: Distribution
        escalated:
          type: boolean
          description: Indicates if the case instance has been escalated.
          default: false
          example: false
        deleted:
          type: boolean
          description: Indicates if the case instance has been deleted.
          default: false
          example: false
        applicationType:
          type: string
          description: The application type of the policy.
          example: Digital
        caseResult:
          type: string
          description: Contextual information regarding the caseStatus especially when case is marked as canceled
        caseResultDetail:
          type: string
          description: Detailed contextual information regarding the caseStatus
        correlationId:
          type: string
          description: An identifier used to correlate related events or instances.
          example: 15ea7582-262f-4dfe-8a60-1e8b8e763fb1
        primary:
          type: boolean
          description: Indicates if this is the primary case instance.
          example: false
        processSubType:
          type: string
          description: Subtype of the process/transaction associated with the case.
          example: INCOMING_TRANSFER
        policyNumber:
          type: string
          description: Policy number/Contract No associated with the case instance.
          example: '571001920'
        productName:
          type: string
          description: Name of the product associated with the Contract/Policy.
          example: CarrierName_1MUTUAL STABLE VOYAGE
        caseStatus:
          type: string
          description: The current status of the case.
          enum:
          - IN_PROGRESS
          - EXCEPTION
          - COMPLETED
          - CANCELED
          example: IN_PROGRESS
        stages:
          type: array
          description: A list of stages associated with the case.
          items:
            type: object
            properties:
              id:
                type: string
                description: A unique identifier for the stage.
                example: 15ea7582-262f-4dfe-8a60-1e8b8e763fb2
              label:
                type: string
                description: The label of the stage.
                example: Agent Validation
              stageStatus:
                type: string
                description: The current status of the stage.
                enum:
                - IN_PROGRESS
                - EXCEPTION
                - COMPLETED
        exceptions:
          type: array
          description: A list of exceptions associated with the case.
          items:
            type: object
            properties:
              id:
                type: string
                description: A unique identifier for the exception.
                example: '123456'
              status:
                type: string
                description: The status of the exception.
                enum:
                - NEW
                - RESOLVED
                example: NEW
              exceptionRefId:
                type: string
                description: The exceptionRefId of the exception.
                example: NB.EM.068
              category:
                type: string
                description: The category of the exception.
                example: Agent
              reason:
                type: string
                description: The reason for the exception.
                example: reason
              detailedReason:
                type: string
                description: A detailed reason for the exception.
                example: detailed status
              createdAt:
                type: string
                format: date-time
                description: The date and time when the exception was created.
              updatedAt:
                type: string
                format: date-time
                description: The date and time when the exception was last updated.
        parties:
          type: array
          description: A list of parties associated with the case.
          items:
            type: object
            properties:
              partyRole:
                type: string
                description: The role of the party in the case.
                enum:
                - Annuitant / Insured, Primary
                - Owner, Primary
                - Beneficiary, Primary
                - Servicing Agent
                - Agent
                example: Owner, Primary
              partyType:
                type: string
                description: The type of the party.
                example: Individual
              firstName:
                type: string
                description: The first name of the party.
                example: Utkarsh
              middleName:
                type: string
                description: The middle name of the party.
                example: Kr
              lastName:
                type: string
                description: The last name of the party.
                example: Jain
              fullName:
                type: string
                description: The full name of the party.
                example: Utkarsh Kr Jain
              prefix:
                type: string
                description: The prefix for the party's name.
                example: Mr.
              suffix:
                type: string
                description: The suffix for the party's name.
                example: '1'
              gender:
                type: string
                description: The gender of the party.
                example: M
              ssn:
                type: string
                description: The ssn of the party.
                example: '123456789'
              percent:
                type: string
                description: The percentage associated with the party's role in the case.
                example: '100'
        additionalData:
          oneOf:
          - $ref: '#/components/schemas/CaseAdditionalDataNB'
          - $ref: '#/components/schemas/CaseAdditionalDataWD'
          description: Additional data specific to the case.
        identifiers:
          type: array
          description: A list of identifiers associated with the case.
          items:
            type: object
            properties:
              identifier:
                type: string
                description: The type of identifier.
                example: policyNumber
              value:
                type: string
                description: The value of the identifier.
                example: AU42046202
        createdAt:
          type: string
          format: date-time
          description: The date and time when the case was created.
        updatedAt:
          type: string
          format: date-time
          description: The date and time when the case was last updated.
