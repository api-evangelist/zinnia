    Attributes:
      type: object
      properties:
        carrierCode:
          type: string
          example: carrierCode
          description: Carrier Code
        productCode:
          type: string
          example: productCode
          description: Product Code
        productType:
          type: string
          description: The Product Type refers to the specific category of life insurance or annuity based on its structure, premium flexibility, cash value potential, and investment options. It determines how the policy functions, how premiums are paid, and whether the policy includes a cash accumulation component
          example: productType
        planName:
          type: string
          description: The Product Name refers to the specific life insurance or annuity product selected by the contract owner at the time of policy issuance. It identifies the type of coverage, policy structure, and key features associated with the contract
          example: planName
        renewableIndicator:
          type: string
          example: renewableIndicator
          description: Renewable Indicator
        qualifiedPlanType:
          type: string
          example: qualifiedPlanType
          description: Qualified Plan Type
        payToYear:
          type: string
          example: payToYear
          description: Pay To Year
        policyYear:
          type: string
          description: The Policy Year refers to the number of years that have passed since the policy’s effective date. It is used to track policy duration, benefits, premium schedules, surrender charges, and other contractual provisions
          example: policyYear
        monthOfYear:
          type: string
          description: The Policy Months refers to the number of months that have passed since the policy’s effective date. It is used to track policy duration, premium schedules, benefits, and contractual provisions on a monthly basis
          example: monthOfYear
        policyNumber:
          type: string
          description: The Policy Number is a unique identifier assigned to a life insurance or annuity contract by the insurance carrier. It serves as the official reference number for tracking, managing, and servicing the policy throughout its lifetime
          example: policyNumber
        policyStatus:
          type: string
          description: The Policy Status refers to the current standing of a life insurance or annuity contract, indicating whether it is active, inactive, lapsed, or terminated. The status determines whether the policyholder has coverage and whether policy benefits remain in effect
          example: policyStatus
        issueType:
          type: string
          description: The Issue Type refers to the classification of how a life insurance or annuity contract is issued, based on underwriting approval, policy structure, or specific issuance conditions. It determines whether the policy was fully underwritten, simplified, guaranteed issue, or part of a group plan
          example: issueType
        residenceState:
          type: string
          example: residenceState
          description: Residence State
        jurisdiction:
          type: string
          example: jurisdiction
          description: Jurisdiction
        effectiveDate:
          type: string
          example: effectiveDate
          description: Effective Date
        applicationSignedDate:
          type: string
          example: applicationSignedDate
          description: Application Signed Date
        issueDate:
          type: string
          example: issueDate
          description: The Policy Issue Date, also known as the Policy Launch Date, is the date when the insurance company officially issues the policy to the client. This occurs after the application is approved, the insured accepts the offer, and payment information is provided. It marks the formal activation of the policy and triggers policy delivery
        contestabilityStartDate:
          type: string
          example: contestabilityStartDate
          description: The Contestability Start Date refers to the beginning of the contestability period, which is the time frame in which an insurance company can investigate and deny a claim if material misrepresentations or fraud are found in the application
        contestabilityEndDate:
          type: string
          example: contestabilityEndDate
          description: The Contestability End Date is the date when the contestability period expires, meaning the insurer can no longer deny a claim based on misrepresentation or omission in the application, unless fraud is proven
        policyDeliveryReceiptDate:
          type: string
          example: policyDeliveryReceiptDate
          description: Policy Delivery Receipt Date
        initialPaymentExpirationDate:
          type: string
          example: initialPaymentExpirationDate
          description: The Initial Payment Amount Expiration Date refers to the deadline by which the initial premium payment must be made to keep the policy offer valid and ensure the policy goes into effect., if not received Policy will be Canceled due to no Premium Set at Issuance
        nextAnniversaryDate:
          type: string
          example: nextAnniversaryDate
          description: The Next Policy Anniversary Date refers to the upcoming annual recurrence of the policy’s start date. It is based on the Policy Start Date and marks key policy milestones such as premium due dates, cash value updates, policy renewals, and benefit adjustments
        nextMonthiversaryDate:
          type: string
          example: nextMonthiversaryDate
          description: The Next Policy Monthiversary Date refers to the same day of each month that corresponds to the Policy Start Date, marking the monthly recurrence of the policy. It is used for monthly premium payments, cost deductions, cash value calculations, and interest crediting
        previousAnniversaryDate:
          type: string
          example: previousAnniversaryDate
          description: Previous Anniversary Date
        previousMonthiversaryDate:
          type: string
          example: previousMonthiversaryDate
          description: Previous Monthiversary Date
        expiryDate:
          type: string
          example: expiryDate
          description: Expiry Date
        terminationDate:
          type: string
          example: terminationDate
          description: Termination Date
        costBasisDate:
          type: string
          example: costBasisDate
          description: The Cost Basis Date refers to the date on which the cost basis value of a life insurance policy or annuity contract is calculated. The cost basis represents the total amount of after-tax money contributed to the policy or annuity and is used to determine the taxable portion of withdrawals, loans, or payouts
        costBasis:
          type: string
          example: costBasis
          description: The Cost Basis refers to the total cumulative amount of after-tax premiums paid into a life insurance policy or annuity contract. It represents the non-taxable portion of withdrawals, policy loans, or surrenders, ensuring that policyholders are only taxed on gains above this amount
        currency:
          type: string
          example: currency
          description: The Currency refers to the system of money in which a life insurance or annuity contract is denominated and transacted. It defines the monetary unit used for premium payments, policy benefits, withdrawals, and payouts
        claimApprovalDate:
          type: string
          example: claimApprovalDate
          description: The Claim Approval Date is the date when an insurance company officially approves a claim for payment after verifying the claim details, policy coverage, and required documentation
        certifiedReceivedDate:
          type: string
          example: certifiedReceivedDate
          description: The Certified Received Date refers to the date when the insurance company officially receives the certified death paperwork (such as a death certificate) required to process a life insurance claim. This date marks the beginning of the formal claims verification process
        lossReportDate:
          type: string
          example: lossReportDate
          description: Loss Report Date
      required:
      - carrierCode
      - productCode
      - productType
      - planName
      - renewableIndicator
      - qualifiedPlanType
