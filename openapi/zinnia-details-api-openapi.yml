          example: '300'
          description: Unloaned Account Value
        loanedAcctValue:
          type: string
          example: '100'
          description: Loaned Account Value
        cashSurrenderValue:
          type: string
          example: '800'
          description: Cash Surrender Value
        netAmountAtRisk:
          type: string
          example: '50'
          description: The Net Amount at Risk (NAR) is the difference between the policy’s total death benefit and the policy’s account value (cash value). It represents the portion of the death benefit that the insurance company is at risk of paying out beyond the policyholder’s accumulated account value
        deemedCashValueAmount:
          type: string
          example: '400'
          description: Deemed Cash Value Amount
      required:
