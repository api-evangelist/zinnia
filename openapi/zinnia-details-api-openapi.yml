    TestValueAttributes:
      type: object
      properties:
        guidelineLevelPremiumTestDate:
          type: string
          example: '2021-01-01'
          description: Guideline Level Premium Test Date
        definitionOfLifeInsuranceMethod:
          type: string
          example: Method A
          description: 'The Definition of Life Insurance (DLI) refers to the IRS-defined criteria that a life insurance policy must meet to maintain its tax-advantaged status. Policyholders must choose between two IRS-approved tests to ensure compliance: Guideline Premium Test (GPT) Cash Value Accumulation Test (CVAT) Each test has different implications on premium limits, cash value growth, and tax treatment'
        guidelineSinglePremium:
          type: string
          example: '500'
          description: The Guideline Single Premium (GSP) refers to the maximum single premium payment that can be made into a life insurance policy without violating the IRS`s Guideline Premium Test (GPT). It is used to ensure that the policy qualifies as life insurance and maintains its tax-advantaged status
        guidelineAnnualPremium:
          type: string
          example: '1000'
          description: Guideline Annual Premium
        guidelineLevelPremiumExcessPayAmount:
          type: string
          example: '200'
          description: Guideline Level Premium Excess Pay Amount
        cumulativeGuidelineAnnualPremium:
          type: string
          example: '2500'
          description: Cumulative Guideline Annual Premium
        modifiedEndowmentContractTestDate:
          type: string
          example: '2022-01-01'
          description: The MEC Test Date refers to the last date on which the life insurance policy was tested to determine whether it qualifies as a Modified Endowment Contract (MEC) under IRS regulations. This date is updated whenever a new MEC test is performed, ensuring the policy remains compliant with federal tax rules
        modifiedEndowmentContractMaximumContribution:
          type: string
          example: '3000'
          description: Modified Endowment Contract Maximum Contribution
        modifiedEndowmentContractDate:
          type: string
          example: '2022-05-01'
          description: Modified Endowment Contract Date
        modifiedEndowmentContractIndicator:
          type: string
          example: 'YES'
          enum:
          - 'YES'
          - 'NO'
          description: Modified Endowment Contract Indicator
        sevenPayPremium:
          type: string
          example: '1500'
          description: The 7-Pay Premium refers to the maximum allowable premium that can be paid into a life insurance policy during the first seven years without triggering Modified Endowment Contract (MEC) status. It ensures that the policy remains a tax-advantaged life insurance contract rather than an investment vehicle
        sevenPayPremiumStartDate:
          type: string
          example: '2023-01-01'
          description: Seven Pay Premium Start Date
        sevenPayYear:
          type: string
          example: '5'
          description: Seven Pay Year
        sevenPayTestBasis:
          type: string
          example: Basis A
          description: The 7-Pay Test Basis refers to the total cumulative premium paid into a life insurance policy during the first seven years (the 7-pay period), as measured against the IRS 7-Pay Test limit. This amount is used to determine whether the policy qualifies as a life insurance contract or is classified as a Modified Endowment Contract (MEC).
        sevenPayTestLimit:
          type: string
          example: '3000'
          description: Seven Pay Test Limit
        sevenPayTestYearInPeriod:
          type: string
          example: '2'
          description: The Year in Period refers to the current year within the seven-year time frame of the 7-Pay Test. It is crucial because the 7-Pay Limit increases each year, and the test is updated annually to ensure the policy remains within IRS limits
      required:
      - guidelineLevelPremiumTestDate
      - definitionOfLifeInsuranceMethod
      - guidelineSinglePremium
      - guidelineAnnualPremium
      - guidelineLevelPremiumExcessPayAmount
      - cumulativeGuidelineAnnualPremium
      - modifiedEndowmentContractTestDate
      - modifiedEndowmentContractMaximumContribution
      - modifiedEndowmentContractDate
      - sevenPayPremium
      - sevenPayPremiumStartDate
      - sevenPayYear
      - sevenPayTestBasis
      - sevenPayTestLimit
      - sevenPayTestYearInPeriod
