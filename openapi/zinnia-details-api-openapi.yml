        segmentId:
          type: string
          description: A unique identifier assigned to a particular segment for a specific fund account within the investment structure
          example: segment1
        appliedRate:
          type: number
          description: 'For funds: The rate at which an activity (e.g., interest, withdrawal, allocation) is applied. For match: The percentage rate at which the match or bonus contribution current value grows. For loans: The interest rate applied to the loan balance to calculate accrued interest'
          format: double
          example: 100
        appliedAmount:
          type: number
          description: 'For funds: The specific amount or percentage applied for withdrawal, transfer, or reallocation from the particular segment selected for a fund. For match: This is transaction level amount which tracks changes to match current value. This gets calculated on events such as interest credit match, premium, match bonus vesting. For loans: This is transaction level amount which tracks changes to loan balance . This gets calculated on events such as interest loan,loan repayment, loan true up,new loan,etc.'
          format: double
          example: 100
        appliedInterest:
          type: number
          description: Applied Interest refers to the amount of loan interest that has been posted (charged) to the policy’s outstanding loan balance during a specific accounting period. This interest is based on the terms of the policy loan, such as the loan type (fixed or variable), rate, and method of interest
          format: double
          example: 100
    PolicyFeature:
      type: object
      properties:
        featureType:
          $ref: '#/components/schemas/FeatureType'
        featureIndicator:
          type: boolean
          description: A Feature Indicator in life insurance and annuities refers to a binary flag (Yes/No, True/False, or Enabled/Disabled) that signifies whether a specific policy feature, rider, or benefit is included in the contract. It helps insurers, agents, and policyholders quickly identify which optional or standard benefits apply to a policy
        featureOption:
          type: string
          enum:
          - LIFEONLY
          - JOINTLIFEONLYJOINTANDSURVIVOR
          - PERIODCERTAIN
          - AMOUNTCERTAIN
          - LIFEWITHPERIODCERTAIN
          - LIFEWITHCASHREFUND
          - LIFEWITHINSTALLMENTREFUND
          - AUTOMATICPOLICYLOAN
          - REDUCEDPAIDUP
          - AGE
          - FACEAMOUNT
          - LEGAL
          - OPERATIONAL
          - COLLATERALLYASSIGNEDUNSPECIFIED
          - JOINTLIFEONLY
          - JOINTANDSURVIVOR
          - JOINTANDSURVIVORPERIODCERTAIN
          - DIVORCE
          - OVERPAYMENT
          - PAIDUPADDITION
          - CASH
          - MECRESTRICT
          - COMPLIANCE
          - JOINTLIFECASHREFUND
          - INTERESTONLY
          - JOINTLIFEINSTALLMENTREFUND
          description: A Feature Option in life insurance and annuities refers to the specific choices or variations available within a policy feature, allowing customization based on the policyholder’s needs
        reducedPaidUpFaceAmount:
          type: number
          format: double
          description: Reduced Paid-Up Face Amount is the new, lower death benefit that results when a policyholder elects the Reduced Paid-Up (RPU) insurance option on a permanent life insurance policy. Under this option, the policyholder uses the accumulated cash value of their policy to purchase a fully paid-up policy—meaning no further premiums are required—but with a reduced face amount compared to the original coverage
          example: 46.49
        startDate:
          type: string
          format: date
          example: '2023-01-01'
          description: Start date of the feature
        endDate:
          type: string
          format: date
          example: '2023-01-01'
          description: End date of the feature
        status:
          type: boolean
          description: A Feature Status in life insurance and annuities indicates the current state or activation condition of a specific feature within a policy or contract. It reflects whether a feature is active, inactive, pending, or restricted, helping insurers, agents, and policyholders track policy functionality
        period:
          type: number
          format: int32
          description: The Period of Feature in life insurance and annuities refers to the duration for which a specific feature or benefit is available, active, or applicable within a policy or contract. It defines the time frame in which a feature can be used, exercised, or remains valid
          example: 30
        effectiveDate:
          type: string
          format: date
          example: '2023-01-01'
          description: Effective date of the feature
        totalRequiredAmount:
          type: number
          format: double
          description: The Total Minimum Required Amount refers to the lowest financial threshold needed to activate, maintain, or utilize a specific insurance or annuity feature. This can include minimum premiums, account balances, contributions, or fees necessary to keep the policy or benefit in force
          example: 0
        totalMinimumRequiredAmount:
          type: number
          format: double
          description: Min (This is if Carrier Acceot Min) - This is the Amount needed to reactivate the Policy (If there is an Outstanding Loan on the Policy Min Required Loan Balance will be part of this Amount)
          example: 0
        paymentAmount:
          type: number
          format: double
          description: The Payment Amount for a Feature refers to the specific cost required to activate, maintain, or utilize a particular policy feature or rider in a life insurance or annuity contract. This amount can be a one-time payment, recurring charge, or deducted from policy values depending on the feature type
          example: 46.49
        exclusionAmount:
          type: number
          format: double
          description: The Fixed Exclusion Amount in the annuitization feature of an annuity refers to the portion of each annuity payment that is considered a return of the original investment (principal) and is therefore excluded from taxable income. This amount helps annuitants determine their tax liability on annuity payments
          example: 46.49
        yearToDatePaymentAmount:
          type: number
          format: double
          description: The YTD Payment Amount for a Feature refers to the total amount paid or received for a specific policy feature from the beginning of the calendar year to the current date. This amount is commonly tracked for premiums, rider fees, annuity payouts, withdrawals, and other benefit-related transactions
          example: 46.49
        exclusionRatio:
          type: number
          format: double
          description: The Exclusion Ratio in annuitization refers to the portion of each annuity payment that is considered a return of the original investment (principal) and is therefore excluded from taxable income. It determines how much of an annuity payment is taxable and how much is tax-free.
          example: 46.49
        totalPaymentAmount:
          type: number
          format: double
          description: The Total Payment Amount of a Feature refers to the cumulative cost or sum of all payments made over time for a specific feature in a life insurance or annuity contract. This can include premiums, rider fees, annuity payouts, or benefit-related charges
          example: 46.49
        jointLivesPercentageToSurvivor:
          type: number
          format: double
          description: Joint Lives % to Survivor refers to the percentage of annuity payments that continue to the surviving annuitant after one of the joint annuitants passes away. It applies to Joint & Survivor Annuities, ensuring ongoing income for the surviving spouse or beneficiary.
          example: 100
        underwritingDecision:
          type: boolean
          description: The Reinstatement Underwriting Decision refers to the evaluation process and approval or denial of a reinstatement request for a lapsed life insurance policy or annuity contract. When a policy lapses due to non-payment, the insurer requires underwriting to determine if the policy can be reinstated based on financial, medical, and risk factors
        approvalDate:
          type: string
          format: date
          example: '2023-01-01'
          description: The Approval Date for a Feature refers to the official date on which an insurance company authorizes and activates a specific feature, rider, or benefit within a life insurance policy or annuity contract. This date marks when the feature becomes effective and available for use by the policyholder or annuitant
        featureId:
          type: string
          example: '123'
          description: Unique identifier of feature sub-type for "custom feature
        frequency:
          $ref: '#/components/schemas/Frequency'
        paymentForm:
          $ref: '#/components/schemas/PaymentForm'
        featureSubType:
          type: string
          enum:
          - MULTIPLEPOLICYDISCOUNT
          - CONTROLBUSINESSINDICATOR
          - RESTRICT
          - BROKERIDENTIFICATIONNUMBER
          description: Gives the sub type of the feature type "Custom Feature
        featureValue:
          type: string
          description: The value of the feature
          example: '123'
        periodCertainEndDate:
          type: string
          description: The Period Certain End Date for a Feature refers to the final date of a specific feature or benefit within a life insurance or annuity contract. This date marks the end of the feature`s duration and defines when it ceases to be active or available for use by the policyholder or annuitant
          example: '2023-01-01'
          format: date
        firstPaymentDate:
          type: string
          description: The First Payment Date for a Feature refers to the initial payment date for a specific policy feature, rider, or benefit within a life insurance policy or annuity contract. This date marks when the feature becomes effective and available for use by the policyholder or annuitant
          example: '2023-01-01'
          format: date
        annuitizedAmount:
          type: number
          description: The base amount used to calculate annuity payouts, as determined during annuitization
          format: double
          example: 100000
        timestamp:
          type: string
          format: date-time
          example: '2023-01-01T12:00:00.000Z'
          description: TBD
