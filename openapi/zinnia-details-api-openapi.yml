      type: object
      properties:
        partyId:
          type: string
          description: The Insured(s) ID is a unique identifier assigned to the insured individual(s) covered under a life insurance policy. It is used by insurance companies to track, process, and manage policyholder records efficiently
          example: Party_PI_1
        issueAge:
          type: integer
          format: int32
          description: Note-Use coverage.coverageLayers.coverageParticipants.partyAgeAtIssue field instead of issueAge
          example: 43
        partyAgeAtIssue:
          type: number
          format: int32
          description: The Party Age at Issue refers to the age of any party associated with a life insurance or annuity policy at the time the contract is issued
          example: 43
