    FundSegment:
      type: object
      properties:
        segmentId:
          type: string
          description: A unique identifier assigned to a particular investment segment or bucket
          example: '3'
        fundId:
          type: string
          description: A unique identifier assigned to a specific fund account within the investment structure
          example: FundAccount1
        originalDepositAmount:
          type: number
          description: The initial amount deposited to the fund segment
          format: double
          example: 5.22
        originalDepositDate:
          type: string
          description: The date on which the original deposit was deposited into the fund segment.(date the segment created)
          format: date
          example: '2023-01-01'
        depositDate:
          type: string
          description: The date on which the additional deposit was deposited into the fund segment
          format: date
          example: '2023-01-01'
        depositAmount:
          type: number
          description: The additional amount deposited to the fund segment
          format: double
          example: 5.22
        currentAmount:
          type: number
          description: The value of the specific fund account segment, including all contributions, interest, and market changes
          format: double
          example: 161.81698
        renewalDate:
          type: string
          description: The date on which the segment may be renewed or reinvested
          format: date
          example: '2023-01-01'
        numberOfUnits:
          type: number
          description: The number of units allocated in the fund segment (applicable to variable investments).
          format: int32
          example: 50
        sweepAccountId:
          type: string
          description: The designated account where the segment funds will be transferred upon sweep,maturity
          example: EVGL002
        interestEarningAmount:
          type: number
          format: double
          description: This amount is used for Index interest calculation when Index crediting method is "averaging"
          example: 161.81698
        appliedInterestRate:
          type: number
          format: double
          description: The interest rate used to calculate interest amount for segment as of the last transaction
          example: 161.81698
        startingPrice:
          type: number
          format: double
          description: The initial market/index price or unit value when the segment was created
          example: 1234.21321
        startingPriceDate:
          type: string
          format: date
          description: Date of Starting Price to be used for Index
          example: '2023-01-01'
        endingPrice:
          type: number
          format: double
          description: The market/index price or unit value when the segment was matures/ends
          example: 2000.81698
        endingPriceDate:
          type: string
          format: date
          description: The date on which the ending price was determined
          example: '2023-01-01'
        indexChangeRate:
          type: number
          format: double
          description: The Index Change Rate refers to the rate of change in the value of an external market index (such as the S&P 500, Nasdaq, etc.) that is used to calculate interest credits for an indexed insurance or annuity product. It represents the percentage increase or decrease in the selected index over a defined crediting period, and directly influences the policy's credited interest or return.
          example: 2000.81698
        depositAnniversaryPrice:
          type: number
          format: double
          description: The index value of the High Water Mark indexed fund segment as of the current contract anniversary date. This value represents the recorded index price used for interest crediting purposes on the anniversary.  Calculated and returned by LPS during the Anniversary transaction. Applicable only to High Water Mark indexed fund segments.  Updated on each Anniversary transaction to reflect the most recent anniversary index value.
          example: 100.5
        depositAnniversaryPriceDate:
          type: string
          format: date
          description: The date corresponding to the anniversaryPrice value - representing the date on which the High Water Mark Index was recorded for the current contract anniversary. Always in sync with anniversaryPrice and updated together in the same Anniversary transaction
          example: '2023-01-01'
        startDate:
          type: string
          description: The date when the segment gets created
          format: date
          example: '2023-01-01'
        endDate:
          type: string
          description: The date when the segment matures/ends
          format: date
          example: '2023-01-01'
        maxPrice:
          type: number
          format: double
          description: Deprecated - kept for backward compatibility. Max Price = Max (IQ1, IQ2, IQ3, IQ4, …. IQN). where IQ1 denotes the index value at the 1st Quarterversary of the contract, IQ2 denotes the index value at the 2nd Quarterversary of the contract and so on and IQN denotes the index value at the end of the guarantee period (N=4*Guarantee period of the fund)
          example: 1234.21321
        maxPriceDate:
          type: string
          format: date
          description: Deprecated - kept for backward compatibility. The corresponding date of the determined Quarterversary
          example: '2023-01-01'
        rates:
          description: Array of rates associated with this fund segment
          type: array
          items:
            $ref: '#/components/schemas/Rate'
    ArrangementType:
      type: string
      enum:
      - PAYMENT
      - WITHDRAWAL
      - LOANREPAYMENT
      - REQUIREDMINIMUMDISTRIBUTION
      - PAYOUT
      - RIDERCLAIMWITHDRAWAL
