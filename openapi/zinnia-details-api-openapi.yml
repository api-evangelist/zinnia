    DeathBenefit:
      type: object
      properties:
        deathBenefitOption:
          $ref: '#/components/schemas/DeathBenefitOptionType'
        deathBenefitOptionEffectiveDate:
          type: string
          description: The Death Benefit Option Effective Date refers to the date when the selected death benefit option (Level, Increasing, or Return of Premium) officially takes effect in the policy. This date determines when the death benefit structure is set for payout upon the insured`s death
          format: date
          example: '2023-01-01'
        deathBenefitOptionChangedEffectiveDate:
          type: string
          description: The Change in Death Benefit Option (DBO) Effective Date refers to the date when a requested change in the death benefit option is processed and officially takes effect in the policy. This allows tracking of modifications between Level (Option A), Increasing (Option B), or Return of Premium (Option C) death benefit structures
          format: date
          example: '2023-01-01'
        deemedDeathBenefit:
          type: number
          description: Deemed Death Benefit refers to the minimum amount that must be considered the "death benefit" under an insurance contract as per IRS Section 7702(e)(1)(B). This is used for tax qualification purposes to ensure that a life insurance policy meets the statutory definition of life insurance (DLI) and retains its tax-advantaged status
          example: 12203.12
          format: double
        deathBenefitAgeGuarantee:
          type: number
          description: The Death Benefit Age Guarantee refers to the age until which the policy guarantees a death benefit, provided certain conditions such as premium payments and policy requirements are met. This guarantee ensures that the death benefit remains in force up to a specified age, regardless of market performance or policy cash value fluctuations
          format: int32
          example: 63
        disputedDebtAmount:
          type: number
          description: The Disputed Debt Amount refers to the total sum of all disbursement transactions processed on a life insurance policy between the insured`s Date of Death and the Date of Death Reported to the insurer. This amount may need to be reviewed and reconciled, as policy actions taken during this period may no longer be valid
          format: double
          example: 65068.27355
        deathBenefitInterest:
          type: number
          description: The Death Benefit Interest refers to the interest accrued on the life insurance death benefit amount from the insured’s Date of Death until the payment is made to the beneficiary. This interest is typically required by state regulations and compensates for the delay between the insured’s death and the claim settlement
          format: double
          example: 150.12241
        deathBenefitIndexCredit:
          type: number
          description: Partial index credit received as part of death benefit
          format: double
          example: 150.12241
        claimStatus:
          $ref: '#/components/schemas/ClaimStatus'
        proofOfDeathReceived:
          $ref: '#/components/schemas/ProofOfDeathReceived'
        remainingDeathBenefitPercentage:
          type: number
          description: The percentage of the beneficiary`s allocated share of the death benefit that remains to be paid after the policyowners death.
          format: double
          example: 75.5
