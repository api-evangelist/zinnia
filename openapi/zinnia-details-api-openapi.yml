      - DATEOFDEATHREPORTED
    CoverageBenefit:
      type: object
      properties:
        coverageId:
          type: string
          description: Coverage ID is a unique system-generated identifier assigned to a specific coverage component within an insurance or annuity policy. It is used to track and differentiate each distinct benefit, rider, or coverage layer under a single contract, especially when performing or recording transactions
          example: Base_Coverage
        netBenefitAmount:
          type: number
          description: Net Benefit Amount refers to the actual amount payable to a beneficiary or policyholder after all applicable deductions have been applied to the gross or base benefit amount. It represents the final disbursed value for a given coverage benefit, such as a claim payout, death benefit, or living benefit
          example: 12345.67
          format: double
        grossBenefitAmount:
          type: number
          format: double
          example: 12345.67
          description: Gross Benefit Amount refers to the total contractual benefit payable under a specific coverage or rider before any deductions are applied. It represents the original, full value of the benefit promised by the insurance policy (e.g., death benefit, living benefit, or rider payout).
        increaseInFaceAmount:
          type: number
          format: double
          example: 12345.67
          description: The amount by which a coverage's face amount is increased as a result of a Face Amount Change transaction (during face increase).
        decreaseInFaceAmount:
          type: number
          format: double
          example: 12345.67
          description: The amount by which a coverage's face amount is decreased as a result of a Face Amount Change transaction (during face decrease).
    ArrangementsMatchSegment:
      type: object
      properties:
        attributes:
          $ref: '#/components/schemas/ArrangementsMatchSegmentAttributes'
        financialActivity:
          $ref: '#/components/schemas/MatchSegmentFinancialActivity'
      required:
      - attributes
      - financialActivity
    Base:
      type: object
      properties:
        currentBase:
          type: number
          format: double
          example: 14.32
          description: Tracked againist Account Value and will be updated on every Anniversary Incremented by gross premiums and credit enhancements.  Set to Investment Value if rider is issed post contract issue.  Adjusted for withdrawals. Reset on Anniversaries
        ratchetBase:
          type: number
          format: double
          description: Tracked againist Account Value and will be updated on every Anniversary Incremented by gross premiums and credit enhancements.  Set to Investment Value if rider is issed post contract issue. Adjusted for withdrawals.  Reset on Anniversaries.
          example: 19.35
        growthBase:
          type: number
          format: double
          description: Incremented by gross premiums and credit enhancements. Set to Investment Value if rider is issed post contract issue. Adjusted for withdrawals. Reset on Anniversaries by crediting interest based on the interest rate in the Growth Factor Calculation equation box.
          example: 15.65
        deferralBonus:
          type: number
          format: double
          description: The Deferral Bonus is configured a percent of a Deferred Bonus Base. It is set to the value on Feature Change, Premium, Annual Processing, GMWB Interest Adjustment transactions
          example: 12.65
        deferralBonusBase:
          type: number
          format: double
          description: Captures the basis for calculating the Deferral Bonus.Base used to calculate the annual Deferral Bonus.  Parameters defined in the Deferral tab (GMWB). Incremented by gross premiums.  If GMDB feature added post issue, then set to Investment Value.  Adjusted for withdrawals.  Reset on Contract Anniversaries equal to the Deferral Bonus Base Reset equation box.  Stored in the Transaction Log table.
          example: 13.12
        simpleInterestBase:
          type: number
          format: double
          description: Incremented by gross premiums.  Initialized to the Investment Value if GMDB added post issue.  Adjusted for excess withdrawals.  Set to Investment Value on Spousal Continuation.
          example: 14.21
      required:
      - currentBase
      - ratchetBase
      - growthBase
      - deferralBonus
      - deferralBonusBase
      - simpleInterestBase
