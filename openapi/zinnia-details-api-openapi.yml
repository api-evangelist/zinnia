    PolicyMetricsAttributes:
      type: object
      properties:
        initialPaymentAmount:
          type: string
          example: '5000'
          description: Initial Payment Amount
        initialPremiumAppliedAmount:
          type: string
          example: '4800'
          description: The Initial Premium Applied Amount refers to the portion of the initial premium payment that is officially applied to the policy after processing. This amount determines when the policy becomes active and how funds are allocated within the contract
        initialPaymentAmountReceivedDate:
          type: string
          example: '2021-01-01'
          description: The Initial Premium Amount Received Date refers to the date when the insurance company`s home office officially receives the first premium payment for a life insurance policy or annuity contract. This date is crucial as it determines when the policy processing begins and may impact policy activation timelines
        grossPremiumAmountSinceIssue:
          type: string
          example: '7500'
          description: Gross Premium Amount Since Issue
        totalCumulativePremiumAmount:
          type: string
          example: '20000'
          description: Total Cumulative Premium Amount
        modifiedEndowmentContractAuthorizationIndicator:
          type: string
          example: 'YES'
          enum:
          - 'YES'
          - 'NO'
          description: MEC Authorization refers to the approval process required when a life insurance policy is classified as a Modified Endowment Contract (MEC). A MEC is a permanent life insurance policy that fails the IRS "7-Pay Test," resulting in different tax treatment of policy loans and withdrawals. MEC Authorization is typically required from the policyholder before processing transactions that could convert the policy into a MEC, ensuring they understand the tax consequences
        projectedLapseIndicator:
          type: string
          example: 'YES'
          enum:
          - 'YES'
          - 'NO'
          description: The Projected Lapse Indicator is a forecast that indicates whether a life insurance policy is expected to lapse within the next policy year based on its current account value, premium payments, cost of insurance (COI), and other policy charges
        policyGainAmount:
          type: string
          example: '3000'
          description: The Policy Gain Amount is the difference between the policy’s total account value and the cost basis. It represents the amount of gain that may be subject to taxation if withdrawn or surrendered
      required:
      - initialPaymentAmount
      - initialPremiumAppliedAmount
      - initialPaymentAmountReceivedDate
      - grossPremiumAmountSinceIssue
      - totalCumulativePremiumAmount
      - policyGainAmount
