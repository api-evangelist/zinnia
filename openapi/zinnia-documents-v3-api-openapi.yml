openapi: 3.2.0
info:
  title: Enterprise Documents Documents V3 API
  description: 'The Enterprise Document Service (EDS) API is the system of record for documents

    across the Zinnia life insurance and annuity platform.'
  version: 3.0.0
servers:
- url: https://dev.api.zinnia.io
  description: Dev Environment
- url: https://qa.api.zinnia.io
  description: QA Environment
- url: https://uat.api.zinnia.io
  description: UAT Environment
- url: https://api.zinnia.io
  description: PROD Environment
tags:
- name: Documents V3
  description: ''
paths:
  /document/v3/documents:
    post:
      security:
      - Auth0: []
      tags:
      - Documents V3
      summary: Uploads a document and saves its metadata
      description: Accepts a file with metadata and returns a document Id
      operationId: UploadDocuments
      parameters:
      - name: x-correlation-id
        in: header
        required: false
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              required:
              - metadata
              - file
              type: object
              properties:
                file:
                  type: string
                  format: binary
                metadata:
                  $ref: '#/components/schemas/Metadata'
      responses:
        '201':
          description: document stored successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentUploadResponse'
        '400':
          description: document storage failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentUploadBadRequest'
        '403':
          description: Unauthorized access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentUploadForbidden'
  /document/v3/documents/{documentId}:
    get:
      security:
      - Auth0: []
      tags:
      - Documents V3
      summary: Gets metadata for a document
      description: Fetches metadata details, including version history if requested
      operationId: getMetadataByDocumentId
      parameters:
      - name: Authorization
        required: true
        in: header
        example: Bearer <token>
        description: Authorization token
        schema:
          type: string
      - name: documentId
        in: path
        required: true
        schema:
          type: string
        description: Unique ID in EDS db
        example: 670e23dfab593b4387210b81
      - name: x-correlation-id
        in: header
        required: false
        schema:
          type: string
        description: Unique ID for correlating requests
        example: 1760f822-dcbf-49fc-a623-a1998383f4b9
      - name: isAllVersionsNeeded
        in: query
        required: false
        schema:
          type: boolean
          default: false
        description: Indicates if all versions are required in the response
        example: true
      - name: documentType
        in: query
        required: false
        description: Type of document indicating its purpose
        example: NB Application
        schema:
          type: string
      - name: documentClassification
        in: query
        required: false
        schema:
          type: string
          description: Classification of the document, e.g., OUTBOUND OR INBOUND
          example: OUTBOUND
          enum:
          - OUTBOUND
          - INBOUND
      - name: parentCarrierCode
        in: query
        required: false
        description: Client code associated with the document
        example: EVGL
        schema:
          type: string
      responses:
        '200':
          description: document metadata retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetadataByIdResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: docType should not be empty
                  statusCode:
                    type: integer
                    example: 400
                  correlationId:
                    type: string
                    example: 123e4567-e89b-12d3-a456-426614174000
                  success:
                    type: string
                    example: 'false'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Access denied for document metadata fetch
                  statusCode:
                    type: integer
                    example: 403
                  correlationId:
                    type: string
                    example: 123e4567-e89b-12d3-a456-426614174000
                  success:
                    type: string
                    example: 'false'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Document not found
                  statusCode:
                    type: integer
                    example: 404
                  correlationId:
                    type: string
                    example: 123e4567-e89b-12d3-a456-426614174000
                  success:
                    type: string
                    example: 'false'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Error occurred while fetching metadata
                  statusCode:
                    type: integer
                    example: 500
                  correlationId:
                    type: string
                    example: 123e4567-e89b-12d3-a456-426614174000
                  success:
                    type: string
                    example: 'false'
    put:
      security:
      - Auth0: []
      tags:
      - Documents V3
      summary: updates document content or metadata
      description: modifies metadata and optionally replaces the file
      operationId: updateDocuments
      parameters:
      - name: x-correlation-id
        in: header
        required: false
        schema:
          type: string
      - name: documentId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              required:
              - metadata
              type: object
              properties:
                file:
                  type: string
                  format: binary
                metadata:
                  $ref: '#/components/schemas/MetadataUpdate'
      responses:
        '204':
          description: Document updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  correlationId:
                    type: string
                    description: Unique ID for correlating requests
                    example: 123e4567-e89b-12d3-a456-426614174000
                  message:
                    type: string
                    example: Document updated successfully
                  statusCode:
                    type: integer
                    format: int32
                    example: 204
                  success:
                    type: boolean
                    example: true
        '400':
          description: Document update failed due to bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  correlationId:
                    type: string
                    example: 123e4567-e89b-12d3-a456-426614174000
                  message:
                    type: string
                    example: Invalid metadata provided
                  statusCode:
                    type: integer
                    format: int32
                    example: 400
                  success:
                    type: boolean
                    example: false
        '403':
          description: Unauthorized access
          content:
            application/json:
              schema:
                type: object
                properties:
                  correlationId:
                    type: string
                    example: 123e4567-e89b-12d3-a456-426614174000
                  message:
                    type: string
                    example: Access denied to update document
                  statusCode:
                    type: integer
                    format: int32
                    example: 403
                  success:
                    type: boolean
                    example: false
  /document/v3/documents/{documentId}/download:
    get:
      security:
      - Auth0: []
      tags:
      - Documents V3
      summary: Retrieves a document by ID
      description: Downloads a document based on its unique identifier
      operationId: downloadDocument-v3
      parameters:
      - name: Authorization
        required: true
        in: header
        example: Bearer <token>
        description: Authorization token
        schema:
          type: string
      - name: documentId
        in: path
        required: true
        description: Unique ID in EDS DB
        example: 670e23dfab593b4387210b81
        schema:
          type: string
      - name: x-correlation-id
        in: header
        required: false
        description: Unique ID for correlating requests
        example: 123e4567-e89b-12d3-a456-426614174000
        schema:
          type: string
      - name: documentClassification
        in: query
        required: false
        schema:
          type: string
          enum:
          - OUTBOUND
          - INBOUND
        description: Classification of the document, e.g., OUTBOUND or INBOUND
        example: OUTBOUND
      - name: parentCarrierCode
        in: query
        required: false
        description: Client code associated with the document
        example: EVGL
        schema:
          type: string
      - name: policyNumber
        in: query
        required: false
        description: Policy number associated with the document
        example: '23109168'
        schema:
          type: string
      - name: planCode
        in: query
        required: false
        description: Plan code
        example: '565'
        schema:
          type: string
      responses:
        '200':
          description: document downloaded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentDownloadResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Access denied for document download
                  statusCode:
                    type: integer
                    example: 403
                  correlationId:
                    type: string
                    example: 123e4567-e89b-12d3-a456-426614174000
                  success:
                    type: boolean
                    example: false
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Document not found
                  statusCode:
                    type: integer
                    example: 404
                  correlationId:
                    type: string
                    example: 123e4567-e89b-12d3-a456-426614174000
                  success:
                    type: boolean
                    example: false
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: An unexpected error occurred while downloading document
                  statusCode:
                    type: integer
                    example: 500
                  correlationId:
                    type: string
                    example: 123e4567-e89b-12d3-a456-426614174000
                  success:
                    type: boolean
                    example: false
  /document/v3/documents/search:
    post:
      security:
      - Auth0: []
      tags:
      - Documents V3
      summary: Searches for documents
      description: finds documents based on filters like document classification, document type, policy number etc
      operationId: searchDocuments
      parameters:
      - name: Authorization
        required: true
        in: header
        example: Bearer <token>
        description: Authorization token
        schema:
          type: string
      - name: limit
        in: query
        required: false
        example: 25
        description: Number of documents to be fetched. Max=1000
        schema:
          type: integer
          format: int32
          default: 10
          maximum: 1000
      - name: offset
        in: query
        required: false
        example: 1
        description: Offset value for pagination
        schema:
          type: integer
          format: int32
          default: 0
      - name: x-correlation-id
        in: header
        required: false
        description: Unique ID for correlating requests
        example: 123e4567-e89b-12d3-a456-426614174000
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
        required: true
      responses:
        '200':
          description: documents retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchDocumentResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Limit must be greater than 0.\nOffset cannot be negative.
                  statusCode:
                    type: integer
                    example: 400
                  correlationId:
                    type: string
                    example: 123e4567-e89b-12d3-a456-426614174000
                  success:
                    type: string
                    example: 'false'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Document access denied
                  statusCode:
                    type: integer
                    example: 403
                  correlationId:
                    type: string
                    example: 123e4567-e89b-12d3-a456-426614174000
                  success:
                    type: string
                    example: 'false'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: documents search failed
                  statusCode:
                    type: integer
                    example: 500
                  correlationId:
                    type: string
                    example: 123e4567-e89b-12d3-a456-426614174000
                  success:
                    type: string
                    example: 'false'
components:
  schemas:
    MetadataResponse:
      type: object
      properties:
        source:
          type: string
          description: Source system or origin of the document
          example: Email
        documentId:
          type: string
          description: Unique ID in EDS db
          example: 670e23dfab593b4387210b81
        formNumber:
          type: string
          description: Form number associated with the document
          example: FORM123
        fileType:
          type: string
          description: Type of file, e.g., pdf, doc, etc.
          example: pdf
        documentClassification:
          type: string
          description: Classification of the document, e.g., OUTBOUND or INBOUND
          example: OUTBOUND
          enum:
          - OUTBOUND
          - INBOUND
        documentType:
          type: string
          description: Type of document indicating its purpose
          example: NB Application
        documentCategory:
          type: string
          description: Category of the document, such as New Business or Claim
          example: New Business
        documentTypeDescription:
          type: string
          description: Description of the document type
          example: Deferred Annuity Application
        documentStatus:
          type: integer
          description: Indicates the current status of the document. '1' for ACTIVE, '0' for INACTIVE.
          format: int32
          example: 1
        version:
          type: string
          description: Version of the document
          example: '1'
        documentDate:
          type: string
          description: Date of the document
          format: date-time
          example: '2024-03-18T14:30:00.000Z'
        zinniaLiveCaseId:
          type: string
          description: Zinnia Live Case ID
          example: ZLC09876
        planCode:
          type: string
          description: Plan code
          example: '565'
        policyNumber:
          type: string
          description: Policy number associated with the document
          example: '23109168'
        brokerMasterNumber:
          type: string
          description: Broker master number associated with the document
          example: BKR123456
        repMasterNumber:
          type: string
          description: Representative master number associated with the document
          example: REP987654
        agentExternalID:
          type: string
          description: External ID of the agent associated with the document
          example: AGT12345
        brokerExternalID:
          type: string
          description: External ID of the broker associated with the document
          example: BRK12345
        mailTrackingNumber:
          type: string
          description: Mail tracking number
          example: TRK123456
        deliveryMethod:
          type: string
          description: Delivery method
          example: Email
        emailFrom:
          type: string
          description: Email address
          example: XHbN8@example.com
        emailTo:
          type: string
          description: Email address
          example: XHbN8@example.com
        emailSubject:
          type: string
          description: Email subject
          example: Deferred Annuity Application
        appId:
          type: string
          description: Application ID
          example: APP123456
        mailShipDate:
          type: string
          description: Mail ship date
          format: date-time
          example: '2024-03-18T14:30:00.000Z'
        participantAccountNumber:
          type: string
          description: Account number of the participant
          example: '123456789'
        sourceFileName:
          type: string
          description: Name of the file in source system
          example: files/123456.pdf
        displayName:
          type: string
          description: Display name of the document
          example: Deferred Annuity Application
        distributionChannel:
          type: string
          description: Distribution channel through which the document was delivered
          example: Online Portal
        periodYear:
          type: integer
          description: Year of the document period
          format: int32
          example: 2024
        periodQuarter:
          type: string
          description: Quarter of the document period in Q1-Q4 format
          example: Q2
        documentNumber:
          type: string
          description: Document number associated with the document (if present) else document Id
          example: 670e23dfab593b4387210b81 or 20241230-M-463066
        documentVersions:
          type: array
          description: Previous versions of the document
          items:
            $ref: '#/components/schemas/MetadataResponse'
        scenario:
          type: string
          description: Scenario
          example: duplicate
          enum:
          - duplicate
          - replace
        linkedDocumentId:
          type: string
          description: Linked document ID
          example: 693e23dfab593b4387210k92
        importDate:
          type: string
          format: date-time
          description: Document creation timestamp(in UTC timezone)
          example: '2024-09-23T10:30:00.000Z'
    DocumentUploadResponse:
      type: object
      properties:
        documentId:
          type: string
          description: Unique ID
          example: 670e23dfab593b4387210b81
        correlationId:
          type: string
          description: Unique ID for correlating requests
          example: 123e4567-e89b-12d3-a456-426614174000
        message:
          type: string
          description: Response message
          example: Document uploaded successfully
        statusCode:
          type: integer
          description: Status code of the response
          format: int32
          example: 200
        success:
          type: boolean
    MetadataSearchResponse:
      type: object
      properties:
        documentClassification:
          type: string
          description: Document classification to identify document type
          example: OUTBOUND
          enum:
          - OUTBOUND
          - INBOUND
        sourceFileName:
          type: string
          description: Actual name of the document
          example: 123456.pdf
        planCode:
          type: string
          description: Plan code associated with the document
          example: '235'
        documentStatus:
          type: integer
          description: Indicates the current status of the document. '1' for ACTIVE, '0' for INACTIVE.
          format: int32
          example: 1
        documentId:
          type: string
          description: Unique ID of the document
          example: 67124697f3bef2497b6accfb
        documentDate:
          type: string
          description: Date associated with the document
          format: date-time
        documentType:
          type: string
          description: Type of the document
          example: NB Application
        documentCategory:
          type: string
          description: Category of the document
          example: New Business
        documentTypeDescription:
          type: string
          description: Detailed description of the document type
          example: Deferred Annuity Application
        zinniaLiveCaseId:
          type: string
          description: Zinnia live case ID associated with the document
          example: ZLC09876
        appId:
          type: string
          description: Application ID related to the document
          example: XXXXEDJ041120240000000001
        mailTrackingNumber:
          type: string
          description: Tracking ID for the document
          example: '4453166346'
        policyNumber:
          type: string
          description: Policy number linked to the document
          example: '23576001'
        createDate:
          type: string
          description: Creation date of the document (in UTC timezone)
          format: date-time
          example: '2024-03-18T14:30:00.000Z'
        correlationId:
          type: string
          description: Correlation ID for the document
          example: 12345-corr-67890
        periodYear:
          type: integer
          description: Year related to the document period
          format: int32
          example: 2024
        periodQuarter:
          type: string
          description: Quarter related to the document period
          example: Q2
        fileType:
          type: string
          description: File type of the document
          example: pdf
        displayName:
          type: string
          description: Display name for the document
          example: New Business Policy Document
        brokerMasterNumber:
          type: string
          description: Master number of the broker associated with the document
          example: BKR123456
        repMasterNumber:
          type: string
          description: Master number of the representative associated with the document
          example: REP987654
        documentNumber:
          type: string
          description: Document number associated with the document (if present) else document Id
          example: 670e23dfab593b4387210b81 or 20241230-M-463066
        formNumber:
          type: string
          description: formNumber
          example: '1234'
        importDate:
          type: string
          format: date-time
          description: Document creation timestamp(in UTC timezone)
          example: '2024-09-23T10:30:00.000Z'
    DocumentDownloadResponse:
      type: object
      properties:
        fileExtension:
          type: string
          description: File extension of the document
          example: pdf
        fileName:
          type: string
          description: Name of the document
          example: NB Application
        binaryData:
          type: string
          description: Binary data of the document
          example: wdvb2ekllkk189w0enjansle..
        correlationId:
          type: string
          description: Unique ID for correlating requests
          example: 123e4567-e89b-12d3-a456-426614174000
    SearchDocumentResponse:
      type: object
      properties:
        count:
          type: integer
          description: Number of total documents found matching the search criteria
          format: int32
          example: 100
        documents:
          type: array
          items:
            $ref: '#/components/schemas/MetadataSearchResponse'
        correlationId:
          type: string
          description: Unique ID for correlating requests
          example: 123e4567-e89b-12d3-a456-426614174000
    Metadata:
      required:
      - docClassification
      - fileType
      - documentType
      - documentTypeDescription
      - docCategory
      type: object
      properties:
        zinniaLiveCaseId:
          type: string
          description: Zinnia Live Case ID. Either of policy number, Application Id or ZL case Id is required.
          example: ZLC09876
        appId:
          type: string
          description: Application ID. Either of policy number, Application Id or ZL case Id is required.
          example: EDJ041120240000000001
        docClassification:
          type: string
          description: Document classification to identify document type
          example: OUTBOUND
          enum:
          - OUTBOUND
          - INBOUND
        source:
          type: string
          description: Source of the document
          example: Email
        docCategory:
          type: string
          description: Document category
          example: NEW_BUSINESS
          enum:
          - NEW_BUSINESS
          - POST_ISSUE
          - DEATH
          - CORRESPONDENCE
          - AGENT
          - SUITABILITY
        fileType:
          type: string
          description: File type
          example: PDF
        documentType:
          type: string
          enum:
          - NB_STATE_REPLACEMENT
          - NB_CONVERSION
          - NB_APPLICATION
          - COST_DISCLOSURE
          - NON_CONTRACTUAL
          - AGENT_REPORT
          - ACCELERATED_BENEFIT_RIDER
          - SURRENDER_COMPARISION
          - CONSENT_PAPERLESS
          - TERMS_OF_USE
          - TERMS_CONDITIONS
          - CHARITY_ELECTION_FORMS
          - AUTHORIZATION_FORMS
          - HIPPA
          - HIV_CONSENT_FORM_ALL_STATE
          - AMENDMENT
          - DISCLOSURES
          - NB_STATE_REPLACEMENT_NOTICE
          - TRUSTEE_STATEMENT
          - TERMS_OF_USE
          - NOTICE_AND_CONSENT
          - PRIVACY_POLICY
          - GLBA_PRIVACY_NOTICE
          - FCRA
          - MIB_PRE_NOTICE
          - ID_VERIFICATION_NOTICE
          - HIPAA
          - ACCELERATED_BENEFIT_RIDER
          - BUYER_GUIDE
          - ILLUSTRATION
          - SUITABILITY
          - APPLICATION
          - SIGNED_APPLICATION
          - REPLACEMENTS_ACKNOWLEDGEMENT
          - 1035_EXCHANGE_SURRENDER
          - EVIDENCE_DOCUMENT
          - AMENDMENT
          - ELECTRONIC_FUNDS_TRANSFER
          - SUPPLEMENTAL_APPLICATION
          - CONFORMING_ILLUSTRATION
          - SIGNED_ILLUSTRATION
          - OVERFLOW_ADDITIONAL_INFORMATION
        documentDate:
          type: string
          description: Date of the document
          format: date-time
        documentTypeDescription:
          type: string
          description: Description of the document type. Refer the mapping sheet shared along with specification
          example: Address Change Letter
        planCode:
          type: string
          description: Plan code
          example: '235'
        policyNumber:
          type: string
          description: Policy number. Either of policy number, Application Id or ZL case Id is required.
          example: '23576001'
        pageCount:
          type: integer
          description: Total page count
          format: int64
          example: 5
        docAccessLevel:
          type: string
          description: Specifies who can access the document based on their role.
          example: CLIENT_COPY
          enum:
          - CLIENT_COPY
          - AGENT_COPY
        sourceFileName:
          type: string
          description: Source file name
          example: 052725FTADHOCLETTERS_R_20485_1207637_711.pdf
    DocumentUploadBadRequest:
      type: object
      properties:
        correlationId:
          type: string
          description: Unique ID for correlating requests
          example: 123e4567-e89b-12d3-a456-426614174000
        message:
          type: string
          description: Error message
          example: Invalid request payload
        statusCode:
          type: integer
          description: Status code of the response
          format: int32
          example: 400
        success:
          type: boolean
          example: false
    MetadataByIdResponse:
      type: object
      properties:
        metadata:
          $ref: '#/components/schemas/MetadataResponse'
        correlationId:
