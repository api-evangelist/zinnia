          type: string
          enum:
          - INDEXEDUNIVERSALLIFE
          - UNIVERSALLIFE
          - TERM
          - WHOLELIFE
          description: Type of insurance product
          example: INDEXEDUNIVERSALLIFE
        policyStatus:
          type: string
          enum:
          - APPLIEDFOR
          - APPROVED
          - SUBMITTEDTOUNDERWRITING
          - PENDING
          - DECLINED
          - QUOTED
          - RISKNOTACCEPTABLE
          - NOTTAKEN
          - PENDINGISSUED
          - ISSUED
          - CLOSED
          - CANCELLED
          - EXPIRED
          - CONVERSION
          description: Status of the policy
          example: ISSUED
        policyHoldingForm:
          type: string
          enum:
          - INDIVIDUAL
          - GROUP
          - JOINTINDIVIDUAL
          description: Policy holding form (Individual, Organization, or Trust)
          example: INDIVIDUAL
        policyEffectiveDate:
          type: string
          format: date
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
          description: Date (with pattern "yyyy-mm-dd")
          example: '2022-01-01'
        issueState:
          $ref: '#/components/schemas/State'
