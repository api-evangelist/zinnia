          $ref: '#/components/schemas/BirthState'
        birthCountry:
          $ref: '#/components/schemas/CountryV2'
        citizenCountry:
          $ref: '#/components/schemas/CountryV2'
    TrustDetails:
      type: object
      required:
      - trustName
      - trustDate
      - trustType
      - authorizedSigner
      properties:
        trustName:
          type: string
          description: Name of the trust
          example: Sunshine Family Trust
        trustType:
          type: string
          enum:
          - TESTAMENTARYTRUST
          - INTERVIVOSTRUST
          - INDIVIDUALTRUST
          - CORPORATETRUST
          - GRANTORTRUST
          description: Type of trust
          example: INDIVIDUALTRUST
        trustDate:
          type: string
          format: date
          description: Original date when the trust was established
          example: '2015-08-15'
        amendedTrustDate:
          type: string
          format: date
          description: Date of last amendment to the trust
          example: '2021-04-10'
        governingStateOfTrust:
          $ref: '#/components/schemas/State'
    ExclusionReview:
      type: object
      properties:
        description:
          type: string
          description: Result description
          example: Aviation Activities
        reasonCode:
          type: string
          enum:
          - AVIATION
          - SCUBA
          description: Reason code
          example: AVIATION
    ThirdPartyDesignee:
      type: object
      required:
      - partyId
      - partyType
      - partyRole
      - personalInformation
      properties:
        partyId:
          type: string
          description: Unique identifier for the party
          format: uuid
          example: 2ad51ecf-9923-437f-a6f0-70968e464cdb
        partyRole:
          type: string
          enum:
          - THIRDPARTYDESIGNEE
          description: Type of party role
          example: THIRDPARTYDESIGNEE
        partyType:
          type: string
          enum:
          - INDIVIDUAL
          - ORGANIZATION
          - TRUST
          description: Type of party
          example: INDIVIDUAL
        personalInformation:
          oneOf:
          - $ref: '#/components/schemas/TrustDetails'
          - $ref: '#/components/schemas/OrganizationDetails'
          - $ref: '#/components/schemas/PersonalInformationThirdParty'
        partyCommunication:
          type: string
          enum:
          - REGULARMAIL
          - EMAIL
          - PHONE
        identifiers:
          type: array
          items:
            anyOf:
            - $ref: '#/components/schemas/PassportIdentifier'
            - $ref: '#/components/schemas/StateIdIdentifier'
            - $ref: '#/components/schemas/DriversLicenseIdentifier'
            - $ref: '#/components/schemas/SsnIdentifier'
            - $ref: '#/components/schemas/ItinIdentifier'
            - $ref: '#/components/schemas/AlienRegistrationIdentifier'
            - $ref: '#/components/schemas/ExternalPartyIdentifier'
          description: Array of identifiers for this party
        address:
          type: object
          properties:
            preferredAddressId:
              type: string
              format: uuid
              example: 2ad51ecf-9923-437f-a6f0-70968e464cdb
            addresses:
              type: array
              items:
                $ref: '#/components/schemas/Address'
              description: List of addresses associated with this party
              example: []
        phoneNumber:
          type: object
          properties:
            preferredPhoneId:
              type: string
              format: uuid
              example: 2ad51ecf-9923-437f-a6f0-70968e464cdb
            phoneNumbers:
              type: array
              items:
                $ref: '#/components/schemas/PhoneNumber'
              description: List of phone numbers associated with this party
              example: []
        email:
          type: object
          properties:
            preferredEmailId:
              type: string
              format: uuid
              example: 2ad51ecf-9923-437f-a6f0-70968e464cdb
            emails:
              type: array
              items:
                $ref: '#/components/schemas/Email'
              description: List of emails associated with this party
              example: []
    ConversionPatch:
      type: object
      properties:
        type:
          type: string
          description: Identifies the type of  transaction being processed for a policy or application. This key helps categorize and route replacement or conversion cases appropriately within the systems.
          enum:
          - REPLACEMENT
          - NONREPLACEMENT
          - CONVERSION
          example: CONVERSION
        policyNumber:
          type: string
          description: Existing policy number
          example: '1234567890'
        productCode:
          type: string
          description: Product code for mentioned policy
          example: '1234567890'
        amount:
          type: number
          format: double
          description: Policy amount
          example: 100
        status:
          type: string
          enum:
          - ACTIVE
          - LAPSED
          - TERMINATED
          description: Policy status
          example: ACTIVE
        carrier:
          type: string
          description: Name of the ceeding carrier. It should be same as mentioned in the form.
          example: CarrierName_1
        issueDate:
          type: string
          format: date
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
          description: The official date on which the policy is issued and becomes effective.
          example: '2022-01-01'
        productType:
          type: string
          enum:
          - LIFE
          - ANNUITY
          description: Indicates the category of the insurance product associated with the policy
          example: ANNUITY
        tin:
          type: string
          description: Tax Id for given company
          example: '123456789'
        exchangeType:
          type: string
          enum:
          - EXTERNAL1035
          - INTERNAL1035
          - EXTERNALDIRECTTRANSFER
          - INTERNALDIRECTTRANSFER
          - EXTERNALROLLOVERQUALIFIED
          - INTERNALROLLOVERQUALIFIED
          - EXTERNALROTHROLLOVER
          - INTERNALROTHROLLOVER
          - EXTERNALROTHDIRECTTRANSFER
          - INTERNALROTHDIRECTTRANSFER
          - BENEFITPROCEEDS
          - CASHCONTRIBUTIONS
          - EXTERNAL1035PARTIAL
          - INTERNAL1035PARTIAL
          - EXTERNALDIRECTTRANSFERREPLACEMENT
          - INTERNALDIRECTTRANSFERREPLACEMENT
          - CLIENTINITIATEDTRANSFER
          - BIRTHORADOPTIONREPAYMENT
          description: Specifies the type of policy exchange or replacement transaction being performed.
          example: EXTERNAL1035
        addressDetail:
          $ref: '#/components/schemas/InsuranceHistoryAddressDetail'
        costBasis:
          type: number
          format: double
          description: The default value is 0.Represents the total amount of premiums paid or invested into the existing policy being replaced, excluding gains or interest.
        qualificationType:
          type: string
          enum:
          - IRA_REGULAR
          - IRA_SPOUSAL
          - IRA_ROLLOVER
          - ROTH_IRA
          - CUSTODIAL_IRA
          - CUSTODIAL_ROTH_IRA
          - CUSTODIAL_ROLLOVER_IRA
          - SEP_IRA
          - INHERITED_IRA
          - INHERITED_ROTH_IRA
          - NQ_STRETCH
          - 403B
          - NON_QUALIFIED
          - IRA_SIMPLE
          - Q401K
          - Q401A
          - Q457B
          - PENSION_PLAN
          description: Indicates the tax qualification status of the policy or account.
          example: IRA_REGULAR
        mecIndicator:
          type: boolean
          description: '- Indicates whether the policy is classified as a Modified Endowment Contract (MEC) or not

            - Default = False

            '
          example: false
        restrictionIndicator:
          type: boolean
          description: Indicates if there is a collateral assignee on existing policy.Default = False.
          example: false
    DriversLicenseIdentifier:
