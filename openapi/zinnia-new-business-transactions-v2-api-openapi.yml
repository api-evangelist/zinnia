          type: array
          items:
            $ref: '#/components/schemas/RiderDetail'
          description: List of riders details
        feature:
          type: object
          properties:
            type:
              type: string
              enum:
              - SURPLUSDISTRIBUTION
              example: SURPLUSDISTRIBUTION
            subType:
              type: string
              enum:
              - PAIDUPADDITION
              - CASH
              example: PAIDUPADDITION
            discounts:
              type: array
              items:
                type: string
                enum:
                - MULTIPRODUCT
                - NON
                description: Type of discount
                example: MULTIPRODUCT
          allOf:
          - $ref: '#/components/schemas/NonforfeitureOption'
          - type: object
            properties:
              customFeatures:
                type: array
                items:
                  type: string
                enum:
                - CONTROLBUSINESSINDICATOR
                - MULTIPLEPOLICYDISCOUNT
                description: Custom features
        fundDetails:
          type: array
          items:
            type: object
            properties:
              fundType:
                type: string
                enum:
                - FIXED
                - INDEXED
                - VARIABLE
                description: Type of fund
                example: FIXED
              fundName:
                type: string
