    NonReplacement:
      type: object
      required:
      - type
      - policyNumber
      - status
      - amount
      - carrier
      - productType
      properties:
        type:
          type: string
          description: Identifies the type of  transaction being processed for a policy or application. This key helps categorize and route replacement or conversion cases appropriately within the systems.
          enum:
          - REPLACEMENT
          - NONREPLACEMENT
          - CONVERSION
          example: NONREPLACEMENT
        useExistingPolicyFunds:
          type: boolean
          description: Use funds from existing policies
          example: true
        policyNumber:
          type: string
          description: Existing policy number
          example: '1234567890'
        productCode:
          type: string
          description: Product code for mentioned policy
          example: '1234567890'
        amount:
          type: number
          format: double
          description: Policy amount
          example: 100
        status:
          type: string
          enum:
          - ACTIVE
          - LAPSED
          - TERMINATED
          description: Policy status
          example: ACTIVE
        replacementCoverageAmount:
          type: number
          format: double
          description: Represents the anticipated cash value expected to be transferred from the existing policy being replaced.
          example: 100
        carrier:
          type: string
          description: Name of the ceeding carrier. It should be same as mentioned in the form.
          example: CarrierName_1
        issueDate:
          type: string
          format: date
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
          description: The official date on which the policy is issued and becomes effective.
          example: '2022-01-01'
        policyEffectiveDate:
          type: string
          format: date
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
          description: Date (with pattern "yyyy-mm-dd")
          example: '2022-01-01'
        productType:
          type: string
          enum:
          - LIFE
          - ANNUITY
          description: Indicates the category of the insurance product associated with the policy
          example: ANNUITY
        tin:
          type: string
          description: Tax Id for given company
          example: '123456789'
        exchangeType:
          type: string
          enum:
          - EXTERNAL1035
          - INTERNAL1035
          - EXTERNALDIRECTTRANSFER
          - INTERNALDIRECTTRANSFER
          - EXTERNALROLLOVERQUALIFIED
          - INTERNALROLLOVERQUALIFIED
          - EXTERNALROTHROLLOVER
          - INTERNALROTHROLLOVER
          - EXTERNALROTHDIRECTTRANSFER
          - INTERNALROTHDIRECTTRANSFER
          - BENEFITPROCEEDS
          - CASHCONTRIBUTIONS
          - EXTERNAL1035PARTIAL
          - INTERNAL1035PARTIAL
          - EXTERNALDIRECTTRANSFERREPLACEMENT
          - INTERNALDIRECTTRANSFERREPLACEMENT
          - CLIENTINITIATEDTRANSFER
          - BIRTHORADOPTIONREPAYMENT
          description: Specifies the type of policy exchange or replacement transaction being performed.
          example: EXTERNAL1035
        addressDetail:
          $ref: '#/components/schemas/InsuranceHistoryAddressDetail'
        costBasis:
          type: number
          format: double
          description: The default value is 0.Represents the total amount of premiums paid or invested into the existing policy being replaced, excluding gains or interest.
        qualificationType:
          type: string
          enum:
          - IRA_REGULAR
          - IRA_SPOUSAL
          - IRA_ROLLOVER
          - ROTH_IRA
          - CUSTODIAL_IRA
          - CUSTODIAL_ROTH_IRA
          - CUSTODIAL_ROLLOVER_IRA
          - SEP_IRA
          - INHERITED_IRA
          - INHERITED_ROTH_IRA
          - NQ_STRETCH
          - 403B
          - NON_QUALIFIED
          - IRA_SIMPLE
          - Q401K
          - Q401A
          - Q457B
          - PENSION_PLAN
          description: Indicates the tax qualification status of the policy or account.
          example: IRA_REGULAR
        mecIndicator:
          type: boolean
          description: '- Indicates whether the policy is classified as a Modified Endowment Contract (MEC) or not

            - Default = False

            '
          example: false
        replacementType:
          type: string
          enum:
          - PARTIAL
          - FULL_SURRENDER
          description: Policy replacement type
          example: PARTIAL
        exchangeDate:
          type: string
          format: date
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
          description: Date on which the old policy is replaced by the new one.
          example: '2022-01-01'
        existingLifeInsuranceIndicator:
          type: boolean
          description: Indicates if there is existing life insurance policies.
          default: false
          example: false
