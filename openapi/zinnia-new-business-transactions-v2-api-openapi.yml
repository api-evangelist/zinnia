      type: object
      required:
      - type
      - policyNumber
      - carrier
      properties:
        type:
          type: string
          description: Identifies the type of  transaction being processed for a policy or application. This key helps categorize and route replacement or conversion cases appropriately within the systems.
          enum:
          - REPLACEMENT
          - NONREPLACEMENT
          - CONVERSION
          example: CONVERSION
        policyNumber:
