openapi: 3.2.0
info:
  title: Zinnia New Business API. New Business Transactions V2 API
  description: Enterprise API for New Business.
  version: 0.9.8
  contact:
    name: Zinnia New Business Life
    email: hitesh.parakh@zinnia.com
  x-changelog:
  - date: '2025-07-14'
    change: CMW-30141 - Added EIN Identifier and additional enums in Suffix
  - date: '2025-07-15'
    change: CMW-30141 - Added additional enums in entity type
  - date: '2025-08-01'
    change: CMW-30429 - Added new enum values in documentType(NB_STATE_REPLACEMENT, NB_CONVERSION)
  - date: '2025-08-01'
    change: CMW-29832 - Changed insuredHistory to policyHistory and updated the hierarchy of the policyHistory
  - date: '2025-09-25'
    change: CMW-29118 - Updated missing key in Beneficiary Role (birthSex)
  - date: '2025-11-18'
    change: CMW-32740 - Update BPM API to Support Additional File Types (JPEG, JPG, PNG)
  - date: '2025-11-27'
    change: CMW-32606 - Expose Health Check Endpoint Publicly Through Kong for New Business - Life
  - date: '2025-11-29'
    change: CMW-32446 - Expose Interim Status Update Endpoint On Kong - Life
  - date: '2025-12-08'
    change: CMW-33682 - Expose Case Export Endpoint On Kong - Life
  - date: '2026-02-18'
    change: CMW-35259 - Added replacementLtcIndicator to all Everly Workflows
  - date: '2026-04-20'
    change: ZNBA-209 - Introduced new enum to support Whole Life products
servers:
- url: https://qa.api.zinnia.io
  description: QA Environment
- url: https://dev.api.zinnia.io
  description: DEV Environment
- url: https://uat.api.zinnia.io
  description: UAT Environment
- url: https://api.zinnia.io
  description: PROD Environment
tags:
- name: New Business Transactions V2
  description: New Business Orchestration Services Version 2
paths:
  /newbusiness/v2/application/{eAppId}:
    post:
      tags:
      - New Business Transactions V2
      summary: Create case for New Business
      parameters:
      - name: eAppId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        description: Required to submit case before submit new business documents / application
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCaseRequest'
        required: true
      responses:
        '201':
          description: Case Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseSuccessResponse'
              examples:
                NewBusiness:
                  value:
                    caseId: CA000000456
                    correlationId: 2ad51ecf-9923-437f-a6f0-70968e464cdb
                    eappId: 2ad51ecf-9923-437f-a6f0-70968e464cdb
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'
        '401':
          description: Authentication failed
          content:
            application/json:
              examples:
                NewBusiness:
                  value:
                    message: Unauthorized
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
      security:
      - Auth0: []
      x-kong-plugin-pre-function:
        config:
          access:
          - 'local path = kong.request.get_path()

            kong.service.request.set_path("/bpm" .. path)

            '
      operationId: postNewbusinessV2ApplicationByEAppId
      x-operation-id-source: derived
    put:
      tags:
      - New Business Transactions V2
      summary: Submit application for New Business
      operationId: submitPolicyDetails
      parameters:
      - name: Authorization
        required: true
        description: This will be passed as Bearer plus "token" as generated by above token API.
        in: header
        schema:
          type: string
        example: Bearer eykjsfjfjasdasdad
      - name: eAppId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        description: Details required to be submitted for Policy generation.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicySubmissionRequest'
        required: true
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicySubmissionResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'
        '401':
          description: Authentication failed
          content:
            application/json:
              examples:
                NewBusiness:
                  value:
                    message: Unauthorized
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceNotFoundResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
      security:
      - Auth0: []
      x-kong-plugin-pre-function:
        config:
          access:
          - 'local path = kong.request.get_path()

            kong.service.request.set_path("/bpm" .. path)

            '
    patch:
      tags:
      - New Business Transactions V2
      summary: Update application for New Business
      operationId: updateEApp
      parameters:
      - name: Authorization
        required: true
        description: This will be passed as Bearer plus "token" as generated by above token API.
        in: header
        schema:
          type: string
        example: Bearer eykjsfjfjasdasdad
      - name: eAppId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        description: Details required to be submitted for Policy generation.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicySubmissionUpdate'
        required: true
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicySubmissionResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'
        '401':
          description: Authentication failed
          content:
            application/json:
              examples:
                NewBusiness:
                  value:
                    message: Unauthorized
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceNotFoundResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
      security:
      - Auth0: []
      x-kong-plugin-pre-function:
        config:
          access:
          - 'local path = kong.request.get_path()

            kong.service.request.set_path("/bpm" .. path)

            '
    get:
      tags:
      - New Business Transactions V2
      summary: Get New Business application
      operationId: GetEApp
      parameters:
      - name: Authorization
        required: true
        description: This will be passed as Bearer plus "token" as generated by above token API.
        in: header
        schema:
          type: string
        example: Bearer eykjsfjfjasdasdad
      - name: eAppId
        in: path
        required: true
        schema:
          type: string
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'
        '401':
          description: Authentication failed
          content:
            application/json:
              examples:
                NewBusiness:
                  value:
                    message: Unauthorized
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceNotFoundResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
      security:
      - Auth0: []
      x-kong-plugin-pre-function:
        config:
          access:
          - 'local path = kong.request.get_path()

            kong.service.request.set_path("/bpm" .. path)

            '
  /newbusiness/v2/application/{eAppId}/document:
    post:
      tags:
      - New Business Transactions V2
      summary: Submit documents for New Business
      parameters:
      - name: eAppId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        description: Required to submit documents before submit new business application
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentRequest'
        required: true
      responses:
        '201':
          description: Document Persisted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentSuccessResponse'
              examples:
                Document:
                  value:
                    caseId: CA000000456
                    correlationId: 2ad51ecf-9923-437f-a6f0-70968e464cdb
                    eappId: 2ad51ecf-9923-437f-a6f0-70968e464cdb
                    documentId: 67334f4882c412621f9ab7cc
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'
        '401':
          description: Authentication failed
          content:
            application/json:
              examples:
                NewBusiness:
                  value:
                    message: Unauthorized
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
      security:
      - Auth0: []
      x-kong-plugin-pre-function:
        config:
          access:
          - 'local path = kong.request.get_path()

            kong.service.request.set_path("/bpm" .. path)

            '
      operationId: postNewbusinessV2ApplicationByEAppIdDocument
      x-operation-id-source: derived
components:
  schemas:
    illustrationDetailsPatch:
      type: object
      properties:
        leadId:
          type: string
          description: Associated lead identifier
          example: L12345
        riskClass:
          type: string
          enum:
          - ULTRANONTOBACCO
          - ELITENONTOBACCO
          - PREFERREDNONTOBACCO
          - STANDARDNONTOBACCO
          - STANDARDTOBACCO
          - STANDARDAGGREGATE
          - SUBSTANDARDNONTOBACCO
          - SUBSTANDARDTOBACCO
          - STANDARDPLUSNONTOBACCO
          - PREFERREDTOBACCO
          - STANDARDCONVERSIONNONTOBACCO
          - STANDARDCONVERSIONTOBACCO
          description: Risk classification for the quote
          example: ULTRANONTOBACCO
        email:
          type: string
          format: email
          description: Contact email for the quote
          example: tKU3e@example.com
        state:
          $ref: '#/components/schemas/State'
        faceAmount:
          type: number
          nullable: true
          format: double
          minimum: 0
          description: Face amount of the policy
          example: 100
        premiumAmount:
          type: number
          nullable: true
          format: double
          minimum: 0
          description: Premium amount
          example: 100
        paymentTerm:
          type: string
          description: Term of payment
          example: MONTHLY
        premiumFrequency:
          type: string
          enum:
          - DAILY
          - EVERYTWOWEEKS
          - MONTHLY
          - SEMIANNUAL
          - QUARTERLY
          - ANNUAL
          - SINGLEPAYMENT
          description: Frequency of premium payments
          example: MONTHLY
        dateOfBirth:
          type: string
          format: date
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
          description: Date (with pattern "yyyy-mm-dd")
          example: '1990-01-01'
        ageAsOfDate:
          type: string
          format: date
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
          description: Date (with pattern "yyyy-mm-dd")
          example: '2022-01-01'
        gender:
          type: string
          enum:
          - MALE
          - FEMALE
          - OTHER
          description: Gender of the insured
          example: MALE
        smoker:
          type: boolean
          nullable: true
          description: Smoking status
          example: false
        health:
          type: string
          description: General health status
          example: Good
        underwritingMethod:
          type: string
          enum:
          - FULL_UNDERWRITING
          - SIMPLIFIED_ISSUE
          - GUARANTEED_ISSUE
          description: Method of underwriting
          example: SIMPLIFIED_ISSUE
        issueAge:
          type: string
          description: Age at policy issuance
          example: '25'
        quoteDate:
          type: string
          format: date-time
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]+)?(Z|[+-][0-9]{2}:[0-9]{2})$
          description: Date and time in ISO-8601 format (YYYY-MM-DDTHH:mm:ss.sssZ)
          example: '2022-01-01T00:00:00.000Z'
        cashValue:
          type: number
          nullable: true
          format: double
          description: Cash value of the policy
          example: 1000
        success:
          type: boolean
          nullable: true
          description: Quote generation success indicator
          example: true
        annualIncome:
          type: number
          nullable: true
          format: double
          minimum: 0
          description: Annual income of the insured
          example: 10000
        annualPolicyMgmtFee:
          type: number
          nullable: true
          format: double
          minimum: 0
          description: Annual policy management fee
          example: 100
        additionalPaymentAmount:
          type: number
          nullable: true
          format: double
          minimum: 0
          description: Additional payment amount if any
          example: 100
        pricingVersion:
          type: string
          description: Version of pricing engine used
          example: '1.0'
        matchVersion:
          type: string
          description: Version of matching algorithm used
          example: '1.0'
        matchPercent:
          type: integer
          nullable: true
          minimum: 0
          maximum: 100
          description: Percentage match for the quote
          example: 90
        averageMonthlyCOI:
          type: number
          nullable: true
          format: double
          minimum: 0
          description: Average monthly cost of insurance
          example: 100
        firstMonthCOI:
          type: number
          nullable: true
          format: double
          minimum: 0
          description: First month's cost of insurance
          example: 100
        adminFee:
          type: number
          nullable: true
          format: double
          minimum: 0
          description: Administrative fee
          example: 10
        firstMonthSavings:
          type: number
          nullable: true
          format: double
          description: First month's savings
          example: 0
        monthlySavings:
          type: object
          required:
          - minSavings
          - maxSavings
          - targetSavings
          properties:
            minSavings:
              type: number
              nullable: true
              format: double
              description: Minimum monthly savings
              example: 0
            maxSavings:
              type: number
              nullable: true
              format: double
              description: Maximum monthly savings
              example: 10000
            targetSavings:
              type: number
              nullable: true
              format: double
              description: Target monthly savings
              example: 5000
        quoteQuestions:
          type: array
          items:
            type: object
            required:
            - id
            - code
            properties:
              id:
                type: string
                description: Question identifier
                example: '1234567890'
              code:
                type: string
                description: Question code
                example: '1234567890'
              description:
                type: array
                items:
                  type: string
                description: Question descriptions
                example:
                - Option 1
                - Option 2
                - Option 3
