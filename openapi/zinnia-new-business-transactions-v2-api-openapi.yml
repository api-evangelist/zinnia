          type: string
          enum:
          - ACTIVE
          - LAPSED
          - TERMINATED
          description: Policy status
          example: ACTIVE
        carrier:
          type: string
          description: Name of the ceeding carrier. It should be same as mentioned in the form.
          example: CarrierName_1
        issueDate:
          type: string
          format: date
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
          description: The official date on which the policy is issued and becomes effective.
          example: '2022-01-01'
        productType:
          type: string
          enum:
          - LIFE
          - ANNUITY
          description: Indicates the category of the insurance product associated with the policy
          example: ANNUITY
        tin:
          type: string
          description: Tax Id for given company
          example: '123456789'
        exchangeType:
          type: string
          enum:
          - EXTERNAL1035
          - INTERNAL1035
          - EXTERNALDIRECTTRANSFER
          - INTERNALDIRECTTRANSFER
          - EXTERNALROLLOVERQUALIFIED
          - INTERNALROLLOVERQUALIFIED
          - EXTERNALROTHROLLOVER
          - INTERNALROTHROLLOVER
          - EXTERNALROTHDIRECTTRANSFER
          - INTERNALROTHDIRECTTRANSFER
          - BENEFITPROCEEDS
          - CASHCONTRIBUTIONS
          - EXTERNAL1035PARTIAL
          - INTERNAL1035PARTIAL
          - EXTERNALDIRECTTRANSFERREPLACEMENT
          - INTERNALDIRECTTRANSFERREPLACEMENT
