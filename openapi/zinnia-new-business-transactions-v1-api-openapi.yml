openapi: 3.2.0
info:
  title: Zinnia New Business API. New Business Transactions V1 API
  description: Enterprise API for New Business.
  version: 0.9.8
  contact:
    name: Zinnia New Business Life
    email: hitesh.parakh@zinnia.com
  x-changelog:
  - date: '2025-07-14'
    change: CMW-30141 - Added EIN Identifier and additional enums in Suffix
  - date: '2025-07-15'
    change: CMW-30141 - Added additional enums in entity type
  - date: '2025-08-01'
    change: CMW-30429 - Added new enum values in documentType(NB_STATE_REPLACEMENT, NB_CONVERSION)
  - date: '2025-08-01'
    change: CMW-29832 - Changed insuredHistory to policyHistory and updated the hierarchy of the policyHistory
  - date: '2025-09-25'
    change: CMW-29118 - Updated missing key in Beneficiary Role (birthSex)
  - date: '2025-11-18'
    change: CMW-32740 - Update BPM API to Support Additional File Types (JPEG, JPG, PNG)
  - date: '2025-11-27'
    change: CMW-32606 - Expose Health Check Endpoint Publicly Through Kong for New Business - Life
  - date: '2025-11-29'
    change: CMW-32446 - Expose Interim Status Update Endpoint On Kong - Life
  - date: '2025-12-08'
    change: CMW-33682 - Expose Case Export Endpoint On Kong - Life
  - date: '2026-02-18'
    change: CMW-35259 - Added replacementLtcIndicator to all Everly Workflows
  - date: '2026-04-20'
    change: ZNBA-209 - Introduced new enum to support Whole Life products
servers:
- url: https://qa.api.zinnia.io
  description: QA Environment
- url: https://dev.api.zinnia.io
  description: DEV Environment
- url: https://uat.api.zinnia.io
  description: UAT Environment
- url: https://api.zinnia.io
  description: PROD Environment
tags:
- name: New Business Transactions V1
  description: New Business Orchestration Services Version 1
paths:
  /bpm/newbusiness/v1/policy-decision:
    post:
      x-internal: true
      tags:
      - New Business Transactions V1
      summary: Policy Decision Processing
      operationId: submitPolicyDecisionPayload
      requestBody:
        description: Details require to proceed further with tpp decision
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyDecisionRequest'
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'
        '401':
          description: Authentication failed
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
      security:
      - Auth0: []
  /bpm/newbusiness/v1/evidence-request:
    post:
      x-internal: true
      tags:
      - New Business Transactions V1
      summary: Evidence Request
      operationId: evidenceRequest
      requestBody:
        description: Additional evidence requested from TPP to PG.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TppEvidenceRequest'
        required: true
      responses:
        '201':
          description: Case Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'
        '401':
          description: Authentication failed
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
      security:
      - Auth0: []
  /bpm/newbusiness/v1/interim-status-update:
    post:
      x-internal: true
      tags:
      - New Business Transactions V1
      summary: Submit interim status update
      operationId: submitInterimStatusUpdate
      requestBody:
        description: Details required to submit interim status to PG
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InterimStatusUpdateRequest'
        required: true
      responses:
        '201':
          description: Case Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'
        '401':
          description: Authentication failed
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
      security:
      - Auth0: []
  /bpm/newbusiness/v1/application-validation:
    post:
      tags:
      - New Business Transactions V1
      summary: Create Underwriting Case
      operationId: createUnderwritingCase
      requestBody:
        description: Details required to initiate the underwriting process and initial validation
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationData'
        required: true
      responses:
        '201':
          description: Case Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'
        '401':
          description: Authentication failed
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
      security:
      - Auth0: []
  /bpm/newbusiness/v1/underwriting-submission:
    post:
      tags:
      - New Business Transactions V1
      summary: Underwriting Processing
      operationId: submitUnderwritingPayload
      requestBody:
        description: Details require to proceed further with underwriting process
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnderwritingRequest'
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'
        '401':
          description: Authentication failed
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
      security:
      - Auth0: []
  /bpm/newbusiness/v1/evidence-submission:
    post:
      tags:
      - New Business Transactions V1
      summary: Receive additional information from UI in response to Underwriter's request
      requestBody:
        description: Required to submit additional details to Underwriting System.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvidenceResponse'
        required: true
      responses:
        '201':
          description: Case Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              examples:
                NewBusiness:
                  value:
                    caseId: cde717c9-5f7e-4c63-953c-ef50e44c021a
                    carrier: CarrierName_1
                    process: NewBusiness
                    caseStatus: Open
                    correlationId: 2ad51ecf-9923-437f-a6f0-70968e464cdb
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'
        '401':
          description: Authentication failed
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
      security:
      - Auth0: []
      operationId: postBpmNewbusinessV1EvidenceSubmission
      x-operation-id-source: derived
  /bpm/newbusiness/v1/application-submission:
    post:
      tags:
      - New Business Transactions V1
      summary: Submit application details
      operationId: submitApplicationDetails
      parameters:
      - name: Authorization
        required: true
        description: This will be passed as Bearer plus "token" as generated by above token API.
        in: header
        schema:
          type: string
        example: Bearer eykjsfjfjasdasdad
      requestBody:
        description: Details required for to submit the decisions to UI
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitPolicy'
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'
        '401':
          description: Authentication failed
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceNotFoundResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
      security:
      - Auth0: []
  /bpm/newbusiness/v1/agent-validation:
    post:
      tags:
      - New Business Transactions V1
      summary: Validate agent details
      operationId: validateAgentDetails
      parameters:
      - name: Authorization
        required: true
        description: This will be passed as Bearer plus "token" as generated by above token API.
        in: header
        schema:
          type: string
        example: Bearer eykjsfjfjasdasdad
      requestBody:
        description: Details required to validate agent
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentValidationRequest'
        required: true
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentValidationSuccessResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'
        '401':
          description: Authentication failed
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceNotFoundResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
      security:
      - Auth0: []
components:
  schemas:
    ValidationResponse:
      type: object
      properties:
        status:
          type: string
          example: FAILED
        timestamp:
          type: string
          format: date-time
        message:
          type: string
          example: Bad Request
        error:
          type: array
          items:
            type: string
            example: Mandatory attribute label missing
    UnderwritingRequest:
      type: object
      properties:
        eappId:
          type: string
          description: Unique application Id geenrated by the UI. Each application would have unique identifier
          example: 15ea7582-262f-4dfe-8a60-1e8b8e763fd4
        caseId:
          type: string
          description: Zinnia Live case
          example: CA0000005656
        correlationId:
          type: string
          description: Unique process identifier to track the all linked processed against one single application. This is an optional
          example: 2ad51ecf-9923-437f-a6f0-70968e464cdb
        carrier:
          type: string
          example: CarrierName1
        customerId:
          type: string
          description: We get the customer Id as part of application request to support older products.
          example: 0017b0000102A1UAAU
        idpUserId:
          type: string
          example: abc
        appStartDate:
          type: string
          format: date-time
          description: Date (with pattern "yyyy-MM-dd'T'HH:mm:ss'Z'"). Application start date
        actionType:
          type: string
          enum:
          - Create
          - Update
          - Submit
          description: To update the application, actionType would be - Update
          example: Update
        policyStatus:
          type: string
          enum:
          - Applied For
          - Approved
          - Submitted to Underwriting
          - Pending
          - Declined
          - Quoted
          - Risk Not Acceptable
          - Proposed
          - Counter Offer
          - Not Taken
          - Issue Pending
          - Issued
          - Closed
          - Active
          - Lapsed
          - Cancelled Not Taken
          - Lapse Pending
          - Cancelled FreeLook
          - Cancelled
          - Offer Accepted
          - Death Claim Pending
          - Death Claim Paid
          - Expired
          - Matured
          - Surrendered
          - Rescission
          - Death Claim Approved
          - Suspended Active
          - Suspended Not Active
          description: Status of the policy. It should be - Issued in order to issue the policy
          example: Issued
        appSubmissionType:
          type: string
          enum:
          - Internet
          - Electronic
          - Handwritten
          description: Submission method of the application
          example: Electronic
        policyHoldingForm:
          type: string
          enum:
          - Individual
          description: Holding Form. It should always be Individual.
          example: Individual
        policyHoldingStatus:
          type: string
          enum:
          - Proposed
          - Active
          description: Holding Status
          example: Proposed
        consentInd:
          type: string
          enum:
          - 'Yes'
          - 'No'
          description: Consent Indicator Value. Whether the user has provided the consent for this policy or not. This value is used by the underwriting system.
        appState:
          type: string
          enum:
          - AL
          - AK
          - AZ
          - AR
          - CA
          - CO
          - CT
          - DC
          - DE
          - FL
          - GA
          - HI
          - ID
          - IL
          - IN
          - IA
          - KS
          - KY
          - LA
          - ME
          - MD
          - MA
          - MI
          - MN
          - MS
          - MO
          - MT
          - NE
          - NV
          - NH
          - NJ
          - NM
          - NY
          - NC
          - ND
          - OH
          - OK
          - OR
          - PA
          - RI
          - SC
          - SD
          - TN
          - TX
          - UT
          - VT
          - VA
          - WA
          - WV
          - WI
          - WY
          - GU
          - PR
          description: State Code
          example: AL
        consentIndState:
          type: string
          enum:
          - AL
          - AK
          - AZ
          - AR
          - CA
          - CO
          - CT
          - DC
          - DE
          - FL
          - GA
          - HI
          - ID
          - IL
          - IN
          - IA
          - KS
          - KY
          - LA
          - ME
          - MD
          - MA
          - MI
          - MN
          - MS
          - MO
          - MT
          - NE
          - NV
          - NH
          - NJ
          - NM
          - NY
          - NC
          - ND
          - OH
          - OK
          - OR
          - PA
          - RI
          - SC
          - SD
          - TN
          - TX
          - UT
          - VT
          - VA
          - WA
          - WV
          - WI
          - WY
          description: Consented state value
        consentSubmissionType:
          type: string
          enum:
          - Internet
          - Electronic
          - Handwritten
          description: Consented submission method of the application
          example: Electronic
        appFormNumber:
          type: string
          description: Form number if applicable. The number assigned on the application form.
          example: ICC20 ABC 104_08-20
        appVersionNumber:
          type: string
          description: Form version number if applicable
          example: ICC20 ABC 104_08-20
        pageLastVisitedId:
          type: string
          description: User Id who has accessed this page last time.
        appLastUpdated:
          type: string
          format: date-time
          description: Date (with pattern "yyyy-MM-dd'T'HH:mm:ss'Z'"). Application last update date.
        appExpirationDate:
          type: string
          format: date-time
          description: Date (with pattern "yyyy-MM-dd'T'HH:mm:ss'Z'"). Application expiration date
        marketingOptInd:
          type: string
          enum:
          - 'Yes'
          - 'No'
          description: Marketing Indicator flag used by the distributor to capture the sale scope.
        agreeToTermsInd:
          type: string
          enum:
          - 'Yes'
          - 'No'
          description: Agreed to terms and condition or not.
        replacementIndicator:
          type: string
          enum:
          - 'Yes'
          - 'No'
          - Unknown
          description: Flag to dertermine whether this is replacement application or not.
        replacementLtcIndicator:
          type: string
          enum:
          - 'Yes'
          - 'No'
          description: Indicates whether the application involves replacement of existing Long-Term Care (LTC) coverage.
        pageId:
          type: string
          description: Page Identifier
          example: 5f45f7b34a3eea021f2fef1c
        overrideDecisionFlag:
          type: boolean
          description: Flag to dertermine override decisions. In case of true Override results is required.
        overrideResults:
          $ref: '#/components/schemas/OverrideResults'
        quote:
          $ref: '#/components/schemas/Quote'
        payload:
          type: object
          properties:
            underwriting:
              $ref: '#/components/schemas/Underwriting'
            insured:
              $ref: '#/components/schemas/PartyAdditional'
            childInsured:
              type: array
              items:
                $ref: '#/components/schemas/PartyChild'
            coverageDetails:
              $ref: '#/components/schemas/CoverageDetailsComplete'
            additional:
              $ref: '#/components/schemas/AdditionalInformation'
            documents:
              type: array
              items:
                $ref: '#/components/schemas/Documents'
      required:
      - eappId
      - caseId
      - correlationId
      - customerId
      - carrier
      - actionType
      - policyStatus
      - appSubmissionType
      - policyHoldingForm
      - consentInd
      - appStartDate
      - appState
      - consentIndState
      - consentSubmissionType
    PartyOwners:
      type: object
      properties:
        firstName:
          type: string
          description: First Name of the party
          example: Thomas
        lastName:
          type: string
          description: Last Name of the the party
          example: Lawrence
        middleName:
          type: string
          description: Middle name of the party
        name:
          type: string
          description: Full name of the party.
          example: Thomas Lawrence
        suffix:
          type: string
          description: Suffix for given party if Applicable
          example: Sr
        prefix:
          type: string
          description: Prefix for given party if Applicable
          example: Dr
        gender:
          type: string
          enum:
          - Male
          - Female
          description: Gender of party
          example: Male
        dob:
          type: string
          format: date
          description: Date of birth of party
        age:
          type: number
          description: Age of the party
          example: 26
        ssn:
          type: string
          description: Party SSN. In case if non individual it should be Tax Id
          minLength: 9
          maxLength: 9
          example: '121328426'
        driverNumber:
