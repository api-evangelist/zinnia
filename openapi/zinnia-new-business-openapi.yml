components:
  schemas:
    IdentifierInstance:
      type: object
      properties:
        identifier:
          type: string
          example: eAppId
        value:
          type: string
          example: 15ea7582-262f-4dfe-8a60-1e8b8e763fd4
    SuccessResponse:
      type: object
      properties:
        statusCode:
          type: integer
          format: int32
          example: 201
        timestamp:
          type: string
          format: date-time
        message:
          type: string
          example: Request Submitted Successfully
    CaseSuccessResponse:
      type: object
      properties:
        caseId:
          type: string
          example: CA000000536
        correlationId:
          type: string
          example: 15ea7582-262f-4dfe-8a60-1e8b8e763fd4
        eappId:
          type: string
          example: 15ea7582-262f-4dfe-8a60-1e8b8e763fd4
    ProducerSuccessResponse:
      type: object
      properties:
        statusCode:
          type: integer
          format: int32
          example: 202
        timestamp:
          type: string
          format: date-time
        message:
          type: string
          example: Request Accepted Successfully
        npn:
          type: string
          example: '12345678'
        caseId:
          type: string
          example: CA0000389896
        correlationId:
          type: string
          example: 2ad51ecf-9923-437f-a6f0-70968e464cuu
    AgentValidationSuccessResponse:
      type: object
      properties:
        status:
          type: string
          example: IGO or NIGO
        validationResult:
          type: array
          items:
            $ref: '#/components/schemas/ValidationResult'
    ValidationResult:
      type: object
      properties:
        errorCode:
          type: string
          example: EM.035
        error:
          type: string
          example: 1.) Add Transmittal Task. 2.) Pend Case 5 days.
        resolution:
          type: string
          example: Transmittal to licensing - agent needs to complete product training and LOB updated
    ValidationResponse:
      type: object
      properties:
        status:
          type: string
          example: FAILED
        timestamp:
          type: string
          format: date-time
        message:
          type: string
          example: Bad Request
        error:
          type: array
          items:
            type: string
            example: Mandatory attribute label missing
    ProducerValidationResponse:
      type: object
      properties:
        statusCode:
          type: integer
          format: int32
