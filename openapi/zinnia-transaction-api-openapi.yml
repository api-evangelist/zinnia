        type:
          type:
          - string
          - 'null'
          description: Handler kind. "context-modification" updates a context namespace; "blueprint-modification" applies the response to the rendered blueprint.
        action:
          type:
          - string
          - 'null'
          description: 'Action to perform within the chosen handler kind. Examples: "update-namespace", "replace-whole".'
        namespace:
          type:
          - string
          - 'null'
          description: Namespace to update for context-modification handlers. Omitted for handler types that do not use a namespace.
        value:
          allOf:
          - $ref: '#/components/schemas/SubscriberResponseValue'
          description: How to extract the value to apply from the upstream response.
          example:
            type: response-query
            kind: json-path
            value: $.data
      additionalProperties: false
      example:
        type: blueprint-modification
        action: replace-whole
        value:
          type: response-query
          kind: json-path
          value: $.data
