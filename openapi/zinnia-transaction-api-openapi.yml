      example:
        triggers:
        - FirstName
        actions:
        - type: http
          verb: get
          url: /market-connect/order-entry/v1/transaction/1125715/MCDPS
          token: OEToken
          payload:
            type: none
          responseHandlers:
          - type: blueprint-modification
            action: replace-whole
            value:
              type: response-query
              kind: json-path
              value: $.data
    SubscriberResponseHandler:
      type: object
