        kind: json-path
        value: $.data
    RenderCondition:
      required:
      - type
      - targetNodeId
      type: object
      properties:
        type:
          enum:
          - equality
          - range
          - presence
          type: string
          description: Kind of comparison performed by the condition.
          example: equality
        isEqual:
          type: boolean
          description: When true the condition passes if the target value equals 'value'; when false the condition passes if it differs.
          example: true
        value:
          type: string
          description: The value to compare against the resolved target answer.
          example: NY
        targetNodeId:
          type: string
          description: The answer node identifier whose value is evaluated by this condition.
          example: SolicitationStateCode
      description: Single condition controlling whether a field/section is rendered.
