      responses:
        '201':
          description: Returns the Order Entry blueprint for the created transaction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
        '400':
          description: '`VALIDATION_ERROR` - The request failed input validation.


