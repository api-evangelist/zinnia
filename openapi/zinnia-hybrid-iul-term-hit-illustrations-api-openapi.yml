    Party-Base:
      title: Party
      type: object
      description: Fundamental party object - see schema for specific role
      required:
      - partyId
      - partyTypeCode
      discriminator:
        propertyName: roleCode
      properties:
        partyId:
          type: string
          format: uuid
          description: Party id
          example: 95f5ece9-e40b-450b-ad39-daa217894e69
        partyTypeCode:
          example: INDIVIDUAL
          type: string
          description: Party type
          enum:
          - INDIVIDUAL
          - ORGANIZATION
          - TRUST
        gender:
          type: string
          description: Gender
          example: MALE
          enum:
          - MALE
          - FEMALE
          - UNISEX
          - OTHER
        dateOfBirth:
          type: string
          format: date
          pattern: ([0-9]{4})-([0-9]{2})-([0-9]{2})
          description: Date (with pattern "yyyy-mm-dd")
          example: '1990-05-13'
        firstName:
          type: string
          description: First Name
          example: John
        middleName:
          type: string
          description: Middle Name or Initial
          example: Frederick
        lastName:
          type: string
          description: Last name
          example: Doe
        suffix:
          type: string
          description: Name Suffix
          example: Jr.
        address:
          type: object
          description: Address
          properties:
            addressLine1:
              type: string
              description: Address line 1
              example: 123 Charter Oak
            addressLine2:
              type: string
              description: Address line 2
              example: Suite 456
            city:
              type: string
              description: Address city
              example: Manchester
            state:
              type: string
              enum:
              - AL
              - AK
              - AZ
              - AR
              - CA
              - CO
              - CT
              - DC
              - DE
              - FL
              - GA
              - HI
              - ID
              - IL
              - IN
              - IA
              - KS
              - KY
              - LA
              - ME
              - MD
              - MA
              - MI
              - MN
              - MS
              - MO
              - MT
              - NE
              - NV
              - NH
              - NJ
              - NM
              - NY
              - NC
              - ND
              - OH
              - OK
              - OR
              - PA
              - RI
              - SC
              - SD
              - TN
              - TX
              - UT
              - VT
              - VA
              - WA
              - WV
              - WI
              - WY
              description: US state code.https://en.wikipedia.org/wiki/ISO_3166-2:US
              example: CT
            zipCode:
              type: string
              description: Zip Code. Max char allowed is 9.
              maxLength: 9
              example: '123456'
        email:
          type: string
          format: email
          description: Email
          example: person@example.com
        phoneType:
          type: string
          description: Phone type
          example: HOME
          enum:
          - MOBILE
          - HOME
          - BUSINESS
          - CLAIMCENTER
          - CUSTOMERSERVICE
          - CORPORATEOFFICE
          - FAX
          - UNKNOWN
          - OTHER
        phone:
          type: string
          description: Phone
          example: '1238675309'
        identification:
          type: object
          description: Identification
          properties:
            identificationType:
              type: string
              description: Identification type
              example: PASSPORT
              enum:
              - PASSPORT
              - STATEPHOTOID
              - DRIVERLICENSENUMBER
              - SSN
              - TIN
              - OTHER
              - EXTERNAL
            identificationKey:
              type: string
              description: Identification key
              example: ECN
            identificationDescription:
              type: string
              description: Identification description
              example: ECN
            identificationValue:
              type: string
              description: Identification value
              example: ECN
    Participant-Collection-V4:
      title: Participants
      description: A collection of unique participants
      type: array
      items:
        title: Participant
        description: An entity with a stake in a policy
        type: object
        properties:
          issueAge:
            type: number
            format: integer
            description: Issue age
            example: 30
          participantId:
            type: string
            description: Participant id (UUID)
            example: 2ad51ecf-9923-437f-a6f0-70968e464cdb
          underwritingClass:
            type: string
            description: Underwriting class
            example: ULTRANONTOBACCO
            enum:
            - ULTRANONTOBACCO
            - ELITENONTOBACCO
            - PREFERREDNONTOBACCO
            - STANDARDNONTOBACCO
            - STANDARDTOBACCO
            - STANDARDAGGREGATE
            - SUBSTANDARDNONTOBACCO
            - SUBSTANDARDTOBACCO
            - STANDARDPLUSNONTOBACCO
            - PREFERREDTOBACCO
            - STANDARDCONVERSIONNONTOBACCO
            - STANDARDCONVERSIONTOBACCO
            - STANDARDPLUSBLEND
            - STANDARDPLUSTOBACCO
            - STANDARDBLEND
            - SUBSTANDARDBLEND
            - PREFERREDSELECTNONTOBACCO
            - PREFERREDSELECTBLEND
            - PREFERREDSELECTTOBACCO
            - PREFERREDBLEND
          subStandardRating:
            type: string
            description: Substandard rating
            example: TABLEA
            enum:
            - TABLEA
            - TABLEB
            - TABLEC
            - TABLED
            - TABLEE
            - TABLEF
            - TABLEG
            - TABLEH
            - TABLEI
            - TABLEJ
            - TABLEK
            - TABLEL
            - TABLEM
            - TABLEN
            - TABLEO
            - TABLEP
            - NONETABLE
          flatExtra:
            type: array
            description: Flat extra
            items:
              $ref: '#/components/schemas/Flat-Extra'
        required:
        - issueAge
        - participantId
      uniqueItems: true
    PropertyCollection-Withdrawal:
      title: Withdrawal Property Collection
      description: Reusable collection of withdrawal-related properties
      type: object
      properties:
        cumulativeWithdrawalAmount:
          type: number
          format: double
          description: Cumulative withdrawal amount
          example: 0
        maximumWithdrawalAmount:
          type: number
          format: double
          description: Maximum withdrawal amount
          example: 0
        withdrawalAmount:
          type: number
          format: double
          description: Withdrawal amount
          example: 0
    Message:
      title: Message
      description: A structured signal
      type: object
      properties:
        code:
          type: integer
        severity:
          type: string
          enum:
          - INFO
          - WARNING
          - ERROR
        text:
          type: string
        returnTo:
          type: string
      required:
      - code
      - text
    Non-Insured-Party:
      title: Non-Insured Party
      description: 'Represents a party with a roleCode other than `INSURED`

        '
      type: object
      allOf:
      - $ref: '#/components/schemas/Party-Base'
      properties:
        roleCode:
          $ref: '#/components/schemas/Party-Role'
      required:
      - roleCode
    Options-HIT:
      title: Options for Hybrid-IUL/Term
      type: object
      description: Options for the illustration request.
      allOf:
      - $ref: '#/components/schemas/Options-Base'
      - $ref: '#/components/schemas/IUL-Shared-Options'
      properties:
        fixedModalPayment:
          type: number
          format: double
          description: Fixed payment per pay period
          example: 500
        savingsPaymentIncluded:
          type: boolean
          description: Whether or not savings payment is included
          example: true
        savingsPaymentOption:
          type: string
          description: How savings payment is calculated
          example: FIXED
          enum:
          - EXTRA_OVER_COVERAGE
          - MAXIMIZE_SAVINGS_INCENTIVE
          - FIXED
          - SCHEDULE_BY_MODE
        savingsFixedAmount:
          type: number
          format: double
          description: Fixed payment amout for savings payment
          example: 500
        savingsScheduleByMode:
          allOf:
          - $ref: '#/components/schemas/Schedule-Base'
          description: Schedule for savings payment
        postFixedCostPeriodPaymentDurationOption:
          description: Post fixed-cost-period payment duration option
          type: string
          example: YEARS
          enum:
          - AGE
          - YEARS
        postFixedCostPeriodPaymentDuration:
          description: Post fixed-cost-period payment duration
          type: number
          format: integer
          minimum: 0
          example: 10
        postFixedCostPremiumOption:
          type: string
          description: Post fixed-cost-period premium option
          example: COVER_CHARGES
          enum:
          - COVER_CHARGES
          - MINIMUM_AFTER_CHARGES
          - SCHEDULE_BY_MODE
          - SOLVE_FOR_LEVEL
        postFixedCostPremiumSchedule:
          allOf:
          - $ref: '#/components/schemas/Schedule-Base'
          description: Schedule for post-fixed-cost-period premium
    Illustration-Response-Base:
      title: Illustration Response
      description: Fundamental Illustration response schema. See the schema for a specific product
      properties:
        id:
          type: string
          description: The unique identifier for the illustration request.
          example: ed13083d-d6b3-463d-a569-56b532d00fcd
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'
    Schedule-Premium:
      title: Premium Schedule
      allOf:
      - $ref: '#/components/schemas/Schedule-Base'
      properties:
        sequence:
          items:
            title: Premium Schedule Entry
            properties:
              value:
                example: 25000
                oneOf:
                - type: number
                  format: double
                - title: Premium Option
                  type: string
                  enum:
                  - SOLVE_FOR_TARGET_CASH_VALUE
                  - MINIMUM_PREMIUM
                  - TARGET_PREMIUM
                  - GUIDELINE_MAXIMUM_PREMIUM
                  - GUIDELINE_LEVEL_PREMIUM
                  - LEVEL_NON_MEC
            required:
            - value
    Scenario-HIT:
      title: Scenario Results for Hybrid-IUL/Term
      description: Outputs for Hybrid-IUL/Term product across all scenarios. This object represents a single scenario (e.g. Assumed, Guaranteed, etc)
      type: object
      allOf:
      - $ref: '#/components/schemas/Scenario-Base'
      - $ref: '#/components/schemas/IUL-Shared-Scenario-Properties'
      properties:
        fixedCostPeriod:
          type: number
          format: integer
          example: 65
        fixedCostPeriodSavingsPremium:
          type: number
          format: double
          description: Fixed cost period savings premium
          example: 250
        fixedCostPeriodSavingsModalPremium:
          type: number
          format: double
          description: Fixed cost period savings modal premium
          example: 20.83
        fixedCostPeriodChildRiderPremium:
          type: number
          format: double
          description: Fixed cost period child rider premium
          example: 50
        fixedCostPeriodChildRiderModalPremium:
          type: number
          format: double
          description: Fixed cost period child rider modal premium
          example: 4.17
    Scenario-Base:
