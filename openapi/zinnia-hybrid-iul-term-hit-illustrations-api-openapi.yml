            totalPremium:
              type: number
              format: double
              description: Premium
              example: 33.1
            accountValue:
              type: number
              format: double
              example: 0.104742
            totalModalPremium:
              type: number
              format: double
              example: 100.2
            totalPolicyFee:
              type: number
              format: double
              example: 600
            totalModalPolicyFee:
              type: number
              format: double
              example: 500
        interestRate:
          type: number
          format: double
          description: Interest rate
          example: 5.1
        issueAge:
          type: number
          format: integer
          description: Issue age
          example: 35
        lapse:
          type: object
          properties:
            age:
              type: number
              format: integer
              description: Lapse age
              example: 122
            year:
              type: number
              format: integer
              description: Lapse year
              example: 87
            month:
              type: number
              format: integer
              description: Lapse month
              example: 12
        loan:
          type: object
          properties:
            chargeRate:
              type: number
              format: double
              description: Charge rate
              example: 4.5
            chargeRateArrears:
              type: number
              format: double
              description: Charge rate arrears
              example: 4.5
            creditRate:
              type: number
              format: double
              description: Credit rate
              example: 4.3
            takenIndicator:
              type: number
              format: integer
              description: Taken indicator
              example: 0
        maturityYear:
          type: number
          format: integer
          description: Maturity year
          example: 86
        payToAge:
          type: number
          format: integer
          description: Pay to age
          example: 121
        payment:
          type: object
          properties:
            mode:
              type: number
              format: integer
              description: Payment mode
              example: 12
            term:
              type: number
              format: integer
              description: Payment term
              example: 86
        policyStartYear:
          type: number
          format: integer
          description: Policy start year
          example: 1
        premium:
          type: object
          properties:
            amount:
              type: number
              format: double
              description: Premium amount
              example: 33.1
            duration:
              type: number
              format: integer
              description: Premium duration
              example: 86
            durationAge:
              type: number
              format: integer
              description: Premium duration age
              example: 121
        scenarioEndAge:
          type: number
          format: integer
          description: Scenario end age
          example: 122
        totalFirstPaymentAmount:
          type: number
          format: double
          description: Total first payment amount
          example: 33.1
        netSurrenderValue:
          type: object
          properties:
            age65:
              type: number
              format: double
              example: 1.385921
            finalAge:
              type: number
              format: double
              example: 1.385921
        premiumFinalAge:
          type: number
          format: double
          example: 110.04
    Party-Role:
      title: Party Role
      example: OWNER
      type: string
      description: The role of a given party
      enum:
      - OWNER
      - PRIMARYBENEFICIARY
      - CONTINGENTBENEFICIARY
      - INSURED
      - PAYOR
      - PAYEE
      - AGENT
      - PRIMARYWRITINGAGENT
      - PRIMARYSERVICINGAGENT
      - ADDITIONALSERVICINGAGENT
      - ADDITIONALWRITINGAGENT
      - THIRDPARTYDESIGNEE
      - JOINTOWNER
      - COVERAGEINSURED
      - ASSIGNEE
      - ANNUITANT
      - EXCHANGECOMPANY
      - JOINTANNUITANT
      - GRANTOR
      - TRUSTEE
      - POWEROFATTORNEY
      - AUTHORIZEDSIGNATORY
      - OTHERINTERESTEDPARTY
      - CONTINGENTOWNER
    Flat-Extra:
      title: Flat Extra
      type: object
      properties:
        type:
          type: string
          description: Type of flat extra
          example: PERMANENT
          enum:
          - PERMANENT
          - TEMPORARY
        amount:
          type: number
          format: double
          description: Amount
          example: 1000
        duration:
          type: number
          format: integer
          description: Duration
          example: 12
        durationType:
          type: string
          description: Duration type
          example: YEARS
          enum:
          - YEARS
          - MONTHS
        startDate:
          type: string
          format: date
          pattern: ([0-9]{4})-([0-9]{2})-([0-9]{2})
          description: Date (with pattern "yyyy-mm-dd")
          example: '2025-05-13'
    Illustration-Response-HIT:
      title: Illustration Response for Hybrid-IUL/Term
      description: Illustration Response for Hybrid-IUL/Term product
      allOf:
      - $ref: '#/components/schemas/Illustration-Response-Base'
      properties:
        assumed:
          $ref: '#/components/schemas/Scenario-HIT'
        guaranteed:
          $ref: '#/components/schemas/Scenario-HIT'
        midpoint:
          $ref: '#/components/schemas/Scenario-HIT'
        assumedCap:
          $ref: '#/components/schemas/Scenario-HIT'
        assumedFixed:
          $ref: '#/components/schemas/Scenario-HIT'
        assumedPar:
          $ref: '#/components/schemas/Scenario-HIT'
    Conversion:
      title: Conversion
      description: Specifies what type of conversion is occurring
      type: object
      properties:
        conversionType:
          type: string
          description: Type of conversion
          example: STANDARD
          enum:
          - NONE
          - STANDARD
          - PREMIUM_CREDIT
        isSourceMEC:
          type: boolean
          description: Conversion MEC indicator - Indicates the source policy being converted was already in MEC status
          example: true
        conversionCredit:
          type: number
          format: double
          description: Amount to be credited to new policy on conversion
          example: 5000
      required:
      - conversionType
      - isSourceMEC
    Schedule-DBO:
      title: Death Benefit Option Schedule
