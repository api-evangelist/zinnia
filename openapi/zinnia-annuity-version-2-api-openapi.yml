    Application:
      type: object
      required:
      - effectiveDate
      - transmittingCompanyIdentifier
      - transmittingCompanyName
      - receivingCompanyName
      - agentSubmitDate
      - planCode
      - applicationDate
      - appId
      - version
      - contractState
      - qualificationFlag
      - appIndicator
      - suitabilityAppIndicator
      - ofacIndicator
      - signatureMethod
      - totalAttachmentCount
      - fileInceptionTime
      - initialPurchase
      - funds
      - roles
      properties:
        effectiveDate:
          type: string
          format: date
          pattern: ([0-9]{4})-([0-9]{2})-([0-9]{2})
          description: e-App submitted date to Zinnia (with pattern "yyyy-mm-dd").
          example: '2023-12-19'
        key:
          type: number
          description: Zinnia Unique idenitifer for a case. [Derived by Zinnia]
          example: 1234567
        sourceCd:
          type: string
          description: Zinnia Identifier for a client.[Derived by Zinnia]
          example: ZIN_ABC
        correlationId:
          type: string
          description: Zinnia Unique Identifier for a case.[Derived by Zinnia]. This is not required for Paper Apps , only eApps.
          example: 0ca10708-4b53-464c-b745-355c8f6f0edb
        zinniaCaseId:
          type: string
          description: Zinnia Unique Identifier for a case.[Derived by Zinnia]. This is  required for Paper Apps, not eApps and will be sent via Orion Application.
          example: CA0123456789
        transmittingCompanyIdentifier:
          type: string
          description: An identifer that represents Transmitting Company which is of 4 char.
          example: '1234'
        transmittingCompanyName:
          type: string
          description: Transmitting Company Name
          example: ABC
        receivingCompanyName:
          type: string
          description: Receiving Company Name, Derived by Zinnia based on the set up in Zinnia Systems.
          example: ABC
        submitterNSCCId:
          type: string
          description: The NSCC assigned membership ID for the firm initiating the transactions.Only applicable for DTCC cases.
          example: '0075'
        submitterNSCCName:
          type: string
          description: Name of the Submitter (Settling Firm).Only applicable for DTCC cases.
          example: LPL
        asid:
          type: string
          description: Identifier assigned by a clearing firm/service provider to a firm that clears business through them.Only applicable for DTCC cases.
          example: '0075'
        asidName:
          type: string
          description: Name of associated firm.Only applicable for DTCC cases.
          example: LPL
        firmExternalId:
          type: string
          description: External ID in MCS [Zinnia Commission System] that belongs to the Firm. firmExternalId or firmTaxId or firmNPN is mandatory.
          example: Q01530
        firmTaxId:
          type: string
          pattern: \d{9}
          description: 9 digit Tax ID in MCS [Zinnia Commission System] that belongs to the Firm. firmExternalId or firmTaxId or firmNPN is mandatory.
          minLength: 9
          maxLength: 9
          example: '123456789'
        firmNPN:
          type: string
          description: NPN in MCS [Zinnia Commission System] that belongs to the Firm. firmExternalId or firmTaxId or firmNPN is mandatory.
          example: '294128'
        agentSubmitDate:
          type: string
          format: date
          pattern: ([0-9]{4})-([0-9]{2})-([0-9]{2})
          description: Agent submit date (with pattern "yyyy-mm-dd").
          example: '2023-12-19'
        applicationSignedCounty:
          type: string
          description: Application Signed County, Only for Florida if required by Business Processing System for running rules.
          example: Dade
        planCode:
          type: string
          description: Product code assigned by Zinnia Admin system
          example: '111'
        applicationDate:
          type: string
          format: date
          pattern: ([0-9]{4})-([0-9]{2})-([0-9]{2})
          description: Application Signed Date (with pattern "yyyy-mm-dd").
          example: '2023-12-19'
        policyDate:
          type: string
          format: date
          pattern: ([0-9]{4})-([0-9]{2})-([0-9]{2})
          description: Client Agreement Date/Issue Date (with pattern "yyyy-mm-dd").
          example: '2023-12-19'
        solicitationDate:
          type: string
          format: date
          pattern: ([0-9]{4})-([0-9]{2})-([0-9]{2})
          description: The date in which the Agent first proposes to the client the use of an insurance product, which may or may not be in response to an engagement/planning process.  (with pattern "yyyy-mm-dd").
          example: '2023-12-19'
        quoteStartDate:
          type: string
          format: date
          pattern: ([0-9]{4})-([0-9]{2})-([0-9]{2})
          description: The start (run) date of the illustration or quote (with pattern "yyyy-mm-dd").
          example: '2023-12-19'
        quoteId:
          type: string
          description: The ID for the illustration or quote.
          example: '12345'
        ownerSignedDate:
          type: string
          format: date
          pattern: ([0-9]{4})-([0-9]{2})-([0-9]{2})
          description: This date represents when the natural owner electronically signed the application and any supporting documentation. (with pattern "yyyy-mm-dd").
          example: '2023-12-19'
        jointOwnerSignedDate:
          type: string
          format: date
          pattern: ([0-9]{4})-([0-9]{2})-([0-9]{2})
