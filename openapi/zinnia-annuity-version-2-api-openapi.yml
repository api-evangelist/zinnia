          format: date
          pattern: ([0-9]{4})-([0-9]{2})-([0-9]{2})
          description: This date represents when the joint Annuitant electronically signed the application and any supporting documentation. (with pattern "yyyy-mm-dd").
          example: '2023-12-19'
        trusteeSignedDate:
          type: string
          format: date
          pattern: ([0-9]{4})-([0-9]{2})-([0-9]{2})
          description: This date represents when the trustee/representative electronically signed the application and any supporting documentation. (with pattern "yyyy-mm-dd").
          example: '2023-12-19'
        beneficiarySignedDate:
          type: string
          format: date
          pattern: ([0-9]{4})-([0-9]{2})-([0-9]{2})
          description: This date represents when the Beneficiary electronically signed the application and any supporting documentation. (with pattern "yyyy-mm-dd").
          example: '2023-12-19'
        spouseSignedDate:
          type: string
          format: date
          pattern: ([0-9]{4})-([0-9]{2})-([0-9]{2})
          description: This date represents when the Spouse electronically signed the application and any supporting documentation. (with pattern "yyyy-mm-dd").
