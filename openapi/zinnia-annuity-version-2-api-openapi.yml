openapi: 3.2.0
info:
  title: Zinnia New Business Annuity Annuity Version 2 API
  description: New Business — Annuity API surface exposed through Kong.
  version: 0.7.0
  contact:
    name: Zinnia New Business Annuity
    email: hitesh.parakh@zinnia.com
  x-changelog:
  - date: '2026-08-07'
    change: Added V3 Annuity application submission endpoint (/v3/new-business/annuity-applications), introducing a Party model (replacing role) and moving bank details from party to payment. V3 schemas colliding by name with V1/V2 suffixed with V3.
  - date: '2026-05-12'
    change: added ETP endpoints Annuity V1, Annuity V2 and ETP health check
  - date: '2026-05-06'
    change: Expose `/eapp/actuator/health` and `/suitability/actuator/health` publicly through Kong for New Business — Annuity
  - date: '2026-05-06'
    change: Expose `/toa/actuator/health` publicly through Kong for New Business — Annuity
  - date: '2026-05-06'
    change: Expose payment processing health check publicly through Kong for New Business — Annuity
  - date: '2026-05-06'
    change: Expose application processing health check publicly through Kong for New Business — Annuity
  - date: '2026-05-05'
    change: Expose application validation health check publicly through Kong for New Business — Annuity
servers:
- url: https://qa.api.zinnia.io
  description: QA Environment
- url: https://dev.api.zinnia.io
  description: DEV Environment
- url: https://uat.api.zinnia.io
  description: UAT Environment
- url: https://api.zinnia.io
  description: PROD Environment
tags:
- name: Annuity Version 2
  description: EAPP API Version 2
paths:
  /eApp/v2/applications/annuity:
    post:
      tags:
      - Annuity Version 2
      summary: Submit Annuity Application to Zinnia
      description: Submits an annuity eApp to Zinnia for new business processing.
      operationId: createAnnuityApplication_v2
      parameters:
      - name: Authorization
        required: true
        description: This will be passed as Bearer plus "token" as generated by above token API.
        in: header
        schema:
          type: string
        example: Bearer eykjsfjfjasdasdad
      requestBody:
        description: Details required to submit the eApp to Zinnia for Annuity
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Application'
        required: true
      responses:
        '201':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'
        '401':
          description: Authentication failed
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
      security:
      - Auth0: []
  /eApp/v2/applications/documents:
    post:
      tags:
      - Annuity Version 2
      summary: Submit Annuity Documents to Zinnia
      description: Submits documents associated with an annuity eApp to Zinnia.
      operationId: createAnnuityDocument_V2
      parameters:
      - name: Authorization
        required: true
        description: This will be passed as Bearer plus "token" as generated by above token API.
        in: header
        schema:
          type: string
        example: Bearer eykjsfjfjasdasdad
      requestBody:
        description: Details required to submit the eApp to Zinnia for Annuity
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentInformation'
        required: true
      responses:
        '201':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'
        '401':
          description: Authentication failed
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
      security:
      - Auth0: []
components:
  schemas:
    ValidationResponse:
      type: object
      properties:
        statusCode:
          type: integer
          format: int32
          example: 400
        timestamp:
          type: string
          format: date-time
        errorId:
          type: string
          example: a4a57ed0-2c1b-4922-9959-3b85dd8a96d3
        message:
          type: string
          example: JSON Valdiation fails with error
        error:
          type: array
          items:
            type: string
            example: Mandatory attribute label missing
    Payment:
      type: object
      required:
      - id
      - paymentMethod
      - moneySource
      - grossAmount
      - netAmount
      - currentAlloc
      properties:
        id:
          type: string
          description: Unique Id to tag to respective payment records. Duplicate Ids will be rejected.
          example: payment_1
        paymentMethod:
          type: string
          description: Payment methods
          enum:
          - CHK
          - WIRE
          - EXCREP
          - CREDITCARD
          - ACH
          - DTCC
          example: CHK
        grossAmount:
          format: double
          type: number
          description: Gross Amount for the individual payment
          example: 238500.5
        netAmount:
          format: double
          type: number
          description: Net Amount  for the individual payment
          example: 0
        taxInfo:
          $ref: '#/components/schemas/TaxInfo'
        currentAlloc:
          type: string
          description: Funds to be considered for Future Allocations or not
          enum:
          - 'YES'
          - 'NO'
          example: 'YES'
        waivePremium:
          format: int32
          type: integer
          description: waivePremium
          example: 0
        distributorId:
          type: string
          description: This is same as Tracking ID.If there are multiple payments, first payment distributorId will be the TrackingID. This unique system generated number is assigned by the B/D system and sent with each premium to the NSCC,  to send to the Insurance Company.  This number is assigned by the broker dealer, by which the premium can be located. Required for clearing house and detail level transactions. Broker/dealer would expect this back for chargebacks, reversals, etc. Can be returned on the "FAR" and the "COM" by the insurance carrier to identify the transaction processed.
        exchangeReplace:
          $ref: '#/components/schemas/ExchangeReplace'
    Feature:
      type: object
      required:
      - riderCode
      properties:
        riderCode:
          type: string
          description: Rider Code will be provided by Zinnia for the respective Products
          example: ABC0000000
    TaxInfo:
      type: object
      properties:
        currentContribAmount:
          format: double
          type: number
          description: Current Contribution Amount
          example: 0
        priorContribAmount:
          format: double
          type: number
          description: Prior Contribution Amount
          example: 0
        taxYear:
          type: string
          description: tax year
          example: '2025'
        totalBasis:
          format: double
          type: number
          description: Total Cost basis amount
          example: 0
        pretefraBasis:
          format: double
          type: number
          description: Pre Tefra basis amount
          example: 0
        posttefraBasis:
          format: double
          type: number
          description: Post Teefra basis amount
          example: 0
        post88Amount:
          format: double
          type: number
          description: Post 88 Amount
          example: 0
    Email:
      type: object
      properties:
        emailId:
          type: string
          format: email
          description: Email address of associated party
          example: abc@zinnia.com
        emailType:
          type: string
          enum:
          - BUSINESS
          - PERSONAL
