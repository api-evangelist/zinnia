    PolicyValues:
      type: object
      required:
      - fedMaritalStatus
      - stateMaritalStatus
      - mktSegment
      properties:
        fedMaritalStatus:
          type: string
          enum:
          - DEF
          - SNGL
          - MRRD
          - HOH
          - QUALWIDOWWITHDEPCHILD
          - DOMESTICPARTNER
          - DIVORCED
          description: Fed marital status
          example: MRRD
        stateMaritalStatus:
          type: string
          enum:
          - DEF
          - SNGL
          - MRRD
          - HOH
          - QUALWIDOWWITHDEPCHILD
          - DOMESTICPARTNER
          - DIVORCED
          description: State marital status
          example: MRRD
        withholding:
          type: array
          items:
            $ref: '#/components/schemas/Withholding'
        contribType:
          type: string
          enum:
          - NA
          - EMPVOL
          - EMPDISC
          description: Contribution type
          example: EMPVOL
    ExchangeReplace:
      type: object
      description: For any payment that is a replacement/exchange
      required:
      - productType
      - companyName
      - type
      - address
      - amountRequested
      - signedDate
      - sourcePolicyNumber
      - previousPlanType
      - applyRateLock
      - rateLockStartDate
      - replacementIndicator
      - advanceCommission
      properties:
        productType:
          type: string
          description: Exchange policy product type
          enum:
          - ANNUITY
          - LIFE
          - BROKERAGE
          - CASH
          example: ANNUITY
        companyName:
          type: string
          description: Name of the Company
          example: ABC
        taxId:
          type: string
          pattern: \d{9}
          description: Company Tax ID
          minLength: 9
          maxLength: 9
          example: '123456789'
        type:
          type: string
          description: Type of the Exchange/Replacement
          enum:
          - INT1035
          - EXT1035
          - EXTDIRTRAN
          - INTDIRTRAN
          - EXTROLLQUAL
          - INTROLLQUAL
          - EXTROTHROLL
          - INTROTHTROLL
          - EXTROTHDIRTRAN
          - INTROTHDIRTRAN
          - CLIENTINITTRAN
          - BENPRCDS
          - EXT1035PART
          - INT1035PART
          - BIRTHRPMT
          - NOLOA
          - EXTDIRECTTRANSFREP
          - INTDIRECTTRANSFREP
          - REINSTATEMENT
          - DEFAULT
          example: INT1035
        email:
          type: string
          description: Company email address
          example: abc@zinnia.com
        address:
          $ref: '#/components/schemas/Address'
        amountRequested:
          format: double
          type: number
          description: This field stores the requested amount.
          example: 5000.55
        signedDate:
          type: string
          format: date
          pattern: ([0-9]{4})-([0-9]{2})-([0-9]{2})
          description: Signed date (with pattern "yyyy-mm-dd").
          example: '2023-12-19'
        sourcePolicyNumber:
          type: string
          description: This field stores the source policy number
          example: '123456'
        originalCostBasis:
          type: string
          description: This field stores the Original Cost Basis
          example: '1000'
        previousPlanType:
          type: string
          description: This field stores the plan type which was used on previous policy - Refer qualificationflag for types
          example: NONQUAL
        applyRateLock:
          type: string
          description: This field stores determines whether to apply Rate Lock or not
          enum:
          - 'YES'
          - 'NO'
          example: 'YES'
        replacementIndicator:
          type: string
          enum:
          - 'YES'
          - 'NO'
          example: 'YES'
        mecIndicator:
          type: string
          description: Source of ER policy is MEC/not
          enum:
          - 'YES'
          - 'NO'
          example: 'YES'
    ServerErrorResponse:
      type: object
      properties:
        statusCode:
          type: integer
          format: int32
          example: 500
        timestamp:
          type: integer
          format: int64
          example: 1681395423438
        errorId:
          type: string
          example: 0286d47a-7ad9-499c-8ca0-8f6634d236a3
        message:
          type: string
          example: Failed to process request
    InitialPurchase:
      type: object
      required:
      - grossAmount
      - netAmount
      - payments
      properties:
        grossAmount:
          format: double
          type: number
          description: Total Gross Amount
          example: 238500.5
        netAmount:
          format: double
          type: number
          description: Total Net Amount
          example: 100.5
        payments:
          type: array
          items:
            $ref: '#/components/schemas/Payment'
    AccessDeniedResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        message:
          type: string
          example: 'User is not authorized for the carrier : CarrierName_1'
  securitySchemes:
    Auth0:
      type: openIdConnect
      openIdConnectUrl: https://login.dev.zinnia.com/.well-known/openid-configuration
      x-kong-security-openid-connect:
        config:
          run_on_preflight: true
          scopes_claim:
          - https://dev.api.zinnia.io/permissions
          audience_claim:
          - aud
          audience_required:
          - https://dev.api.zinnia.io
          client_id:
          - client_id
          auth_methods:
          - bearer
        enabled: true
        protocols:
        - grpc
        - grpcs
        - http
        - https
