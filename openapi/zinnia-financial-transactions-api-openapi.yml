            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
              examples:
                success:
                  $ref: '#/components/examples/successTransactionResponse'
        '400':
          description: Freelook Cancellation Validation Failure Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
