components:
  schemas:
    PartyIdentifier:
      type: object
      properties:
        type:
          type: string
          enum:
          - SSN
          - EIN
          - TIN
        value:
          type: string
          example: 123-45-6789
        description:
          type: string
          example: Social Security Number
        source:
          type: string
          example: SSA
        issueDate:
          type: string
          format: date
          example: '2015-01-01'
          description: Date (with pattern "yyyy-mm-dd")
        expirationDate:
          type: string
          format: date
          nullable: true
          example: '2070-01-01'
          description: Date (with pattern "yyyy-mm-dd")
        status:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
          example: ACTIVE
        countryOfIssue:
          type: string
          example: US
    AmountType:
      type: string
      enum:
      - AMOUNT
      - PERCENTAGE
      - MAX
      - FREEWITHDRAWALAMOUNT
      - WITHDRAWALUNTILBASIS
      - EARNINGSONLY
      - PRORATA
      description: Amount Type selected by user. Following is dropdown list 1. Amount -- If selected user should be able to enter Amount for Transaction Amount field 2. Percent -- If selected user should be able to enter Percentage for Transaction Amount field 3. Max -- If selected user should NOT be able to enter Amount. Auto calculated using Maximum Withdrawal Amount. 4. Free Withdrawal Amount -- If selected user should NOT be able to enter Amount. Auto calcualted using Free Withdrawal Amount. 5. Withdraw Until Basis ---- If selected user should NOT be able to enter Amount. Auto calcualted using Cost Basis.
    AddressDetail:
      type: object
      properties:
        addressId:
          type: string
          example: '1'
        startDate:
          type: string
          format: date
          example: '2026-05-13'
          description: Date (with pattern "yyyy-mm-dd")
        endDate:
          type: string
          format: date
          nullable: true
          description: Date (with pattern "yyyy-mm-dd"). Omit or send JSON null when not applicable.
        addressType:
