- name: Financial Transactions
  description: Financial Transactions
paths:
  /bpm/v1/policies/{planCode}/{policyNumber}/basecoverageupdate/eligibilitycheck:
    post:
      tags:
      - Financial Transactions
      summary: base coverage update
      operationId: post_bpm_v1_policies_planCode_policyNumber_basecoverageupdate_eligibilitycheck
      parameters:
      - name: planCode
        in: path
        required: true
        schema:
          type: string
      - in: path
        name: policyNumber
        schema:
          type: string
        required: true
        description: Policy Number
      responses:
        '200':
          description: basecoverageupdate Eligibility Success Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
              examples:
                success:
                  $ref: '#/components/examples/successTransactionResponse'
        '400':
          description: basecoverageupdate Eligibility Client Error Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
              examples:
                failure:
                  $ref: '#/components/examples/failureTransactionResponse'
        '500':
          description: basecoverageupdate Eligibility Server Error Response
      security:
      - Auth0: []
