    post:
      tags:
      - Financial Transactions
      summary: Validation Freelook Cancellation Transaction
      operationId: validationFreelookCancellationTransaction1
      parameters:
      - name: planCode
        in: path
        required: true
        schema:
          type: string
      - in: path
        name: policyNumber
        schema:
          type: string
        required: true
        description: Policy Number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FreeLookCancellationRequest'
      responses:
