        '500':
          description: Unexpected error occured, please check server logs
      security:
      - Auth0: []
  /bpm/v1/policies/{planCode}/{policyNumber}/initialdeathclaim/eligibilitycheck:
    post:
      tags:
      - Financial Transactions
      summary: Initial Death Claim Eligibility Check
      description: 'Checks whether an initial death claim can be submitted for the given policy.

        No request body is required; eligibility is derived from the policy identified

        by planCode and policyNumber. An eligible policy returns status success; an

        ineligible policy returns status failure with the reasons in error.'
      operationId: initialDeathClaimEligibilityCheck
      parameters:
      - name: planCode
        in: path
        required: true
        schema:
          type: string
        description: Plan Code
        example: EVIU101
      - name: policyNumber
        in: path
        required: true
        schema:
          type: string
        description: Policy Number
        example: EVIUL7RED022
      responses:
        '200':
          description: Eligibility check completed successfully. The policy is eligible for an initial death claim.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
              examples:
                success:
                  summary: Policy is eligible
                  value:
                    status: success
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
              examples:
                failure:
                  $ref: '#/components/examples/failureTransactionResponse'
        '500':
          description: Internal server error. Please check server logs for more details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
              examples:
                serverError:
                  summary: Internal server error
                  value:
                    status: failure
                    error:
                    - errorCode: BPM.SYS.500
                      error: An unexpected internal server error occurred.
                      resolution: Contact platform support with the correlationId.
      security:
      - Auth0: []
  /bpm/v1/policies/{planCode}/{policyNumber}/initialdeathclaim/validation:
    post:
      tags:
      - Financial Transactions
      summary: Initial Death Claim Validation
      description: 'Validates an initial death claim payload for the given policy without

        submitting it. A payload that passes every check returns status success; a

        payload that fails returns status failure with the reasons in error.'
      operationId: initialDeathClaimValidation
      parameters:
      - name: planCode
        in: path
        required: true
        schema:
          type: string
        description: Plan Code
        example: EVIU101
      - name: policyNumber
        in: path
        required: true
        schema:
          type: string
        description: Policy Number
        example: EVIUL7RED022
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InitialDeathClaimRequest'
      responses:
        '200':
          description: Validation completed successfully. The payload is valid for submission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
              examples:
                success:
                  summary: Payload is valid
                  value:
                    status: success
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
              examples:
                failure:
                  $ref: '#/components/examples/failureTransactionResponse'
        '500':
          description: Internal server error. Please check server logs for more details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
              examples:
                serverError:
                  summary: Internal server error
                  value:
                    status: failure
                    error:
                    - errorCode: BPM.SYS.500
                      error: An unexpected internal server error occurred.
                      resolution: Contact platform support with the correlationId.
      security:
      - Auth0: []
