    PaymentV3:
      type: object
      additionalProperties: false
      required:
      - paymentId
      - netAmount
      - grossAmount
      - method
      - currentAlloc
      properties:
        paymentId:
          type: string
          description: Unique id for the payment made
          format: Integer
        referenceNumber:
          type: string
          description: Reference Numbe for the payment made
        netAmount:
          type: string
          description: Premium received (Net Amount)
          format: double
          example: '238500.50'
        grossAmount:
          type: string
          description: Premium received (Gross Amount)
          format: double
          example: '238500.50'
        method:
          type: string
          description: Method through which the payment is made
          enum:
          - CREDITCARD
          - DEBITCARD
          - CHECK
          - ACH
          - DIGITALPAYMENT
          - WIRE
          - DTCC
          - EXCHANGE
          - PAYROLLDEDUCTION
        internalExchIndicator:
          type: string
          description: DTCC defined Indicator that states whether an exchange type application is internal of external.
          enum:
          - 'YES'
          - 'NO'
        withdrawalIndicator:
          type: string
          description: Premium received withdrawal indicator
          enum:
          - FULL
          - PARTIAL
        partialWithdrawType:
          type: string
          description: If Withdrawal indicator is input then Partial Withdrawal Type become mandatory
          enum:
          - SPECIFIEDAMOUNTWITHDRAWAL
          - PERCENTOFCONTRACTWITHDRAWAL
          - PERCENTOFCONTRACTPREMIUMWITHDRAWAL
          - PERCENTOFFUNDWITHDRAWAL
          - RIDERFREEAMOUNTWITHDRAWAL
          - SURRENDERFREEAMOUNTWITHDRAWALPENALTYFREEWITHDRAWAL
          - INTERESTONLYWITHDRAWAL
          - REQUIREDMINIMUMDISTRIBUTIONWITHDRAWAL
          - SUBSTANTIALLYEQUALPAYMENTS
          - INTERESTONLYSURRENDERFREEAMOUNTWITHDRAWAL
          - REQUIREMENTMINIMUMDISTRIBUTIONCALCULATED
          - REQUIREMENTMINIMUMDISTRIBUTIONSPECIFIEDAMOUNT
        surrenderingDateInstruction:
          type: string
          description: If Withdrawal indicator is input then Partial Withdrawal Type become mandatory
          enum:
          - UPONRECEIPT
          - SPECIFICDATE
        frequency:
          type: string
          description: Frequency of premium payments
          enum:
          - DAILY
          - EVERYTWOWEEKS
          - MONTHLY
          - SEMIANNUAL
          - QUARTERLY
          - ANNUAL
          - SINGLEPAYMENT
        paymentDate:
          type: string
          format: date
          description: Date when the payment is made (with pattern “yyyy-mm-dd”)
        draftDate:
          type: string
          format: date
          description: Date when the payment draft is created (with pattern “yyyy-mm-dd”)
        externalTransactionId:
          type: string
          description: Transaction ID from external system
        externalArrangementId:
          type: string
          description: Arrangement ID from external system
        automaticPayment:
          type: boolean
          description: Whhether this payment is automatic - TRUE/FALSE
        premType:
          type: string
          description: DTCC-defined code identifying the type of premium payment.
          enum:
          - DIRECTROLLOVER
          - INDIRECTROLLOVER
          - CONTRIBUTION
          - FULL1035EXCHANGE
          - PARTIAL1035EXCHANGE
          - QUALIFIEDTRANSFER
          - NONQUALIFIEDTRANSFEROFASSETS
          - EMPLOYEECONTRIBUTION
          - EMPLOYERCONTRIBUTION
        currentAlloc:
          type: string
          description: Indicates whether Funds to be considered for Future Allocations or not
          enum:
          - 'YES'
          - 'NO'
        waivePremium:
          type: string
          description: Indicator specifying whether the premium is waived.
        distributorId:
          type: string
          description: This is same as Tracking ID.If there are multiple payments, first payment distributorId will be the TrackingID. This unique system generated number is assigned by the B/D system and sent with each premium to the NSCC, to send to the Insurance Company. This number is assigned by the broker dealer, by which the premium can be located. Required for clearing house and detail level transactions. Broker/dealer would expect this back for chargebacks, reversals, etc. Can be returned on the "FAR" and the "COM" by the insurance carrier to identify the transaction processed.
        party:
          type: array
          description: Associated PartyIds for given payment
          items:
            type: string
            description: Party ID associated with this payment.
            format: uuid
        taxInfo:
          $ref: '#/components/schemas/TaxInfoV3'
        policyHistory:
          $ref: '#/components/schemas/PolicyHistory'
        bankInformation:
          $ref: '#/components/schemas/BankInformationV3'
