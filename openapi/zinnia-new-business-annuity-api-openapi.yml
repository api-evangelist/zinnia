components:
  schemas:
    PersonalInformationOwner:
      type: object
      required:
      - firstName
      - lastName
      - dateOfBirth
      - birthSex
      - birthCountry
      properties:
        firstName:
          type: string
          example: John
        middleName:
          type: string
          example: M
        lastName:
          type: string
          example: Doe
        suffix:
          type: string
          maxLength: 10
          description: Suffix for given party if Applicable
          example: SR
        prefix:
          type: string
          enum:
          - MR
          - MS
          - MISS
          - DR.
          - MRS.
          description: Prefix for given party if Applicable
          example: MR
        dateOfBirth:
          type: string
          format: date
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
          example: '1990-01-01'
          description: Date (with pattern "yyyy-mm-dd")
        gender:
          type: string
          enum:
          - MALE
          - FEMALE
          - UNISEX
          - UNKNOWN
          example: MALE
        birthSex:
          type: string
          enum:
          - MALE
          - FEMALE
          - UNISEX
          example: MALE
        birthState:
          $ref: '#/components/schemas/BirthState'
        birthCountry:
          $ref: '#/components/schemas/CountryV3'
        citizenCountry:
          $ref: '#/components/schemas/CountryV3'
    AddressDetail:
      type: object
      additionalProperties: false
      required:
      - addressType
      - addressLine1
      properties:
        addressType:
          type: string
          description: Type of address
          enum:
          - RESIDENCE
          - BUSINESS
          - POBOX
          - SEASONAL
          - SECONDARY
          - MAILING
        addressLine1:
          type: string
          description: Address Line 1
        addressLine2:
          type: string
          description: Address Line 2
        addressLine3:
          type: string
          description: Address Line 3
        city:
          type: string
          description: City of residence for the prior carrier or policy owner.
        state:
          type: string
          description: state of residence for the prior carrier or policy owner.
        zipCode:
          type: string
          description: ZIP code (5 digits)
        country:
          type: string
          description: Two letter ISO Country Code
    FeatureV3:
      type: object
      additionalProperties: false
      required:
      - featureCode
      properties:
        featureCode:
          type: string
          description: Code used to uniquely identify the feature.
        featureName:
          type: string
          description: Name of the feature.
        featureStartDate:
          type: string
          description: Effective start date of the feature.
          format: date
        featureProcessDay:
          type: string
          description: Day of the month on which the feature is processed, when applicable.
          enum:
          - FIRST
          - SECOND
          - THIRD
          - FOURTH
          - FIFTH
          - SIXTH
          - SEVENTH
          - EIGHTH
          - NINTH
          - TENTH
          - ELEVENTH
          - TWELFTH
          - THIRTEENTH
          - FOURTEENTH
          - FIFTEENTH
          - SIXTEENTH
          - SEVENTEENTH
          - EIGHTEENTH
          - NINETEENTH
          - TWENTIETH
          - TWENTYFIRST
          - TWENTYSECOND
          - TWENTYTHIRD
          - TWENTYFOURTH
          - TWENTYFIFTH
          - TWENTYSIXTH
          - TWENTYSEVENTH
          - TWENTYEIGHTH
          - TWENTYNINTH
          - THIRTIETH
          - THIRTYFIRST
        featureDuration:
          type: string
          description: Duration value for the feature based on the specified duration type.
        featureDurationType:
          type: string
          description: Unit of measure used to interpret the feature duration.
          enum:
          - DAYS
          - MONTHS
          - YEARS
          - QUARTERS
          - SEMIANNUALS
          - WEEKS
          - BIWEEKLY
          - SEMIMONTHLY
          - MAXIMUM
        featureFrequency:
          type: string
          description: Frequency at which the feature is applied or processed.
          enum:
          - WEEKLY
          - EVERYTWOWEEKS
          - SEMIMONTHLY
          - MONTHLY
          - BIMONTHLY
          - ANNUAL
          - DAILY
          - SINGLE
          - QUARTERLY
          - SEMIANNUAL
        featureValue:
          type: string
          description: Feature value configured for the contract (amount, percentage, or prorated value).
          format: double
          example: '238500.50'
        featureValueType:
          type: string
          description: Type of value represented by the feature value.
          enum:
          - AMOUNT
          - PERCENTAGE
          - WITHDRAWALUNTILBASIS
          - PRORATA
        taxWithholdingIndicator:
          type: string
          description: Indicator specifying whether tax withholding applies to this feature.
          enum:
          - 'YES'
          - 'NO'
        taxFilingStatus:
          type: string
          description: Tax filing status used for withholding determination, when applicable.
          enum:
          - SINGLE
          - MARRIED
          - MARRIEDBUTWITHHOLDATHIGHERSINGLERATE
          - MARRIEDFILINGJOINTLY
          - MARRIEDFILINGSEPARATELY
          - HEADOFHOUSEHOLD
          - WIDOWED
          - DOMESTICPARTNER
          - DIVORCED
        withholding:
          $ref: '#/components/schemas/WithholdingV3'
        fund:
          type: array
          description: Fund transfer instructions associated with the feature.
          items:
            $ref: '#/components/schemas/FundTransfer'
        payment:
          type: array
          description: Payment instructions associated with the feature.
          items:
            $ref: '#/components/schemas/FeaturePayment'
        payouts:
          $ref: '#/components/schemas/PayoutV3'
    PowerOfAttorney:
      type: object
      required:
      - partyType
      - partyRole
      - personalInformation
      properties:
        partyId:
          type: string
          description: Unique identifier for the party
          format: uuid
          example: 2ad51ecf-9923-437f-a6f0-70968e464cdb
        partyRole:
          type: string
          enum:
          - POWEROFATTORNEY
          description: Type of party role
          example: POWEROFATTORNEY
        partyType:
          type: string
          enum:
          - INDIVIDUAL
          description: Type of party
          example: INDIVIDUAL
        relationship:
          $ref: '#/components/schemas/Relationship'
        personalInformation:
          $ref: '#/components/schemas/PersonalInformationPrimary'
        partyCommunication:
          type: string
          enum:
          - REGULARMAIL
          - EMAIL
          - PHONE
        identifiers:
          type: array
          items:
            anyOf:
            - $ref: '#/components/schemas/PassportIdentifier'
            - $ref: '#/components/schemas/StateIdIdentifier'
            - $ref: '#/components/schemas/DriversLicenseIdentifier'
            - $ref: '#/components/schemas/SsnIdentifier'
            - $ref: '#/components/schemas/ItinIdentifier'
            - $ref: '#/components/schemas/EinIdentifier'
            - $ref: '#/components/schemas/AlienRegistrationIdentifier'
            - $ref: '#/components/schemas/ExternalPartyIdentifier'
          description: Array of identifiers for this party
        address:
          type: object
          properties:
            preferredAddressId:
              type: string
              format: uuid
              example: 2ad51ecf-9923-437f-a6f0-70968e464cdb
            addresses:
              type: array
              items:
                $ref: '#/components/schemas/AddressV3'
              description: List of addresses associated with this party
              example: []
        phoneNumber:
          type: object
          properties:
            preferredPhoneId:
              type: string
              format: uuid
              example: 2ad51ecf-9923-437f-a6f0-70968e464cdb
            phoneNumbers:
              type: array
              items:
                $ref: '#/components/schemas/PhoneNumber'
              description: List of phone numbers associated with this party
              example: []
        email:
          type: object
          properties:
            preferredEmailId:
              type: string
              format: uuid
              example: 2ad51ecf-9923-437f-a6f0-70968e464cdb
            emails:
              type: array
              items:
                $ref: '#/components/schemas/EmailV3'
              description: List of emails associated with this party
              example: []
        revocabilityCode:
          type: string
          description: Code indicating whether the party designation is revocable or irrevocable.
        decedentDob:
          type: string
          description: Date of birth of the decedent, if applicable.
          format: date
        authType:
          type: string
          description: Type of authorization granted to the party.
          enum:
          - ASSETALLOCATION
          - ALL
          - DOLLARCOSTAVERAGING
          - DISTRIBUTION
          - NAMEADDRESSCHANGES
          - FUNDTRANSFER
          - WITHDRAWALS
          - NONE
        authMode:
          type: string
          enum:
          - ALL
          - FAX
          - INTERNET
          - MAIL
          - PHONE
          - VOICERESPONSE
          - NONE
          description: Mode by which authorization was provided, such as electronic or written.
    ApplicationV3:
      type: object
      required:
      - appId
      - submissionType
      - carrierName
      - versionNumber
      - qualificationType
      - suitabilityAppIndicator
      - dateQualifiers
      properties:
        key:
          type: string
          description: Zinnia Unique idenitifer for a case. [Derived by Zinnia]
        appId:
          type: string
          description: Unique Identifier against an e-App application. First 4 letters represent the receiving company, next 3 letters represent the firm, next 8 positions represent the date eApp is submitted, next 10 positions represents the sequential number of the eApps from the eApp instance.
        vendorAppId:
          type: string
          description: Application identifier assigned by an external vendor or partner system.
        versionNumber:
          type: string
          description: Version for that case - 3 digits, incremental if same case if submitted more than once in case of errors.
        qlacIndicator:
          type: string
          description: Flag indicating whether the contract is a Qualified Longevity Annuity Contract (QLAC).
          enum:
          - 'YES'
          - 'NO'
          example: 'YES'
        ofacIndicator:
          type: string
          description: Indicator identifying whether the address is subject to OFAC review or screening.
          enum:
          - 'YES'
          - 'NO'
        fileInceptionTime:
          type: string
          format: date-time
          description: Time when the case is received within ETP
          example: '2025-06-26T00:00:00Z'
        dateQualifiers:
          type: object
          required:
          - initialSubmitDate
          - agentSubmitDate
          properties:
            effectiveDate:
              type: string
              format: date
              description: e-App submitted date to Zinnia (with pattern "yyyy-mm-dd").
            applicationDate:
              type: string
              format: date
              description: Application date (with pattern "yyyy-mm-dd"). This field is required for paper app rate lock calculations.
            initialSubmitDate:
              type: string
              format: date
              description: Initial e-App submitted date (yyyy-mm-dd)
            applicationReceivedDate:
              type: string
              format: date
              description: Application received date (with pattern "yyyy-mm-dd"). Mandatory field for Paper Apps.
            clientAgreementDate:
              type: string
              format: date
              description: Client agreement date (with pattern "yyyy-mm-dd").
            agentSubmitDate:
              type: string
              format: date
              description: Agent submission date (yyyy-mm-dd)
            ownerSignedDate:
              type: string
              format: date
              description: Owner signed date (yyyy-mm-dd)
            jointOwnerSignedDate:
              type: string
              format: date
              description: Joint owner signed date (yyyy-mm-dd)
            annuitantSignedDate:
              type: string
              format: date
              description: Annuitant signed date (yyyy-mm-dd)
            jointAnnuitantSignedDate:
              type: string
              format: date
              description: Joint annuitant signed date (yyyy-mm-dd)
            trusteeSignedDate:
              type: string
              format: date
              description: Trustee signed date (yyyy-mm-dd)
            primaryAgentSignedDate:
              type: string
              format: date
              description: Primary agent signed date (yyyy-mm-dd)
            beneficiarySignedDate:
              type: string
              format: date
              description: Beneficiary signed date (yyyy-mm-dd)
            spouseSignedDate:
              type: string
              format: date
              description: Spouse signed date (yyyy-mm-dd)
        submissionType:
          type: string
          example: ELECTRONIC
          description: To determine whether the request is via eApp or Paper App
          enum:
          - ELECTRONIC
          - PAPER
        customerOtherProductsAnswer:
          type: string
          example: 'YES'
          description: Indicates whether the applicant has existing life insurance or annuity policies. Valid values are Yes, No, or Unknown.
        applicationSignedCounty:
          type: string
          description: County where the application was signed by the customer.
        submitterNsccId:
          type: string
          description: The NSCC assigned membership ID for the firm initiating the transactions.Only applicable for DTCC cases.
        submitterNsccName:
          type: string
          description: Name of the Submitter (Settling Firm).Only applicable for DTCC cases.
        associatedFirmId:
          type: string
          description: Identifier assigned by a clearing firm/service provider to a firm that clears business through them.Only applicable for DTCC cases.
        associatedFirmName:
          type: string
          description: Name of associated firm.Only applicable for DTCC cases.
        vendorId:
          type: string
          description: An identifer that represents Transmitting Company which is of 4 char.
        vendorName:
          type: string
          description: Transmitting Company Name
          example: FIRELIGHT
        carrierName:
          type: string
          description: Name of the U.S. insurance company that is issuing the policy. [Derived by Zinnia]
        carrierId:
          type: number
          description: Carrier Id is DTCC part id for a given insurance carrier such as 4527, 0015.
        firmTaxId:
          type: string
