method: searched
source: https://developers.zinnia.com/ (Kong developer portal API listing), https://developers.zinnia.com/__sitemap__/apis.xml (lastmod dates) and the info.version / Version History blocks inside the ten
  published OpenAPI contracts
versioning:
  scheme: per-service path segment plus semantic info.version
  documented: true
  note: Every service versions its own path prefix independently (/policy/v1, /policy/v2, /document/v2, /document/v3, /case/v1, /case/v2). Major versions run concurrently - the Documents contract publishes
    v2 and v3 operations side by side in one document.
deprecation_policy:
  published: false
  note: 'No deprecation policy, sunset policy or RFC 8594 Sunset/Deprecation header is documented anywhere on the Zinnia developer portal or in any contract. Superseded operations are simply left in the
    same document alongside their successors - the Documents contract still serves five /document/v2/... operations next to the seven /document/v3/... operations that replace them, and none of them is marked
    deprecated: true.'
  deprecated_operations:
  - spec: openapi/zinnia-illustration-client-cases-openapi.yml
    operationId: null
    path: PATCH /client-case-manager/v1/client-case/{caseId}/illustrations/{illustrationId}/submit
  deprecated_operation_count: 1
  shadow_deprecations:
  - superseded: /document/v2/documents, /document/v2/documents/{documentId}, /document/v2/documents/{documentId}/download, /document/v2/taxForms, /document/v2/taxForms/{formId}
    by: /document/v3/... equivalents
    marked_deprecated: false
    spec: openapi/zinnia-documents-openapi.yml
  - superseded: POST /case/v1 surface (getCaseInstanceById)
    by: /case/v2/cases (CreateCaseV2, getCaseInstanceByIdV2)
    marked_deprecated: false
    spec: openapi/zinnia-case-management-openapi.yml
  - superseded: Roughly 40 /bpm/v1/policies/... operations
    by: the /policy/v1/transactions/... routes that a Kong pre-function rewrites onto them
    marked_deprecated: false
    spec: openapi/zinnia-policy-transactions-openapi.yml
    note: x-kong-plugin-pre-function rewrites ^/policy/v1/transactions to /bpm/v1/policies, so both prefixes are live and the older one is still published.
